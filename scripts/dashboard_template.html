<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#101a14; --panel:#16231b; --panel2:#1c2c22; --panel3:#23362a; --line:#2a3f31; --line2:#36503f;
    --ink:#e9e5d3; --ink2:#c9c6b4; --muted:#93a796; --faint:#617566;
    --green:#9fd07c; --green2:#6fae5a; --sand:#e3c97a; --cream:#f1ead0;
    --bad:#e58a76; --warn:#e3c97a; --good:#9fd07c; --info:#88bccd;
    --pixel:"Press Start 2P",ui-monospace,Menlo,monospace;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:10px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--green)}
  .page{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
  :focus-visible{outline:2px solid var(--sand);outline-offset:2px}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,26,20,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 28px;padding:14px 20px}
  .top-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:15px;color:var(--cream);letter-spacing:.04em;text-shadow:2px 2px 0 #0a120d}
  .brand span{color:var(--green)}
  .brand{order:0} .right{order:1} #tourBtn{order:2}
  .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
  .date{display:flex;align-items:center;gap:6px}

  /* buttons: one calm style everywhere */
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;color:var(--ink2);padding:7px 14px;font-size:13.5px;font-weight:400;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .08s;white-space:nowrap}
  .btn:hover{background:var(--panel3);border-color:var(--green2);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn[aria-pressed="true"],.btn[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#132016;font-weight:700}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.sm{padding:5px 11px;font-size:13px}
  .btn.icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%}
  .btn .sw{width:9px;height:9px;border-radius:50%}
  .btn .n{font-family:var(--mono);font-size:12.5px;opacity:.75}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .btn{flex:none}
  .tabs .btn{border:0;background:none;padding:6px 14px}
  .tabs .btn[aria-selected="true"]{background:var(--green);color:#132016}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font:400 13.5px var(--sans);height:34px;cursor:pointer}
  .row-btns{display:flex;flex-wrap:wrap;gap:8px}

  /* type + layout */
  h2{font-size:13px;font-weight:700;line-height:1.5;margin:0;color:var(--cream);letter-spacing:.1em;text-transform:uppercase}
  h3{font-size:16px;margin:0 0 4px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .bad{color:var(--bad)} .warn{color:var(--warn)} .good{color:var(--good)} .info{color:var(--info)}
  .stack{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .chart{position:relative;height:360px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .note{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--sand);background:rgba(227,201,122,.08);border:1px solid rgba(227,201,122,.25);border-radius:999px;padding:4px 12px}

  /* overview strip */
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
  .ov{background:var(--panel);padding:14px 18px}
  .ov .l{color:var(--muted);font-size:12.5px}
  .ov .v{font-family:var(--mono);font-size:22px;color:var(--cream);line-height:1.3}
  .ov .c{font-size:12.5px;color:var(--faint)}
  .ov.now{background:var(--panel2)}
  .ov.now .l{color:var(--green)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .stat .l{color:var(--muted);font-size:13px;font-weight:400}
  .stat .v{font-family:var(--mono);font-size:28px;font-weight:400;line-height:1.15;margin:6px 0 2px;color:var(--cream)}
  .stat .c{font-size:13px;color:var(--muted)}
  .grade{font-size:19px;font-weight:700;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel2);border:1px solid var(--line2)}
  .gA{color:var(--good)} .gB{color:#c3d77c} .gC{color:var(--sand)} .gD{color:#e8a676} .gF{color:var(--bad)}

  /* focus list */
  .focus{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .focus li{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
  .focus .i{font-size:14px;font-weight:700;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--sand)}
  .focus b{display:block;font-weight:700;color:var(--ink)}
  .focus span{color:var(--ink2);font-size:14px}
  details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;color:var(--green);font-size:14px;font-weight:400;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ "} details[open] > summary::before{content:"− "}
  .findings{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
  .findings li{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px;color:var(--ink2);padding:4px 0}
  .findings b{color:var(--ink);font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--faint)}
  .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.info{background:var(--info)}
  .notes{font-size:14px;color:var(--ink2)}
  .notes h3,.notes h4,.notes h5{font-size:14px;color:var(--sand);margin:14px 0 4px}
  .notes ul{padding-left:18px;margin:4px 0} .notes li{margin:3px 0} .notes p{margin:6px 0} .notes strong{color:var(--ink)}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12.5px}

  /* club detail */
  .detail{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:24px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .bigrow{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end;margin-bottom:12px}
  .big{font-family:var(--mono);font-size:44px;line-height:1;color:var(--cream)}
  .big small{font-size:15px;color:var(--muted);margin-left:4px}
  .kv .l{color:var(--muted);font-size:12.5px} .kv .v{font-family:var(--mono);font-size:17px}
  .bars{display:grid;gap:8px;margin-top:8px}
  .bar{display:grid;grid-template-columns:64px 1fr 86px;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
  .bar .track{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;border-radius:4px}
  .bar .val{text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .caveat{font-size:13.5px;color:var(--sand);margin:0 0 10px}

  /* swing */
  .sw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
  .sw-grid svg{display:block;width:100%;height:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .tile{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .tile .l{color:var(--muted);font-size:12.5px} .tile .v{font-size:19px;color:var(--cream)} .tile .c{font-size:12px;color:var(--faint)}
  .crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .crop{background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line);position:relative}
  .crop:hover{border-color:var(--green2)}
  .crop canvas,.crop img{display:block;width:100%;height:auto;aspect-ratio:10/7;object-fit:cover}
  .crop .cap{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2);padding:6px 8px;background:var(--panel)}
  .crop .fr{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 7px;border-radius:999px}
  .scrub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .scrub input[type=range]{flex:1;min-width:160px;accent-color:var(--green)}
  .swlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .swlegend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}

  /* tour */
  .tour{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;width:min(440px,calc(100% - 32px));background:var(--panel2);border:1px solid var(--green2);border-radius:14px;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .tour .step{font-size:12px;color:var(--green);letter-spacing:.08em;text-transform:uppercase}
  .tour h3{margin:4px 0 8px;font-size:17px;color:var(--cream)}
  .tour p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.65}
  .tour p b{color:var(--sand);font-weight:700}
  .tour .acts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
  .tour .dots{display:flex;gap:5px} .tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)} .tour .dots i.on{background:var(--green)}
  .tabs .btn.tour-hl{box-shadow:0 0 0 2px var(--sand);color:var(--ink)}
  .tour p + p{margin-top:6px}
  .tour .mini-title{display:none}
  .tour.mini{padding:10px 14px}
  .tour.mini h3,.tour.mini p,.tour.mini .dots{display:none}
  .tour.mini .mini-title{display:inline}
  .tour.mini .acts{margin-top:8px}
  .tour.at-top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 76px)}
  #vclose.tour-target{z-index:3}
  .tour-show{box-shadow:0 0 0 2px var(--sand),0 0 0 8px rgba(227,201,122,.12);border-color:var(--sand)}
  .tour-target{position:relative;z-index:2;outline:3px solid var(--sand);outline-offset:3px;animation:tourPulse 1.1s ease-in-out infinite}
  @keyframes tourPulse{0%,100%{box-shadow:0 0 0 4px rgba(227,201,122,.55),0 0 0 0 rgba(227,201,122,.45);transform:scale(1)}
                       50%{box-shadow:0 0 0 4px rgba(227,201,122,.55),0 0 0 22px rgba(227,201,122,0);transform:scale(1.07)}}
  #tourPoint{position:fixed;z-index:160;pointer-events:none;background:var(--sand);color:#132016;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;
    box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;animation:tourBounce 1s ease-in-out infinite;transition:left .25s,top .25s}
  #tourPoint::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:7px solid transparent}
  #tourPoint.below::after{bottom:100%;border-bottom-color:var(--sand)} #tourPoint.above::after{top:100%;border-top-color:var(--sand)}
  @keyframes tourBounce{0%,100%{translate:0 0}50%{translate:0 -6px}}
  @media (prefers-reduced-motion:reduce){.tour-target,#tourPoint{animation:none}}

  /* rounds */
  .mix{display:grid;grid-template-columns:70px 1fr;gap:8px 12px;align-items:center;font-size:13px;margin-top:14px}
  .mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel3)}
  .mixbar i{display:block;height:100%}
  .mixkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .mixkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .misses{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .misses svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
  .fwbar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px;font-size:12.5px}
  .fwbar div{display:grid;place-items:center;color:#132016;font-weight:700;min-width:0}
  .heat{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
  .hc{border-radius:8px;padding:6px 4px;text-align:center;color:#132016}
  .hc .h{font-size:11px;font-weight:700;opacity:.8} .hc .v{font-size:15px;font-weight:700} .hc .y{font-size:11px;opacity:.8}
  .bins td,.bins th{text-align:right} .bins td:first-child,.bins th:first-child{text-align:left}

  /* level table */
  .levels-t td.hit{color:var(--green);font-weight:700}
  .levels-t th:nth-child(2),.levels-t td:nth-child(2){color:var(--cream)}

  /* tables */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  td{font-family:var(--mono);font-size:13.5px}
  td:first-child,td.tl{font-family:var(--sans);font-size:14px}
  th{color:var(--muted);font-weight:400;font-size:12.5px}
  th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
  th:first-child,td:first-child,.tl{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  tr.clickable{cursor:pointer}
  tr.sel{background:var(--panel3)}
  .tag{display:inline-block;font-family:var(--sans);font-size:11px;padding:0 7px;border-radius:999px;background:var(--panel3);color:var(--muted);margin-left:6px;vertical-align:1px}
  .tag.warn{color:var(--sand);background:rgba(227,201,122,.12)}
  .cn{display:inline-flex;align-items:center;gap:8px;font-weight:700}
  .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
  img.thumb{width:30px;height:32px;object-fit:cover;border-radius:5px;display:block;background:#000}
  [data-tip]{text-decoration:underline dotted var(--faint);text-underline-offset:3px;cursor:help}
  #tip{position:fixed;z-index:200;max-width:280px;background:#0b130e;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;pointer-events:none}

  /* viewer */
  .viewer{position:fixed;inset:0;z-index:150;background:rgba(6,10,8,.8);display:flex;align-items:center;justify-content:center;padding:16px}
  .vbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(1040px,100%);max-height:100%;overflow:auto;padding:22px}
  .vgrid{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:16px}
  .vgrid > *,.detail > *,.sw-grid > *,.drill > *{min-width:0}   /* long filmstrips/tables must not widen their column */
  .frame{background:#000;border-radius:8px;overflow:hidden;position:relative}
  .frame img{width:100%;height:auto;display:block}
  .frame .cap{position:absolute;left:8px;top:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:999px}
  .player{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .player input[type=range]{flex:1;min-width:140px;accent-color:var(--green)}
  .strip{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
  .strip img{height:40px;border-radius:4px;opacity:.4;cursor:pointer;flex:none;border:2px solid transparent}
  .strip img.on{opacity:1;border-color:var(--green)}
  .vstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:16px}
  .vstat{background:var(--panel2);border-radius:8px;padding:8px 12px}
  .vstat .l{color:var(--muted);font-size:12px} .vstat .v{font-family:var(--mono);font-size:17px} .vstat .b{font-size:11.5px;color:var(--faint)}

  /* drills */
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .lvl{background:var(--panel2);border-radius:8px;padding:14px}
  .lvl .t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sand)}
  .lvl .nm{font-weight:700;margin:6px 0 8px}
  .task{display:flex;gap:9px;align-items:flex-start;padding:3px 0;font-size:13.5px;color:var(--ink2);cursor:pointer}
  .task input{accent-color:var(--green);width:16px;height:16px;margin-top:3px;flex:none}
  .task input:checked + span{text-decoration:line-through;color:var(--faint)}
  .drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
  .drill .lv{font-size:12.5px;color:var(--sand);font-weight:400}
  .drill h3{font-size:19px;margin:4px 0 6px}
  .drill ol{padding-left:20px;margin:8px 0;color:var(--ink2)} .drill li{margin:4px 0}
  .drill .tgt{font-size:14px;margin:10px 0;color:var(--ink)}
  .yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000 center/cover no-repeat;cursor:pointer;overflow:hidden;padding:0}
  .yt::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:40px;border-radius:10px;background:rgba(16,26,20,.85);color:var(--green);display:grid;place-items:center;font-size:18px;transition:background .15s}
  .yt:hover::after{background:var(--green);color:#132016}
  div.yt::after{display:none}
  .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-cap{font-size:13px;color:var(--muted);margin:6px 0 12px;display:flex;justify-content:space-between;gap:8px}
  .resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .res{display:block;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink2);font-size:13.5px}
  .res:hover{border-color:var(--green2)}
  .res b{display:block;color:var(--green);font-size:15px}
  .proj{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .proj > div{background:var(--panel2);border-radius:8px;padding:14px}
  .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:2px 0}
  .r span:last-child{font-family:var(--mono);color:var(--ink)}
  .empty{color:var(--muted);font-style:italic}
  footer{color:var(--faint);font-size:12.5px;margin-top:36px}

  @media (max-width:860px){
    .sw-grid{grid-template-columns:1fr}
    .misses{grid-template-columns:1fr}
    .overview{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:1fr}
    .detail,.planner,.vgrid,.drill,.proj{grid-template-columns:minmax(0,1fr)}
    .levels{grid-template-columns:1fr 1fr}
    .scorecard{grid-template-columns:repeat(9,minmax(34px,1fr));overflow-x:auto}
    .chart{height:300px}

<script>
const DATA = __DATA__;

/* ================= reference data ================= */
// TrackMan tour averages (legacy published table; 2023 update lists PGA 7i at 176 yd / 92 mph / 123 mph ball / 1.34).
const T = (club,ball,smash,launch,spin,apex,descent,carry) => ({club,ball,smash,launch,spin,apex,descent,carry});
const BENCH = {
  pga: {Dr:T(113,167,1.48,10.9,2686,32,38,275), "3W":T(107,158,1.48,9.2,3655,30,43,243), "3H":T(100,146,1.46,10.2,4437,29,47,225),
        "6i":T(92,127,1.38,14.1,6231,30,50,183), "7i":T(90,120,1.33,16.3,7097,32,50,172), "8i":T(87,115,1.32,18.1,7998,31,50,160),
        "9i":T(85,109,1.28,20.4,8647,30,51,148), PW:T(83,102,1.23,24.2,9304,29,52,136)},
  lpga:{Dr:T(94,140,1.48,13.2,2611,25,37,218), "3W":T(90,132,1.47,11.2,2704,23,39,195), "7W":T(85,123,1.45,12.7,4693,25,46,174),
        "6i":T(78,109,1.40,17.1,5943,25,46,152), "7i":T(76,104,1.37,19.0,6699,26,47,141), "8i":T(74,100,1.35,20.8,7494,25,47,130),
        "9i":T(72,93,1.29,23.9,7589,26,47,119), PW:T(70,86,1.23,25.6,8403,23,48,107)},
  hcp25:{"6i":{carry:137},"7i":{carry:132},"8i":{carry:122},"9i":{carry:108}},
};
// Amateur benchmarks. Only what the sources publish; gaps stay blank (no extrapolation).
// - Distance by handicap: Shot Scope on-course averages (closest to TOTAL distance, so compared with your total).
// - Speed by handicap: GolfLaunchLab (aggregated Shot Scope / Arccos / TrackMan amateur data); published for driver and 7-iron only.
// - Average male amateur per club: GolfLaunchLab (TrackMan published averages + shot-tracking data).
const AMATEUR = {
  total:{ "6i":{0:185,10:171,15:162,20:151,25:137}, "7i":{0:178,10:161,15:154,20:146,25:132}, "8i":{0:166,10:150,15:146,20:138,25:122},
          "9i":{0:155,10:140,15:136,20:129,25:108}, PW:{0:141,10:127,15:121,20:108} },
  carry:{ Dr:{0:272,5:249,10:230,15:217,20:202,25:186} },
  club: { "7i":{0:87,5:83,10:79,15:75,20:72,25:68}, Dr:{0:113,5:105,10:97,15:93,20:89,25:84} },
  ball: { "7i":{0:116,5:110,10:103,15:97,20:92,25:85}, Dr:{0:161,5:150,10:140,15:133,20:126,25:117} },
  avg:  { Dr:{club:93,ball:132}, "3W":{club:87,ball:123}, "3H":{club:82,ball:114}, "6i":{club:75,ball:101}, "7i":{club:75,ball:96},
          "8i":{club:72,ball:91}, "9i":{club:70,ball:86}, PW:{club:68,ball:80}, "56":{club:64,ball:71}, "60":{club:60} },
};
const HCP = DATA.bag.player?.handicap ?? 25;
const LEVELS = [["PGA Tour","pga"],["LPGA Tour","lpga"],["Avg amateur","avg"],["Scratch",0],["5",5],["10",10],["15",15],["20",20],["25",25]];
// Which handicap your value matches (higher = better metrics). Linear between published levels; extrapolated past the last one.
function hcpEquivalent(v, ladder){
  const pts = Object.entries(ladder||{}).map(([h,x])=>[+h,x]).sort((a,b)=>a[0]-b[0]);
  if (v==null || pts.length<2) return null;
  if (v >= pts[0][1]) return pts[0][0];
  for (let i=0;i<pts.length-1;i++){ const [h1,a]=pts[i],[h2,b]=pts[i+1]; if (v<=a && v>=b) return h1+(a-v)/(a-b)*(h2-h1); }
  const [h1,a]=pts[pts.length-2],[h2,b]=pts[pts.length-1]; return h2+(b-v)/((a-b)/(h2-h1));
}
// Grade relative to YOUR handicap: C = playing to it, A/B = like a better player, D/F = below it.
const hcpGrade = eq => eq==null ? null : eq<=HCP-10 ? "A" : eq<=HCP-4 ? "B" : eq<=HCP+4 ? "C" : eq<=HCP+8 ? "D" : "F";
const eqLabel = (eq, ladder) => { if (eq==null) return "—"; const best=Math.min(...Object.keys(ladder).map(Number));
  return eq<=best ? (best===0?"scratch+":`${best} or better`) : `~${Math.round(eq)}`; };
const ratioLadder = (num, den) => num && den ? Object.fromEntries(Object.keys(num).filter(h=>den[h]).map(h=>[h, +(num[h]/den[h]).toFixed(3)])) : null;

const METRICS = [
  {k:"carry",label:"Carry",unit:"yd",shot:"carry",dp:1},{k:"total",label:"Total",unit:"yd",shot:"total",dp:1},
  {k:"ball",label:"Ball speed",unit:"mph",shot:"ballSpeed",dp:1},{k:"club",label:"Club speed",unit:"mph",shot:"clubSpeed",dp:1},
  {k:"smash",label:"Smash",unit:"",shot:"smash",dp:2},{k:"launch",label:"Launch",unit:"°",shot:"launch",dp:1},
  {k:"spin",label:"Back spin",unit:"rpm",shot:"backSpin",dp:0},{k:"apex",label:"Apex",unit:"yd",shot:"apex",dp:1},
  {k:"descent",label:"Land angle",unit:"°",shot:"descent",dp:1},{k:"path",label:"Club path",unit:"°",shot:"path",dp:1,zero:true},
  {k:"f2p",label:"Face-to-path",unit:"°",shot:"f2p",dp:1,zero:true},{k:"side",label:"Finish L/R",unit:"yd",shot:"side",dp:1,zero:true},
];
const MET = Object.fromEntries(METRICS.map(m=>[m.k,m]));
const GLOSS = {
  carry:"Distance the ball flies in the air.", total:"Carry plus roll.", spread:"About two-thirds of shots land within ± this of your average carry.",
  smash:"Ball speed ÷ club speed: how centred the strike was. Irons: 1.30+ is good.",
  path:"Club direction through impact. Negative = out-to-in (slice path). Tour ≈ 0 ± 2°.",
  f2p:"Face minus path. Positive = ball curves right. Keep within ±3°.", side:"How far left/right of the target the ball finished.",
  launch:"Vertical launch angle.", apex:"Peak height.", spin:"Backspin rpm.", ball:"Ball speed off the face.", club:"Club head speed.",
  descent:"Landing angle. Steeper stops faster.", face:"Face direction at impact vs. target.",
  gain:"Extra carry per iron if your contact reached a realistic smash (1.30, or the LPGA average for shorter irons) at the club speed you already have. Carry is scaled with ball speed from this session.",
};
const MAIN = DATA.bag.sets[0].clubs;
const CLUB = Object.fromEntries(MAIN.map(c=>[c.key,c]));
const SHORT = {Dr:"Driver","3W":"3W","3H":"3H","7W":"7W","6i":"6i","7i":"7i","8i":"8i","9i":"9i",PW:"PW",AW:"AW","51":"GW","56":"SW","60":"LW",Putter:"Putter"};
const nameOf = k => SHORT[k] || k;
const loftOf = k => CLUB[k]?.loft ?? 99;
const IRON = k => { const l = loftOf(k); return l >= 24 && l <= 41; };
const WEDGE = k => loftOf(k) > 41 && loftOf(k) < 99;
const COLORS = {Dr:"#e9a178","3W":"#e8c170","3H":"#d6d07a","7W":"#b4d07a","6i":"#8fcf8a","7i":"#6cc4a4","8i":"#e3c97a","9i":"#e09078",PW:"#b9a3e3",AW:"#84bcd9","51":"#e39bc0","56":"#b8a48c","60":"#9fb3ad"};
const colorOf = k => COLORS[k] || "#93a796";
const alpha = (hex,a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };

/* ================= helpers ================= */
const vals = a => a.filter(x => x != null && !Number.isNaN(x));
const mean = a => { a = vals(a); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const median = a => { a = vals(a).sort((x,y)=>x-y); if(!a.length) return null; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; };
const sd = a => { a = vals(a); const m = mean(a); return a.length>1 ? Math.sqrt(mean(a.map(x=>(x-m)**2))) : null; };
const corr = (a,b) => { const p=a.map((x,i)=>[x,b[i]]).filter(([x,y])=>x!=null&&y!=null); if(p.length<5) return null;
  const ma=mean(p.map(q=>q[0])), mb=mean(p.map(q=>q[1])), sa=sd(p.map(q=>q[0])), sb=sd(p.map(q=>q[1]));
  return sa&&sb ? mean(p.map(([x,y])=>(x-ma)*(y-mb)))/(sa*sb) : null; };
const f = (x,d=1) => x==null||Number.isNaN(x) ? "—" : x.toFixed(d);
const sg = (x,d=1) => x==null ? "—" : (x>0?"+":"")+x.toFixed(d);
const lr = (x,d=0) => x==null ? "—" : Math.abs(x) < 0.5 ? "centre" : `${Math.abs(x).toFixed(d)} ${x>0?"R":"L"}`;
const fm = (m,v) => v==null ? "—" : (m.zero ? sg(v,m.dp) : m.k==="spin" ? Math.round(v).toLocaleString() : v.toFixed(m.dp)) + (m.unit && m.unit!=="°" ? " "+m.unit : m.unit);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tip = (k,label) => GLOSS[k] ? `<span data-tip="${esc(GLOSS[k])}">${label}</span>` : label;
const $ = id => document.getElementById(id);
const sw = k => `<span class="sw" style="background:${colorOf(k)}"></span>`;
const store = { get(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} } };

Chart.defaults.color = "#93a796";
Chart.defaults.borderColor = "rgba(233,229,211,.07)";
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12.5;
Object.assign(Chart.defaults.plugins.tooltip, {backgroundColor:"#0b130e", borderColor:"#36503f", borderWidth:1, padding:10, cornerRadius:8, titleColor:"#e9e5d3", bodyColor:"#c9c6b4"});
Object.assign(Chart.defaults.plugins.legend.labels, {usePointStyle:true, boxWidth:7, boxHeight:7, padding:16});
const charts = {};
function draw(id,cfg){ charts[id]?.destroy(); const el=$(id); if(el) charts[id]=new Chart(el,cfg); }
const grid = {color:"rgba(233,229,211,.06)"};

/* ================= analysis ================= */
function analyze(s){
  const keys = Object.keys(s.clubs).sort((a,b)=>loftOf(a)-loftOf(b));
  const ironSpeed = mean(keys.filter(IRON).flatMap(k=>s.clubs[k].map(r=>r.clubSpeed)));
  const meta = s.meta || {}, clubs = {};
  for (const k of keys){
    const shots = s.clubs[k].map(r=>({...r, key:k, f2p:(r.face!=null&&r.path!=null)?+(r.face-r.path).toFixed(1):null,
      suspect:(loftOf(k)>=24 && r.smash>1.38) || (loftOf(k)>=27 && loftOf(k)<=41 && r.backSpin<2500)}));
    const g = p => shots.map(r=>r[p]);
    const cs = mean(g("clubSpeed"));
    clubs[k] = { key:k, shots, n:shots.length, partial: WEDGE(k) && ironSpeed!=null && cs < 0.9*ironSpeed, caveat: meta.caveats?.[k] || null,
      carry:mean(g("carry")), total:mean(g("total")), roll:mean(shots.map(r=>r.total-r.carry)), carrySd:sd(g("carry")), totalSd:sd(g("total")),
      cmin:Math.min(...vals(g("carry"))), cmax:Math.max(...vals(g("carry"))), sideSd:sd(g("side")),
      smash:median(g("smash")), ball:mean(g("ballSpeed")), club:cs, spin:mean(g("backSpin")), launch:mean(g("launch")),
      apex:mean(g("apex")), descent:mean(g("descent")), path:mean(g("path")), face:mean(g("face")), f2p:mean(g("f2p")), side:mean(g("side")) };
  }
  const full = keys.filter(k=>!clubs[k].partial).flatMap(k=>clubs[k].shots);
  return { s, meta, keys, clubs, full };
}
// Per iron: average club speed (likely misreads removed), ball speed, carry, and the carry a realistic smash would give at that speed
// (1.30, or the LPGA average for that club if lower).
// Carry is scaled in proportion to ball speed (carry/ball ratio from this session), a reasonable approximation for small changes.
const SMASH_GOAL = 1.30;
function distanceModel(A){
  const rows = A.keys.filter(k=>IRON(k) && !A.clubs[k].partial).map(k=>{
    const c = A.clubs[k], clean = c.shots.filter(r=>!r.suspect);
    if (clean.length < 3) return null;
    const cs = mean(clean.map(r=>r.clubSpeed)), ball = mean(clean.map(r=>r.ballSpeed)), carry = mean(clean.map(r=>r.carry));
    const goal = Math.min(SMASH_GOAL, BENCH.lpga[k]?.smash ?? SMASH_GOAL);   // shorter irons top out lower (Tour PW ≈ 1.23)
    const smash = ball/cs, gain = smash < goal ? carry/ball*(cs*goal - ball) : 0;
    return {k, cs, ball, carry, smash, goal, gain};
  }).filter(Boolean);
  const zs = [];
  for (const k of A.keys.filter(k=>!A.clubs[k].partial)){
    const sh = A.clubs[k].shots.filter(r=>!r.suspect && r.smash!=null && r.carry!=null); if (sh.length<4) continue;
    const m1=mean(sh.map(r=>r.smash)), s1=sd(sh.map(r=>r.smash)), m2=mean(sh.map(r=>r.carry)), s2=sd(sh.map(r=>r.carry));
    if (s1 && s2) sh.forEach(r=>zs.push([(r.smash-m1)/s1,(r.carry-m2)/s2]));
  }
  return { rows, avgGain: rows.length ? mean(rows.map(r=>r.gain)) : null, rSmashCarry: zs.length>=15 ? corr(zs.map(z=>z[0]),zs.map(z=>z[1])) : null };
}

// Clubs you can compare: full swings this session that have at least one published benchmark.
const hasBench = k => !!(BENCH.pga[k] || BENCH.lpga[k] || AMATEUR.avg[k] || AMATEUR.total[k] || AMATEUR.carry[k]);
const cmpClubs = A => A.keys.filter(k=>!A.clubs[k].partial && hasBench(k));
function levelRows(A, k){
  const c = A.clubs[k]; if (!c) return [];
  const clean = c.shots.filter(r=>!r.suspect), cl = clean.length >= 3 ? clean : c.shots;   // speeds/smash/spin skip likely misreads
  const cs = mean(cl.map(r=>r.clubSpeed)), ball = mean(cl.map(r=>r.ballSpeed));
  const P = BENCH.pga[k]||{}, L = BENCH.lpga[k]||{}, AV = AMATEUR.avg[k]||{};
  const row = (label, key, unit, dp, you, tour, avg, ladder, judged=true, note="") => ({label, key, unit, dp, you, tour, avg, ladder, judged, note});
  const rows = [
    row("Club speed","club"," mph",1, cs, {pga:P.club, lpga:L.club}, AV.club, AMATEUR.club[k]),
    row("Ball speed","ball"," mph",1, ball, {pga:P.ball, lpga:L.ball}, AV.ball, AMATEUR.ball[k]),
    row("Smash","smash","",2, cs?ball/cs:null, {pga:P.smash, lpga:L.smash}, AV.club&&AV.ball?AV.ball/AV.club:null, ratioLadder(AMATEUR.ball[k], AMATEUR.club[k])),
    row("Carry","carry"," yd",0, c.carry, {pga:P.carry, lpga:L.carry}, null, AMATEUR.carry[k]),
    row("Total","total"," yd",0, c.total, {}, null, AMATEUR.total[k], true, "Shot Scope on-course averages include roll, so they're compared with your total."),
    row("Launch","launch","°",1, mean(c.shots.map(r=>r.launch)), {pga:P.launch, lpga:L.launch}, null, null, false, "Not graded: the right launch depends on loft and speed."),
    row("Back spin","spin"," rpm",0, mean(cl.map(r=>r.backSpin)), {pga:P.spin, lpga:L.spin}, null, null, false, "Not graded: the right spin depends on loft and speed."),
  ];
  return rows.filter(r=>r.you!=null && (r.tour.pga!=null || r.tour.lpga!=null || r.avg!=null || r.ladder))
    .map(r=>({...r, eq: r.judged ? hcpEquivalent(r.you, r.ladder) : null})).map(r=>({...r, grade:hcpGrade(r.eq)}));
}

function findings(A){
  const F = [], {clubs, keys, full} = A;
  const fp = mean(full.map(r=>r.path)), ff = mean(full.map(r=>r.f2p)), fface = mean(full.map(r=>r.face));
  const D = distanceModel(A);
  if (D.avgGain!=null && D.avgGain >= 3) F.push({sev:"bad", t:`Strike is costing you ~${f(D.avgGain,0)} yd per iron`,
    b:`At the speed you already swing, solid contact (smash ${D.rows.filter(r=>r.gain>=1).map(r=>`${nameOf(r.k)} ${r.goal.toFixed(2)}`).join(", ")}) would add ${D.rows.filter(r=>r.gain>=1).map(r=>`${nameOf(r.k)} +${f(r.gain,0)}`).join(", ")} yd.`+(D.rSmashCarry!=null?` Within each club, carry follows smash closely (r = ${f(D.rSmashCarry,2)}).`:"")});
  const withL = D.rows.filter(r=>BENCH.lpga[r.k]?.club && BENCH.lpga[r.k]?.ball);
  if (withL.length){
    const sp = Math.round(mean(withL.map(r=>r.cs/BENCH.lpga[r.k].club))*100), bp = Math.round(mean(withL.map(r=>r.ball/BENCH.lpga[r.k].ball))*100);
    F.push({sev: sp>=96 ? "info" : "warn", t: sp>=96 ? "Speed isn't the problem" : "Speed is a limiter",
      b:`Across ${withL.map(r=>nameOf(r.k)).join(", ")}, your club speed is ${sp}% of LPGA Tour speed but your ball speed is only ${bp}% (likely misreads removed). The gap is in how speed turns into ball speed.`});
  }
  const consistent = sd(full.map(r=>r.path)) < 3.5 && sd(full.map(r=>r.f2p)) < 4;
  if (consistent && fp!=null && ff!=null && fp < -2 && ff > 3){
    F.push({sev:"info", t:`Consistent fade pattern (path ${sg(fp)}°, face-to-path ${sg(ff)}°)`, b:"It repeats, so it's playable: aim for it. Trimming the path toward −5° would still add a few yards, since less out-to-in swings carried a little further."});
  } else if (fp!=null){
    const nOut = full.filter(r=>r.path<=-6).length;
    if (fp < -4) F.push({sev:"bad", t:`Swinging out-to-in (${sg(fp)}°)`, b:`${nOut} of ${full.length} full swings were −6° or worse. This is the root of the slice and the heel strikes.`});
    else if (fp < -2) F.push({sev:"warn", t:`Path slightly out-to-in (${sg(fp)}°)`, b:"Close to the ±2° window."});
    else if (fp > 4) F.push({sev:"warn", t:`Path in-to-out (${sg(fp)}°)`, b:"Watch for pushes and hooks."});
    else F.push({sev:"good", t:`Neutral path (${sg(fp)}°)`, b:"Inside the target window."});
  }
  if (!consistent && ff!=null){
    if (ff > 3) F.push({sev:"bad", t:`Ball curving right (face ${sg(ff)}° open to path)`, b: Math.abs(fface)<3 ? `Your face to the target is only ${sg(fface)}°, so fix the path, not the face.` : "The face is open to the path."});

  } else if (v==="curve"){

    const diag = {id:"diag",afterDatasetsDraw(ch){const {ctx,scales:{x,y},chartArea:a}=ch;ctx.save();ctx.beginPath();ctx.rect(a.left,a.top,a.right-a.left,a.bottom-a.top);ctx.clip();ctx.setLineDash([4,4]);ctx.strokeStyle="rgba(233,229,211,.25)";ctx.beginPath();ctx.moveTo(x.getPixelForValue(lo),y.getPixelForValue(lo));ctx.lineTo(x.getPixelForValue(hi),y.getPixelForValue(hi));ctx.stroke();ctx.restore();}};
    draw("cMain",{type:"scatter",plugins:[pathBand,diag],data:{datasets:scatter(r=>r.face)},options:{...base,scales:{x:{min:lo,max:hi,grid,title:{display:true,text:"Club path (°)  ← out-to-in"}},y:{min:lo,max:hi,grid,title:{display:true,text:"Face to target (°)"}}},plugins:{legend:{position:"bottom"},tooltip:{callbacks:{title:tipTitle,label:c=>shotTip(c.raw.r)}}}}});
  } else if (v==="strike"){

    draw("cMain",{type:"scatter",plugins:[pathBand],data:{datasets:scatter(r=>r.smash)},options:{...base,scales:{x:{min:lo,max:4,grid,title:{display:true,text:"Club path (°)  ← out-to-in"}},y:{grid,title:{display:true,text:"Smash factor"}}},plugins:{legend:{position:"bottom"},tooltip:{callbacks:{title:tipTitle,label:c=>shotTip(c.raw.r)}}}}});
  } else {
    note("Carry by loft. Each step down in loft should add 10–12 yd; a flat stretch means two clubs overlap. Hollow points (*) are partial swings. Tap a club to focus it.");
    const lk = keys.filter(k=>CLUB[k]?.loft!=null);

      plugins:[{id:"names",afterDatasetsDraw(ch){const {ctx}=ch, meta=ch.getDatasetMeta(0); ctx.save(); ctx.font="12px Space Mono, monospace"; ctx.textAlign="center";
        meta.data.forEach((pt,i)=>{ const k=lk[i]; ctx.fillStyle=alpha(colorOf(k),on(k)?1:.35); ctx.fillText(nameOf(k)+(clubs[k].partial?"*":""), pt.x, pt.y-14); }); ctx.restore();}}],
      options:{maintainAspectRatio:false,parsing:false,interaction:{mode:"nearest",intersect:true},onClick:(e,els)=>{const el=els.find(x=>x.datasetIndex===0); if(el){state.club=lk[el.index];render();}},
        scales:{x:{type:"linear",grid,title:{display:true,text:"Loft (°)"},ticks:{callback:v=>v+"°"}},y:{grid,title:{display:true,text:"Yards"}}},

}

/* ================= club model (measured or estimated) ================= */
function latestFor(k){
  for (let i=ALL.length-1;i>=0;i--){ const c=ALL[i].clubs[k]; if (c && !c.partial) return {c, date:sName(i)}; }
  for (let i=ALL.length-1;i>=0;i--){ const c=ALL[i].clubs[k]; if (c) return {c, date:sName(i)}; }
  return null;
}
// Clubs not measured yet are estimated from the latest full 7-iron (carry ratio, roll %), or from the AW for wedges.
const EST = {Dr:[1.55,.12],"3W":[1.40,.09],"3H":[1.25,.07],"7W":[1.15,.06],"6i":[1.04,.07]};
const WEST = {"51":12,"56":24,"60":34};
function clubModel(k){
  const L = latestFor(k);
  if (L && !L.c.partial){
    const c=L.c; return {key:k, carry:c.carry, total:c.total, carrySd:c.carrySd||5, totalSd:c.totalSd||c.carrySd||5, side:c.side||0, sideSd:c.sideSd||6,
      shots:c.shots, est:false, caveat:c.caveat, date:L.date};
  }
  const L7 = latestFor("7i"), LA = latestFor("AW"), s7 = L7&&!L7.c.partial ? L7.c : null;
  if (EST[k] && s7){ const [r,roll]=EST[k]; const carry=s7.carry*r;
    return {key:k, carry, total:carry*(1+roll), carrySd:(s7.carrySd||8)*r, totalSd:(s7.carrySd||8)*r*1.05, side:(s7.side||0)*r, sideSd:(s7.sideSd||10)*Math.pow(r,1.4),
      shots:[], est:true, caveat:s7.caveat?"Estimated from a 7-iron flagged as a possible outlier.":null}; }
  if (WEST[k]!=null && LA && !LA.c.partial){ const a=LA.c, carry=a.carry-WEST[k];
    return {key:k, carry, total:carry*1.03, carrySd:a.carrySd||5, totalSd:a.carrySd||5, side:a.side||0, sideSd:a.sideSd||4, shots:[], est:true}; }
  return null;
}

const curShot = () => ALL[V.i].clubs[V.key]?.shots.find(r=>r.n===V.n);
function openShot(i,key,n){ V.i=i;V.key=key;V.n=n;V.frame=0;stopPlay();renderViewer();vEl.hidden=false;document.body.style.overflow="hidden";startPlay(); }
function closeShot(){ stopPlay(); vEl.hidden=true; document.body.style.overflow=""; if (typeof tourStep!=="undefined" && tourStep>=0) applyTour(); }
function stepShot(d){ const L=sessionShots(V.i), j=L.findIndex(r=>r.key===V.key&&r.n===V.n), r=L[j+d]; if(r){const p=!!V.timer;stopPlay();V.key=r.key;V.n=r.n;V.frame=0;renderViewer();if(p)startPlay();} }
function setFrame(fi){ const fr=curShot()?.img?.frames||[]; if(!fr.length) return; V.frame=(fi+fr.length)%fr.length;
  $("vf").src=fr[V.frame]; $("vr").value=V.frame; $("vfc").textContent=`${V.frame+1}/${fr.length}`;
  document.querySelectorAll("#vstrip img").forEach((im,j)=>im.classList.toggle("on",j===V.frame)); const on=document.querySelector("#vstrip img.on"), strip=$("vstrip");
  if (on && strip) strip.scrollLeft = on.offsetLeft - strip.clientWidth/2 + on.clientWidth/2; }   // sideways only: never scroll the page/viewer
function startPlay(){ const fr=curShot()?.img?.frames||[]; if(fr.length<2) return; stopPlay(); V.timer=setInterval(()=>setFrame(V.frame+1),110/V.speed); $("vplay")&&($("vplay").textContent="Pause"); }
function stopPlay(){ if(V.timer){clearInterval(V.timer);V.timer=null;} $("vplay")&&($("vplay").textContent="Play"); }

      <div class="row-btns"><button class="btn sm" id="vprev" ${j<=0?"disabled":""}>‹ Prev</button><button class="btn sm" id="vnext" ${j>=L.length-1?"disabled":""}>Next ›</button><button class="btn icon" id="vclose" aria-label="Close">✕</button></div></div>
    <div class="vgrid">

      <div><div class="frame">${fr.length?`<img id="vf" src="${esc(fr[0])}" alt="Top-view frame">`:""}<span class="cap">Top view</span></div>

          <input type="range" id="vr" min="0" max="${fr.length-1}" value="0" aria-label="Frame"><span class="num muted small" id="vfc">1/${fr.length}</span>
          <select id="vspeed" aria-label="Speed">${[[.25,"¼×"],[.5,"½×"],[1,"1×"],[2,"2×"]].map(([v,l])=>`<option value="${v}" ${v===V.speed?"selected":""}>${l}</option>`).join("")}</select></div>

    </div>
    <div class="vstats">${st("Carry","carry",f(r.carry)+" yd",tb("carry"))}${st("Finish","side",lr(r.side,1))}${st("Ball speed","ball",f(r.ballSpeed)+" mph",tb("ball"))}${st("Club speed","club",f(r.clubSpeed)+" mph",tb("club"))}${st("Smash","smash",f(r.smash,2),tb("smash"))}${st("Launch","launch",f(r.launch)+"°",tb("launch"))}${st("Spin","spin",r.backSpin==null?"—":Math.round(r.backSpin).toLocaleString(),tb("spin"))}${st("Path","path",sg(r.path)+"°","Tour ≈ 0")}${st("Face-to-path","f2p",sg(r.f2p)+"°","goal ±3")}</div>

    $("vr").oninput=e=>{stopPlay();setFrame(+e.target.value);}; $("vspeed").onchange=e=>{V.speed=+e.target.value;if(V.timer)startPlay();};

vEl.addEventListener("click",e=>{if(e.target===vEl)closeShot();});
document.addEventListener("keydown",e=>{ if(vEl.hidden) return;
  if(e.key==="Escape")closeShot(); else if(e.key==="ArrowRight"){e.preventDefault();stopPlay();setFrame(V.frame+1);} else if(e.key==="ArrowLeft"){e.preventDefault();stopPlay();setFrame(V.frame-1);}
  else if(e.key==="ArrowDown"){e.preventDefault();stepShot(1);} else if(e.key==="ArrowUp"){e.preventDefault();stepShot(-1);} else if(e.key===" "){e.preventDefault();V.timer?stopPlay():startPlay();} });

/* ================= ROUNDS (18Birdies) ================= */
// Rounds arrive month-only and in order (seq). Scorecards in courses.json are linked by birdiesName.
const ROUNDS = (DATA.rounds || []).slice().sort((a,b)=>a.seq-b.seq);
const RCOURSE = Object.fromEntries((DATA.courses||[]).filter(c=>c.birdiesName).map(c=>[c.birdiesName,c]));
const mLabel = m => new Date(m+"-15T12:00:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"});
const per18 = r => r.toPar/r.holes*18;
const pct = x => x==null ? "—" : `${Math.round(x*100)}%`;
const sum = (rs,k) => rs.reduce((n,r)=>n+(r.stats?.[k]||0),0);
const trailing = (arr,n,fn) => arr.map((_,i)=>{ const w=arr.slice(Math.max(0,i-n+1),i+1); return w.length>=Math.min(n,3)?fn(w):null; });
// WHS-style: average of the best 8 of the last 20 round handicaps (fewer rounds: best ~40%).
const whs = H => { const h=H.filter(x=>x!=null).slice(-20); if (h.length<3) return null; const n=h.length>=20?8:Math.max(1,Math.round(h.length*.4)); return mean(h.slice().sort((a,b)=>a-b).slice(0,n)); };
// Hole scores where par + yardage are known (scorecard course, tee played, full-length round).
function knownHoles(){
  const pts = [];
  for (const r of ROUNDS){ const c = RCOURSE[r.course];
    if (!r.complete || !c || !c.tees[r.tee] || r.holes!==c.par.length) continue;
    r.holeStrokes.forEach((st,i)=>pts.push({cid:c.id, i, par:c.par[i], yd:c.tees[r.tee][i], over:st-c.par[i]})); }
  return pts;
}
// Strokes per yard, comparing holes only with holes of the same par.
function yardSlope(pts){ let num=0, den=0;
  for (const p of [3,4,5]){ const g=pts.filter(q=>q.par===p); if (g.length<5) continue;
    const mx=mean(g.map(q=>q.yd)), my=mean(g.map(q=>q.over)); g.forEach(q=>{num+=(q.yd-mx)*(q.over-my); den+=(q.yd-mx)**2;}); }
  return den ? num/den : null; }

function renderRounds(){

  const p = full.map(per18), n10 = Math.min(10, Math.floor(full.length/2));
  const first = mean(p.slice(0,n10)), last = mean(p.slice(-n10)), idx = whs(full.map(r=>r.roundHandicap));
  const holes = rs => rs.reduce((n,r)=>n+r.holes,0);
  const dbl = sum(full,"doubleBogeyOrWorse")/holes(full), recent = full.slice(-n10), dbl10 = sum(recent,"doubleBogeyOrWorse")/holes(recent);
  const months = [...new Set(ROUNDS.map(r=>r.month))];
  const card = (l,key,v,c) => `<div class="stat"><div><div class="l">${key?tip(key,l):l}</div><div class="v">${v}</div><div class="c">${c}</div></div></div>`;

  const gN = g.hit+g.L+g.R+g.S+g.Lo+g.N, gMiss = g.L+g.R+g.S+g.Lo;

  const p3 = KH.filter(q=>q.par===3), bins = [[0,120],[120,150],[150,999]].map(([lo,hi])=>{ const b=p3.filter(q=>q.yd>=lo&&q.yd<hi); return {lo,hi,n:b.length, over:mean(b.map(q=>q.over)), dbl:b.length?b.filter(q=>q.over>=2).length/b.length:null}; }).filter(b=>b.n);

    </section>

        <span class="muted small">▲ = 9-hole round (scaled to 18)</span></div>
      <div class="chart" style="height:300px"><canvas id="rTrend"></canvas></div>
      <div class="mix"><span class="muted">All</span>${mixBar(full)}<span class="muted">Last ${n10}</span>${mixBar(recent)}</div>
      <div class="mixkey">${mixOf(full).map(([l,,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>
    </section>
    <section class="card">
      <div class="head"><h2>Where you miss</h2></div>
      <div class="misses">
        <div>${target}<p class="sub" style="text-align:center;margin:4px 0 0">Green misses (${gMiss} recorded): mostly <b style="color:var(--sand)">${big[0]}</b>, ${pct(big[1]/Math.max(1,gMiss))}${g.N?` · ${g.N} no chance`:""}</p></div>

          <div class="fwbar" aria-label="Left ${fw.L}, fairway ${fw.M}, right ${fw.R}, short or long ${fw.S+fw.Lo}">${fwSeg(fw.L,"#e3c97a","Left")}${fwSeg(fw.M,"#9fd07c","Fairway")}${fwSeg(fw.R,"#e3c97a","Right")}${fwSeg(fw.S+fw.Lo,"#93a796","Short/long")}</div>

      </div>

      <div class="head"><h2>What distance costs you</h2></div>
      ${slope!=null?`<p class="sub" style="margin:0 0 12px">On ${KH.length} hole scores where the yardage is known (${sc.map(c=>esc(c.name)).join(", ")}), each extra 10 yd cost about <b style="color:var(--cream)">${sg(slope*10,2)} strokes</b>, comparing holes of the same par.${tax!=null?` The simulator says solid contact is worth ~${f(simGain,0)} yd per iron, roughly <b style="color:var(--cream)">${f(tax,1)} strokes per 18</b>. Treat that as an upper-end estimate: longer holes are also harder in other ways.`:""}</p>`:`<p class="empty">Not enough hole scores with known yardage yet.</p>`}

      {label:"Last 5 average",data:trailing(p,5,mean),borderColor:"#9fd07c",backgroundColor:"#9fd07c",pointRadius:0,borderWidth:2.5,tension:.3,spanGaps:true}]},options:opts("Strokes over par, per 18")});
  } else {

      {label:"Round handicap",pts:true,data:H,showLine:false,pointStyle:style,pointRadius:5,backgroundColor:"rgba(241,234,208,.75)",borderColor:"rgba(241,234,208,.75)"},
      {label:"Index (best 8 of last 20)",data:H.map((_,i)=>whs(H.slice(0,i+1))),borderColor:"#9fd07c",backgroundColor:"#9fd07c",pointRadius:0,borderWidth:2.5,tension:.3,spanGaps:true}]},options:opts("Handicap")});
  }
}

/* ================= SWING (per club, per session) ================= */
// Shot shape name from start direction (≈ face) and curve (face-to-path).
const shapeName = (face, f2p) => {
  const start = face < -2 ? "Pull" : face > 2 ? "Push" : "Straight";
  const curve = f2p > 5 ? "slice" : f2p > 2 ? "fade" : f2p < -5 ? "hook" : f2p < -2 ? "draw" : "";
  return start==="Straight" ? (curve ? curve[0].toUpperCase()+curve.slice(1) : "Straight") : (curve ? `${start}-${curve}` : start);
};
// Group outline (Uneekor "Group" style): ellipse fitted to a dataset's dots in screen space, scaled so the farthest dot sits on its edge.
const groupsPlugin = isOn => ({id:"groups",afterDatasetsDraw(ch){const {ctx,chartArea:a}=ch; ctx.save(); ctx.beginPath(); ctx.rect(a.left,a.top,a.right-a.left,a.bottom-a.top); ctx.clip();
  ch.data.datasets.forEach((d,i)=>{ if(!d.key || !ch.isDatasetVisible(i)) return; const P=ch.getDatasetMeta(i).data.map(e=>[e.x,e.y]); if(P.length<2) return;
    const mx=mean(P.map(p=>p[0])), mY=mean(P.map(p=>p[1]));
    let sxx=0,syy=0,sxy=0; P.forEach(([x,y])=>{sxx+=(x-mx)**2; syy+=(y-mY)**2; sxy+=(x-mx)*(y-mY);}); sxx/=P.length; syy/=P.length; sxy/=P.length;
    const tr=(sxx+syy)/2, det=Math.sqrt(Math.max(0,((sxx-syy)/2)**2+sxy*sxy)), l1=Math.max(tr+det,1), l2=Math.max(tr-det,1), th=0.5*Math.atan2(2*sxy, sxx-syy);
    const c=Math.cos(th), s_=Math.sin(th);
    const k = Math.max(1, ...P.map(([x,y])=>{ const u=(x-mx)*c+(y-mY)*s_, w=-(x-mx)*s_+(y-mY)*c; return Math.sqrt(u*u/l1 + w*w/l2); }));
    ctx.beginPath(); ctx.ellipse(mx,mY,k*Math.sqrt(l1)+9,Math.max(k*Math.sqrt(l2)+9,12),th,0,2*Math.PI); ctx.lineWidth=2; ctx.strokeStyle=alpha(colorOf(d.key), isOn(d.key)?.9:.15); ctx.stroke(); });
  ctx.restore();}});

// Top-down path/face picture. Angles are drawn 3x so a few degrees are visible.
function pathSVG(k, shots){
  const W=380, H=330, bx=W/2, by=H-92, X=3, col=colorOf(k), rad=d=>d*Math.PI/180*X;
  const ok = shots.filter(r=>r.path!=null && r.face!=null);
  const mp = mean(ok.map(r=>r.path)), mf = mean(ok.map(r=>r.face)), ms = mean(ok.map(r=>r.side)), mc = mean(ok.map(r=>r.carry));
  const seg = (ang, len) => [bx + Math.sin(rad(ang))*len, by - Math.cos(rad(ang))*len];
  const club = (ang, w, op) => { const [x1,y1]=seg(ang,-34), [x2,y2]=seg(ang,46);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${alpha(col,op)}" stroke-width="${w}" stroke-linecap="round"/>`; };
  // ball flight: starts ~ along the face (irons ≈ 75% face, 25% path), finishes at the average side, scaled to the box
  const start = 0.75*mf + 0.25*mp, topY = 40, sideX = bx + Math.max(-170, Math.min(170, (ms||0)*4));
  const [cx1,cy1] = seg(start, (by-topY)*0.55);
  const [fx1,fy1] = seg(mf, 26), [fx2,fy2] = seg(mf, -26); // face normal endpoints; the face itself is perpendicular
  const nx = Math.cos(rad(mf))*24, ny = Math.sin(rad(mf))*24;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Club path and face at impact, seen from above">
    <rect width="${W}" height="${H}" rx="10" fill="#0d1610"/>
    <line x1="${bx}" y1="${by+30}" x2="${bx}" y2="16" stroke="rgba(233,229,211,.25)" stroke-dasharray="5 5"/>
    <text x="${bx+6}" y="24" fill="#617566" font-size="11" font-family="Space Mono, monospace">target</text>
    ${ok.map(r=>club(r.path,1.5,.28)).join("")}
    ${club(mp,4,.95)}
    <path d="M${bx} ${by} Q${cx1} ${cy1} ${sideX} ${topY}" fill="none" stroke="#e3c97a" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="${sideX}" cy="${topY}" r="5" fill="#e3c97a"/>
    <line x1="${bx-nx}" y1="${by-6-ny}" x2="${bx+nx}" y2="${by-6+ny}" stroke="#f1ead0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${bx}" cy="${by}" r="7" fill="#f1ead0" stroke="#101a14"/>
    <text x="14" y="${H-34}" fill="#c9c6b4" font-size="12" font-family="Space Mono, monospace">path ${sg(mp)}° · face ${sg(mf)}°</text>
    <text x="14" y="${H-16}" fill="#93a796" font-size="12" font-family="Space Mono, monospace">face ${sg(mf-mp)}° to path → ${(mf-mp)>2?"curves right":(mf-mp)<-2?"curves left":"straight-ish"}</text>
    <text x="${W-14}" y="${H-16}" text-anchor="end" fill="#617566" font-size="11" font-family="Space Mono, monospace">angles ×3</text></svg>`;
}

// Side-on flight: a smooth arc per shot through launch angle, apex and landing angle (shape only, height exaggerated).
function flightSVG(k, shots){
  const W=380, H=330, L=44, R=14, T=20, B=46, col=colorOf(k);
  const ok = shots.filter(r=>r.carry && r.apex && r.launch && r.descent);
  if (!ok.length) return `<p class="empty">No flight data.</p>`;
  const maxC = Math.ceil((Math.max(...ok.map(r=>r.carry))+10)/20)*20, maxH = Math.ceil((Math.max(...ok.map(r=>r.apex))+4)/10)*10;
  const X = d => L + d/maxC*(W-L-R), Y = h => H-B - h/maxH*(H-T-B);
  const arc = r => { const c=r.carry, a=c*0.42, b=c*0.30, la=r.launch*Math.PI/180, de=r.descent*Math.PI/180;
    const P=[[0,0],[a,a*Math.tan(la)],[c-b,b*Math.tan(de)],[c,0]], pts=[];
    for (let t=0;t<=1.0001;t+=0.04){ const u=1-t; pts.push([0,1].map(j=>u*u*u*P[0][j]+3*u*u*t*P[1][j]+3*u*t*t*P[2][j]+t*t*t*P[3][j])); }
    const top = Math.max(...pts.map(p=>p[1])) || 1; return pts.map(([x,y])=>[x, y/top*r.apex]); };
  const avg = {carry:mean(ok.map(r=>r.carry)), apex:mean(ok.map(r=>r.apex)), launch:mean(ok.map(r=>r.launch)), descent:mean(ok.map(r=>r.descent))};
  const path = (r,w,op) => `<polyline points="${arc(r).map(([x,y])=>`${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(" ")}" fill="none" stroke="${alpha(col,op)}" stroke-width="${w}"/>`;
  let g = `<rect width="${W}" height="${H}" rx="10" fill="#0d1610"/>`;
  for (let d=0; d<=maxC; d+=20) g += `<line x1="${X(d)}" x2="${X(d)}" y1="${T}" y2="${H-B}" stroke="rgba(233,229,211,.06)"/><text x="${X(d)}" y="${H-B+16}" text-anchor="middle" fill="#617566" font-size="10" font-family="Space Mono, monospace">${d}</text>`;
  for (let h=10; h<=maxH; h+=10) g += `<line x1="${L}" x2="${W-R}" y1="${Y(h)}" y2="${Y(h)}" stroke="rgba(233,229,211,.06)"/><text x="${L-6}" y="${Y(h)+3}" text-anchor="end" fill="#617566" font-size="10" font-family="Space Mono, monospace">${h}</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(233,229,211,.3)"/>`;
  g += ok.map(r=>path(r,1.5,.35)).join("") + path(avg,3.5,.95);
  g += `<text x="${(L+W-R)/2}" y="${H-12}" text-anchor="middle" fill="#93a796" font-size="11" font-family="Space Mono, monospace">carry (yd) · height (yd)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ball flight from the side">${g}</svg>`;
}

// Impact close-ups: find each shot's contact frame (last frame before the ball moves) and crop around the ball.
const impactCache = {};
const loadImg = src => new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=src; });
async function contactInfo(r){
  const key = r.img?.frames?.[0]; if (!key) return null; if (impactCache[key]) return impactCache[key];
  const info = {frame:8, ball:null};
  try {
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true}), pos=[];
    for (const src of r.img.frames){
      const im = await loadImg(src); cv.width = im.width>>1; cv.height = im.height>>1; cx.drawImage(im,0,0,cv.width,cv.height);
      const d = cx.getImageData(0,0,cv.width,cv.height).data; let sx=0, sy=0, n=0;
      for (let y=0;y<cv.height;y++) for (let x=0;x<cv.width;x++){ const i=(y*cv.width+x)*4; if (d[i]+d[i+1]+d[i+2] > 630){ sx+=x; sy+=y; n++; } }
      pos.push(n>15 ? [sx/n*2, sy/n*2] : null);
    }
    const p0 = pos.find(Boolean);
    if (p0){ const m = pos.findIndex(p=>p && Math.hypot(p[0]-p0[0], p[1]-p0[1]) > 8); info.frame = m>0 ? m-1 : 8; info.ball = p0; }
  } catch(e) { /* opened from file:// — pixels can't be read; fall back to a typical contact frame */ }
  return impactCache[key] = info;
}
async function drawCrops(k, shots){
  await Promise.all(shots.map(async r => {   // all shots in parallel so the close-ups appear quickly
    const cell = document.querySelector(`#crops [data-crop="${k}-${r.n}"]`); if (!cell) return;
    const info = await contactInfo(r), fi = state.swFrame==null ? info?.frame ?? 8 : state.swFrame;
    const src = r.img?.frames?.[fi]; if (!src) return;
    const im = await loadImg(src), cv = cell.querySelector("canvas"), cx = cv.getContext("2d");
    const cw = 220, ch = 154, bx = info?.ball ? info.ball[0] : im.width/2, byy = info?.ball ? info.ball[1] : im.height/2;
    cv.width = cw; cv.height = ch;
    const sx = Math.max(0, Math.min(im.width-cw, bx-cw*0.55)), sy = Math.max(0, Math.min(im.height-ch, byy-ch/2));
    cx.drawImage(im, sx, sy, cw, ch, 0, 0, cw, ch);
    cell.querySelector(".fr").textContent = state.swFrame==null ? `contact · frame ${fi+1}` : `frame ${fi+1}`;
  }));
}

function renderSwing(){
  const A = ALL[state.i], {keys, clubs} = A;
  if (!clubs[state.swing]) state.swing = keys.includes("7i") ? "7i" : keys[0];
  const k = state.swing, c = clubs[k], sh = c.shots, clean = sh.filter(r=>!r.suspect);
  const tile = (l,key,v,cap) => `<div class="tile"><div class="l">${key?tip(key,l):l}</div><div class="v">${v}</div>${cap?`<div class="c">${cap}</div>`:""}</div>`;
  const frames = Math.max(...sh.map(r=>r.img?.frames?.length||0));
  $("tab-swing").innerHTML = `
    <div class="head" style="margin:0"><div><h2>Swing · ${esc(CLUB[k]?.label||nameOf(k))}</h2><p class="sub">${sName(state.i)} · ${sDate(A)} · ${sh.length} shots${c.partial?" · partial swings":""}${c.caveat?` · <span class="warn">⚑ ${esc(c.caveat)}</span>`:""}</p></div>${pickerHTML()}</div>
    <section class="card">
      <div class="row-btns">${keys.map(x=>`<button class="btn sm" data-swing="${x}" aria-pressed="${x===k}">${sw(x)}${nameOf(x)}</button>`).join("")}</div>
      <div class="tiles" style="margin-top:16px">
        ${tile("Shot shape","",shapeName(c.face??0, c.f2p??0),"from face and face-to-path")}
        ${tile("Club path","path",sg(c.path)+"°",c.path<-2?"out-to-in":c.path>2?"in-to-out":"neutral")}
        ${tile("Face to target","face",sg(c.face)+"°","")}
        ${tile("Face to path","f2p",sg(c.f2p)+"°",c.f2p>2?"curves right":c.f2p<-2?"curves left":"")}
        ${tile("Launch","launch",f(c.launch)+"°",CLUB[k]?.loft?`${CLUB[k].loft}° loft`:"")}
        ${tile("Smash","smash",f(median(clean.map(r=>r.smash)),2),"misreads removed")}
      </div>
    </section>
    <section class="sw-grid">
      <div class="card"><div class="head"><h2>Path &amp; face</h2></div>${pathSVG(k, sh)}
        <div class="swlegend"><span><i style="background:${colorOf(k)}"></i>club path (each shot + average)</span><span><i style="background:#f1ead0"></i>face at impact</span><span><i style="background:#e3c97a"></i>ball: start → average finish</span></div></div>
      <div class="card"><div class="head"><h2>Ball flight</h2></div>${flightSVG(k, sh)}
        <p class="muted small" style="margin:8px 0 0">Side view of each shot from its launch angle, apex and landing angle (shape is approximate; height is stretched). Avg apex ${f(c.apex)} yd, land ${f(c.descent)}°.</p></div>
    </section>
    <section class="card">
      <div class="head"><h2>Impact</h2><span class="muted small">Tap a shot for all 24 frames</span></div>
      <div class="scrub">
        <button class="btn sm" id="swContact" aria-pressed="${state.swFrame==null}">At contact</button>
        <input type="range" id="swRange" min="0" max="${Math.max(0,frames-1)}" value="${state.swFrame??8}" aria-label="Frame for every shot">
        <span class="muted small" id="swLabel">${state.swFrame==null?"each shot at its own contact frame":`frame ${state.swFrame+1} for every shot`}</span>
      </div>
      <div class="crops" id="crops">${sh.map(r=>`<div class="crop" data-crop="${k}-${r.n}" data-shot="${r.n}"><span class="fr">…</span><canvas width="220" height="154" aria-label="Shot ${r.n} at impact"></canvas>
        <div class="cap"><span>#${r.n}${r.suspect?' <span class="warn">?</span>':""}</span><span>smash ${f(r.smash,2)} · ${f(r.carry,0)} yd</span></div></div>`).join("")}</div>
      <p class="muted small" style="margin:12px 0 0">Top-down camera, cropped on the ball. The hosel/shaft is toward the top of each image, so a ball nearer the top is closer to the heel. This session has no measured face-contact location (that needs Uneekor's Optix), so judge it from the frames.</p>
    </section>
    <section class="card"><div class="head"><h2>Dispersion</h2><span class="muted small">${nameOf(k)} · outline wraps every shot</span></div><div class="chart" style="height:300px"><canvas id="swDisp"></canvas></div></section>`;

  wirePicker($("tab-swing"));
  document.querySelectorAll("#tab-swing [data-swing]").forEach(b=>b.onclick=()=>{state.swing=b.dataset.swing;render();});
  document.querySelectorAll("#tab-swing [data-crop]").forEach(el=>el.onclick=()=>openShot(state.i,k,+el.dataset.shot));
  $("swContact").onclick = () => { state.swFrame = null; render(); };
  $("swRange").oninput = e => { state.swFrame = +e.target.value; $("swContact").setAttribute("aria-pressed","false"); $("swLabel").textContent = `frame ${state.swFrame+1} for every shot`; drawCrops(k, sh); };
  drawCrops(k, sh);

  const pts = sh.filter(r=>r.carry!=null && r.side!=null), my = Math.ceil((Math.max(10,...pts.map(r=>Math.abs(r.side)))+10)/10)*10;
  const x0 = Math.max(0, Math.floor((Math.min(...pts.map(r=>r.carry))-15)/10)*10), x1 = Math.ceil((Math.max(...pts.map(r=>r.carry))+15)/10)*10;
  const line = {id:"tline",beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{y}}=ch;ctx.save();ctx.strokeStyle="rgba(233,229,211,.35)";ctx.beginPath();ctx.moveTo(a.left,y.getPixelForValue(0));ctx.lineTo(a.right,y.getPixelForValue(0));ctx.stroke();ctx.restore();}};
  draw("swDisp",{type:"scatter",plugins:[line,groupsPlugin(()=>true)],data:{datasets:[
      {key:k,label:nameOf(k),data:pts.map(r=>({x:r.carry,y:-r.side,r})),backgroundColor:alpha(colorOf(k),.9),pointRadius:6,pointHoverRadius:8},
      {label:"Average",data:[{x:mean(pts.map(r=>r.carry)),y:-mean(pts.map(r=>r.side))}],pointStyle:"crossRot",pointRadius:9,borderWidth:2.5,borderColor:"#f1ead0",backgroundColor:"#f1ead0"}]},
    options:{maintainAspectRatio:false,interaction:{mode:"nearest",intersect:true},
      onClick:(e,els)=>{const el=els.find(x=>x.datasetIndex===0); if(el) openShot(state.i,k,pts[el.index].n);},
      scales:{x:{min:x0,max:x1,grid,title:{display:true,text:"Carry (yd)"}},y:{min:-my,max:my,grid,ticks:{stepSize:10,callback:v=>v===0?"0":`${Math.abs(v)} ${v>0?"L":"R"}`},title:{display:true,text:"↑ left · right ↓ (yd)"}}},
      plugins:{legend:{position:"bottom"},tooltip:{callbacks:{title:it=>it[0].raw.r?`${nameOf(k)} · shot ${it[0].raw.r.n}`:"Average",label:c=>c.raw.r?`carry ${f(c.raw.r.carry)} yd · ${lr(c.raw.r.side)}`:`carry ${f(c.raw.x)} yd · ${lr(-c.raw.y)}`}}}}});
}

/* ================= session picker + summary (Session and Swing tabs only) ================= */
const pickerHTML = () => `<div class="date">
    <button class="btn icon" data-pick="-1" aria-label="Previous session" ${state.i<=0?"disabled":""}>‹</button>
    <select data-pick-sel aria-label="Session">${ALL.map((A,i)=>`<option value="${i}" ${i===state.i?"selected":""}>${sName(i)} · ${sDate(A)}</option>`).reverse().join("")}</select>
    <button class="btn icon" data-pick="1" aria-label="Next session" ${state.i>=ALL.length-1?"disabled":""}>›</button></div>`;
function wirePicker(root){
  root.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ state.i=Math.max(0,Math.min(ALL.length-1,state.i+ +b.dataset.pick)); render(); });
  root.querySelectorAll("[data-pick-sel]").forEach(el=>el.onchange=()=>{ state.i=+el.value; render(); });
}
function overviewHTML(){
  const balls = A => A.keys.reduce((n,k)=>n+A.clubs[k].n,0);
  const total = ALL.reduce((n,A)=>n+balls(A),0);
  const hit = new Set(ALL.flatMap(A=>A.keys.filter(k=>CLUB[k])));
  const fullSw = new Set(ALL.flatMap(A=>A.keys.filter(k=>CLUB[k] && !A.clubs[k].partial)));
  const partialOnly = [...hit].filter(k=>!fullSw.has(k)).sort((a,b)=>loftOf(a)-loftOf(b));
  const bagN = MAIN.filter(c=>c.key!=="Putter").length;
  const curated = ALL.some(A=>A.meta.curated);
  const A = ALL[state.i];
  return `<section class="overview">
    <div class="ov now"><div class="l">This session</div><div class="v">${balls(A)} balls</div><div class="c">${sDate(A)} · ${A.keys.length} clubs</div></div>
    <div class="ov"><div class="l">All sessions</div><div class="v">${ALL.length}</div><div class="c">${sDate(ALL[0])}${ALL.length>1?" → "+sDate(ALL[ALL.length-1]):""}</div></div>
    <div class="ov"><div class="l">Balls hit, all sessions</div><div class="v">${total.toLocaleString()}</div><div class="c">${curated?"recorded (mishits removed)":"recorded"}</div></div>
    <div class="ov"><div class="l">Clubs hit</div><div class="v">${hit.size} / ${bagN}</div><div class="c">${partialOnly.length?`${partialOnly.map(nameOf).join(", ")} partial swings only`:`all full swings`}</div></div></section>`;
}

/* ================= quick tour ================= */
// One step per tab: what it is, why it helps, one thing to try (a sentence each).
const TOUR = [
  // show = area to spotlight, target = what to click, done = true once they've done it
  {tab:"session", title:"Session", what:"Your simulator session in one place: headline numbers, what to work on, and charts you can switch between.", why:"It boils every shot down to the few things worth fixing first.", try:"This is your distance per club; click Dispersion to see where those shots landed.",
   prep:()=>{state.view="distance";}, show:"#cMain", target:'[data-view="dispersion"]', look:"#cMain", done:()=>state.view==="dispersion"},
  {tab:"swing", title:"Swing", what:"One club at a time: path and face, ball flight, and the camera frames at impact.", why:"It shows how each shot was struck, not just where it went.", try:"Tap a shot to watch it through impact, then close it with the ✕.",
   target:"#crops .crop", scroll:"#crops", done:()=>tourTapped && vEl.hidden},
  {tab:"rounds", title:"Rounds", what:"Your 18Birdies rounds: score trend, where you miss greens, and what distance costs on the course.", why:"It links your practice numbers to real scores.", try:"Click Handicap to see how your handicap has moved.",
   prep:()=>{state.rview="score";}, target:'[data-rview="hcp"]', look:"#rTrend", done:()=>state.rview==="hcp"},
  {tab:"trend", title:"Progress", what:"How your swing numbers move from session to session.", why:"It tells you whether the practice is working.", try:"Change the metric in the By club chart."},
  {tab:"bag", title:"Bag", what:"Every club with its carry, total and spread, measured or estimated.", why:"It shows gaps and overlaps, like the 6-iron versus the 7-wood.", try:"Look for clubs marked est: they still need a session."},
  {tab:"drills", title:"Drills", what:"A short practice plan with drills and videos.", why:"It targets the contact problem that costs you the most yards.", try:"Tick off a task; your progress is saved in this browser."},
];
let tourStep = -1, tourTapped = false, tourWasDone = false, tourScrollId = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Scroll gently so the element sits in the space above the tour card (eased, ~1s; instant if reduced motion is on).
function slowScrollTo(el, dur=1000){
  if (!el) return Promise.resolve();
  const header = document.querySelector(".top").getBoundingClientRect().bottom;
  const card = tourEl.hidden ? 0 : tourEl.getBoundingClientRect().height + 20;
  const r = el.getBoundingClientRect(), room = innerHeight - header - card;
  const want = scrollY + r.top - header - Math.max(12, (room - r.height)/2);
  const to = Math.max(0, Math.min(want, document.documentElement.scrollHeight - innerHeight)), from = scrollY, id = ++tourScrollId;
  if (reduceMotion || Math.abs(to-from) < 4){ scrollTo(0,to); return Promise.resolve(); }
  return new Promise(res => { const t0 = performance.now();
    const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    const step = now => { if (id!==tourScrollId) return res(); const t = Math.min(1,(now-t0)/dur); scrollTo(0, from+(to-from)*ease(t)); placePoint(); t<1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step); });
}
// Bouncing "Click here" / "Tap here" label next to whatever is pulsing.
const pointEl = $("tourPoint"), touch = matchMedia("(pointer: coarse)").matches;
function placePoint(){
  const tgt = document.querySelector(".tour-target");
  if (!tgt || tourStep<0){ pointEl.hidden = true; return; }
  const r = tgt.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight){ pointEl.hidden = true; return; }
  pointEl.textContent = `${touch?"Tap":"Click"} here`; pointEl.hidden = false;
  const w = pointEl.offsetWidth, h = pointEl.offsetHeight, above = r.top > h + 90;
  pointEl.className = above ? "above" : "below";
  pointEl.style.left = Math.max(8, Math.min(innerWidth-w-8, r.left + r.width/2 - w/2)) + "px";
  pointEl.style.top = (above ? r.top - h - 14 : r.bottom + 14) + "px";
}
addEventListener("scroll", ()=>{ if (tourStep>=0) requestAnimationFrame(placePoint); }, {passive:true});
addEventListener("resize", ()=>{ if (tourStep>=0) placePoint(); });
// Spotlight the step's area and pulse the thing to click; re-applied after every render (tabs rebuild their HTML).
function applyTour(){
  document.querySelectorAll(".tour-show,.tour-target").forEach(e=>e.classList.remove("tour-show","tour-target"));
  const t = TOUR[tourStep]; if (!t) return;
  const done = !!(t.done && t.done());
  if (!done) t.show && document.querySelector(t.show)?.closest(".card")?.classList.add("tour-show");
  if (t.tab==="swing" && tourTapped && !vEl.hidden) $("vclose")?.classList.add("tour-target");   // step 2: close the swing frames
  else if (!done) t.target && document.querySelector(t.target)?.classList.add("tour-target");
  const tick = tourEl.querySelector(".tick"); if (tick) tick.hidden = !done;
  tourEl.classList.toggle("mini", done);   // once done, shrink to a slim bar so it doesn't cover the result
  if (done && !tourWasDone){
    const look = t.look && document.querySelector(t.look)?.closest(".card");
    if (look) slowScrollTo(look, 800).then(placeTour); else placeTour();
  }
  tourWasDone = done;
  placePoint();
}
// Put the card at the bottom unless that would cover what the step points at; then use the top.
function placeTour(){
  const t = TOUR[tourStep]; tourEl.classList.remove("at-top"); if (!t) return;
  const sel = t.look || t.show; if (!sel) return;   // Swing has nothing to keep in view (the viewer sits on top)
  const look = document.querySelector(sel)?.closest(".card"); if (!look) return;
  const r = look.getBoundingClientRect(), c = tourEl.getBoundingClientRect();
  if (r.bottom > c.top - 8 && r.top < c.bottom) tourEl.classList.add("at-top");
}
const tourEl = $("tour");
function showTour(i){
  tourStep = i; const t = TOUR[i]; tourTapped = false; tourWasDone = false; t.prep?.();
  tourEl.classList.remove("mini","at-top");
  state.tab = t.tab; render(); scrollTo({top:0});
  document.querySelectorAll(".tabs .btn").forEach(b=>b.classList.toggle("tour-hl", b.dataset.tab===t.tab));
  document.querySelector(`.tabs .btn[data-tab="${t.tab}"]`)?.scrollIntoView({block:"nearest",inline:"center"});
  tourEl.innerHTML = `<div class="step">Quick tour · ${i+1} of ${TOUR.length}<span class="mini-title"> · ${t.title}</span> <span class="tick good" hidden>✓</span></div><h3 id="tourTitle">${t.title}</h3>
    <p><b>What:</b> ${t.what}</p><p><b>Why:</b> ${t.why}</p><p class="try"><b>Try:</b> ${t.try}</p>
    <div class="acts"><button class="btn sm" data-t="skip">Skip</button><div class="dots">${TOUR.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
      <div class="row-btns">${i>0?`<button class="btn sm" data-t="back">Back</button>`:""}<button class="btn sm" data-t="next" aria-pressed="true">${i<TOUR.length-1?"Next":"Done"}</button></div></div>`;
  tourEl.hidden = false;
  applyTour();
  const focus = document.querySelector(t.scroll || t.show || t.target);
  const card = focus && (focus.closest(".card") || focus);
  if (card) setTimeout(()=>slowScrollTo(card, 1100).then(placePoint), 450);
  tourEl.querySelector('[data-t="next"]').focus({preventScroll:true});
}
function endTour(){
  tourEl.hidden = true; tourStep = -1; tourScrollId++; store.set("golf-tour-v1", true); applyTour(); tourEl.classList.remove("mini","at-top"); pointEl.hidden = true;
  document.querySelectorAll(".tabs .btn").forEach(b=>b.classList.remove("tour-hl"));
  state.tab = "session"; render(); scrollTo({top:0});
}
tourEl.addEventListener("click", e => { const a = e.target.closest("[data-t]")?.dataset.t; if (!a) return;
  if (a==="skip") endTour(); else if (a==="back") showTour(tourStep-1); else if (tourStep < TOUR.length-1) showTour(tourStep+1); else endTour(); });
document.addEventListener("keydown", e => { if (tourEl.hidden || !vEl.hidden) return;
  if (e.key==="Escape") endTour(); else if (e.key==="ArrowRight") tourEl.querySelector('[data-t="next"]').click(); else if (e.key==="ArrowLeft" && tourStep>0) showTour(tourStep-1); }, true);  // capture: runs before the shot viewer handles Esc
$("tourBtn").onclick = () => showTour(0);
document.addEventListener("click", e => { if (tourStep>=0 && TOUR[tourStep].tab==="swing" && e.target.closest("#crops .crop")){ tourTapped = true; setTimeout(applyTour, 0); } }, true);
new MutationObserver(()=>{ if (tourStep>=0 && !vEl.hidden) applyTour(); }).observe(vEl, {childList:true});   // viewer re-renders (prev/next shot)

/* ================= wiring ================= */
const TABS = {session:renderSession, swing:renderSwing, rounds:renderRounds, trend:renderTrend, bag:renderBag, drills:renderDrills};
function render(){
  if (!ALL.length) return;
  document.querySelectorAll("main").forEach(m=>m.hidden = m.id!=="tab-"+state.tab);
  document.querySelectorAll(".tabs .btn").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  TABS[state.tab]();
  history.replaceState(null,"",`#s${state.i+1}/${state.tab}`);
  if (typeof applyTour==="function" && tourStep>=0) applyTour();
}
const [hd,ht] = location.hash.slice(1).split("/"), hn = /^s(\d+)$/.exec(hd||""), hi = hn ? +hn[1]-1 : -1;
if (hi>=0 && hi<ALL.length) state.i = hi; if (TABS[ht]) state.tab = ht;
document.querySelectorAll(".tabs .btn").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();scrollTo({top:0});});
const tipEl = $("tip");
document.addEventListener("mouseover",e=>{const t=e.target.closest("[data-tip]");if(!t){tipEl.hidden=true;return;}tipEl.textContent=t.dataset.tip;tipEl.hidden=false;const r=t.getBoundingClientRect();
  tipEl.style.left=Math.min(innerWidth-tipEl.offsetWidth-8,Math.max(8,r.left))+"px";tipEl.style.top=(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8)+"px";});
addEventListener("scroll",()=>tipEl.hidden=true,{passive:true});
$("foot").textContent = `Built ${DATA.built} · Benchmarks: TrackMan Tour averages, Shot Scope 25-handicap`;
if (ALL.length) render(); else $("tab-session").innerHTML = `<section class="card empty">No sessions yet.</section>`;
if (ALL.length && !store.get("golf-tour-v1", false)) showTour(0);   // first visit only; the Tour button replays it
</script>
</body>
</html>
