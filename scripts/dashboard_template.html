/* ---------- PROGRESS ---------- */
function renderTrend(){
  const list = ALL.slice(0, state.i+1), dates = list.map(A=>A.s.iso);
  const P = A => ({ path:mean(A.full.map(r=>r.path)), f2p:mean(A.full.map(r=>r.f2p)),
    smash:median(A.full.filter(r=>IRON(r.key)).map(r=>r.smash)),
    disp:mean(A.keys.filter(k=>IRON(k)&&!A.clubs[k].partial).map(k=>A.clubs[k].carrySd)), shots:A.keys.reduce((n,k)=>n+A.clubs[k].n,0) });
  const pts = list.map(P), first = pts[0], last = pts[pts.length-1], multi = list.length>1;
  const kpi = (label, key, now, delta, better, unit, d=1) => {
    const c = !multi||delta==null ? "" : Math.abs(delta)<(d===2?.01:.3) ? "" : better ? "good" : "bad";
    return `<div class="kpi ${c}"><div class="l">${tip(key,label)}</div><div class="v">${multi&&delta!=null?sg(delta,d)+unit:"—"}</div><div class="c">now ${unit==="°"?sg(now,d):f(now,d)}${unit}</div><div class="t">${multi?"change since "+dates[0]:"needs a 2nd session"}</div></div>`;
  };
  const F = [];
  if (!multi){
    F.push({sev:"info", title:`Baseline set (${dates[0]})`, body:`Trend lines appear after your next session. Starting point: path ${sg(last.path)}°, face-to-path ${sg(last.f2p)}°, iron smash ${f(last.smash,2)}, iron carry spread ±${f(last.disp)} yd.`});
  } else {
    const t = (name, a, b, better, unit, d=1) => { if (a==null||b==null) return; const delta=b-a;
      F.push({sev:Math.abs(delta)<(d===2?.01:.3)?"info":better(a,b)?"good":"bad", title:`${name}: ${sg(a,d)}${unit} → ${sg(b,d)}${unit}`, body:`${sg(delta,d)}${unit} since ${dates[0]}.`}); };
    t("Club path", first.path, last.path, (a,b)=>Math.abs(b)<Math.abs(a), "°");
    t("Face-to-path", first.f2p, last.f2p, (a,b)=>Math.abs(b)<Math.abs(a), "°");
    t("Iron smash", first.smash, last.smash, (a,b)=>b>a, "", 2);
    t("Carry spread", first.disp, last.disp, (a,b)=>b<a, " yd");
    const ks = [...new Set(list.flatMap(A=>A.keys.filter(k=>!A.clubs[k].partial)))].sort((a,b)=>loftOf(a)-loftOf(b));
    const moved = ks.map(k=>{const h=list.filter(A=>A.clubs[k]&&!A.clubs[k].partial); return h.length>1?`${nameOf(k)} ${sg(h[h.length-1].clubs[k].carry-h[0].clubs[k].carry)} yd`:null;}).filter(Boolean);
    if (moved.length) F.push({sev:"info", title:"Carry change by club", body:moved.join(" · ")});
    if (Math.abs(last.path)<=2 && Math.abs(last.f2p)<=3) F.push({sev:"good", title:"Path and face-to-path are in the target window", body:"Shift the focus to strike quality and gapping."});
  }
  const curated = list.filter(A=>A.meta.curated).length;
  $("tab-trend").innerHTML = `
    ${curated ? `<div class="banner"><span class="ic">⚑</span><div><b>${curated} of ${list.length} session${list.length>1?"s":""} are best-shots-only.</b> Compare curated sessions with each other. Mixing curated and uncurated sessions will show false swings in consistency.</div></div>` : ""}
    <section class="kpis">
      ${kpi("Club path","path",last.path,multi?last.path-first.path:null,Math.abs(last.path)<Math.abs(first.path),"°")}
      ${kpi("Face-to-path","f2p",last.f2p,multi?last.f2p-first.f2p:null,Math.abs(last.f2p)<Math.abs(first.f2p),"°")}
      ${kpi("Iron smash","smash",last.smash,multi?last.smash-first.smash:null,last.smash>first.smash,"",2)}
      ${kpi("Carry spread","spread",last.disp,multi?last.disp-first.disp:null,last.disp<first.disp," yd")}
    </section>
    <section class="card">
      <div class="sec"><h2>Progress review</h2><span class="muted small">${list.length} session${list.length>1?"s":""} · ${pts.reduce((n,p)=>n+p.shots,0)} shots</span></div>
      <ul class="findings">${F.map(x=>`<li><span class="dot ${x.sev}"></span><span><b>${x.title}.</b> ${x.body}</span></li>`).join("")}</ul>
      ${DATA.overallReview ? `<details open><summary>Plan and drills</summary><div class="notes">${DATA.overallReview}</div></details>` : ""}
    </section>
    <section class="grid2">
      <div class="card"><h2>Path and face-to-path</h2><p class="lede">Both lines should move toward the green zero line.</p><div class="chart"><canvas id="tPath"></canvas></div></div>
      <div class="card"><h2>Strike quality</h2><p class="lede">Median smash for each iron. Up is better.</p><div class="chart"><canvas id="tSmash"></canvas></div></div>
    </section>
    <section class="card"><div class="sec"><h2>${MET[state.tmetric].label} by club over time</h2></div>
      <div style="margin:12px 0">${metricChips("tmetric","tchips")}</div>
      <p class="lede">${MET[state.tmetric].zero?"Lines should move toward 0.":state.tmetric==="carry"?"Lines that spread evenly apart mean better gapping.":"Full-swing average per session for each club."}</p>
      <div class="chart"><canvas id="tCarry"></canvas></div></section>`;
  document.querySelectorAll("#tchips .mchip").forEach(b=>b.onclick=()=>{state.tmetric=b.dataset.m;render();});

  const opts = (yt) => ({maintainAspectRatio:false,spanGaps:true,scales:{x:{grid:{display:false}},y:{grid:gridc,title:{display:true,text:yt}}},plugins:{legend:{position:"bottom"}}});
  draw("tPath",{type:"line",data:{labels:dates,datasets:[
    {label:"Club path",data:pts.map(p=>p.path),borderColor:css('--bad'),backgroundColor:css('--bad'),pointRadius:6,tension:.25},
    {label:"Face-to-path",data:pts.map(p=>p.f2p),borderColor:css('--warn'),backgroundColor:css('--warn'),pointRadius:6,tension:.25},
    {label:"Goal (0°)",data:dates.map(()=>0),borderColor:css('--good'),borderDash:[4,4],pointRadius:0}]},options:opts("Degrees")});
  const ik = [...new Set(list.flatMap(A=>A.keys.filter(IRON)))].sort((a,b)=>loftOf(a)-loftOf(b));
  draw("tSmash",{type:"line",data:{labels:dates,datasets:ik.map(k=>({label:nameOf(k),data:list.map(A=>A.clubs[k]?.smash??null),borderColor:colorOf(k),backgroundColor:colorOf(k),pointRadius:6,tension:.25}))},options:opts("Median smash")});
  const ck = [...new Set(list.flatMap(A=>A.keys.filter(k=>!A.clubs[k].partial)))].sort((a,b)=>loftOf(a)-loftOf(b));
  const tm = MET[state.tmetric];
  draw("tCarry",{type:"line",data:{labels:dates,datasets:ck.map(k=>({label:nameOf(k),data:list.map(A=>A.clubs[k]&&!A.clubs[k].partial&&A.clubs[k][tm.k]!=null?+A.clubs[k][tm.k].toFixed(tm.dp):null),borderColor:colorOf(k),backgroundColor:colorOf(k),pointRadius:6,tension:.25}))},options:opts(`${tm.label}${tm.unit?" ("+tm.unit+")":""}`)});
}

/* ---------- BAG ---------- */
function latestFor(k){
  for (let i=state.i;i>=0;i--){ const c=ALL[i].clubs[k]; if (c && !c.partial) return {c, date:ALL[i].s.iso}; }
  for (let i=state.i;i>=0;i--){ const c=ALL[i].clubs[k]; if (c) return {c, date:ALL[i].s.iso}; }
  return null;
}
function renderBag(){
  const L7 = latestFor("7i"), L6 = latestFor("6i"), LW = latestFor("7W");
  const card = (title, rows, note) => `<div><b>${title}</b>${rows.map(([a,b,cls])=>`<div class="row"><span>${a}</span><span class="${cls||""}">${b}</span></div>`).join("")}${note?`<div class="muted small" style="margin-top:6px">${note}</div>`:""}</div>`;
  let cards = [], verdict = "";
  if (L7){
    const c7 = L7.c.carry;
    cards.push(card(`7 Iron · 27.5°`, [["Carry",f(c7,0)+" yd"],["Rollout",f(L7.c.roll,0)+" yd"],["Apex",f(L7.c.apex,0)+" yd"],["Spread",`±${f(L7.c.carrySd,0)} yd`]], `measured ${L7.date}${L7.c.caveat?' · <span class="warn">⚑ possible outlier</span>':""}`));
    cards.push(card(`6 Iron · 24.5°`, L6 ? [["Carry",f(L6.c.carry,0)+" yd"],["Rollout",f(L6.c.roll,0)+" yd"],["Apex",f(L6.c.apex,0)+" yd"],["Gap to 7i",f(L6.c.carry-c7)+" yd",L6.c.carry-c7<6?"bad":"good"]]
      : [["Carry",`${f(c7+1,0)}–${f(c7+9,0)} yd`],["Rollout","8–12 yd"],["Apex",`${f(L7.c.apex-3,0)}–${f(L7.c.apex,0)} yd`],["Overlap with 7i","Likely high","bad"]], L6?`measured ${L6.date}`:"projected from 7i"));
    cards.push(card(`7 Wood · 21.5°`, LW ? [["Carry",f(LW.c.carry,0)+" yd"],["Rollout",f(LW.c.roll,0)+" yd"],["Apex",f(LW.c.apex,0)+" yd"],["Gap to 6i",L6?f(LW.c.carry-L6.c.carry)+" yd":"—",L6&&LW.c.carry-L6.c.carry<6?"bad":"good"]]
      : [["Carry",`${f(c7+13,0)}–${f(c7+25,0)} yd`],["Rollout","6–10 yd"],["Apex",`${f(L7.c.apex+2,0)}–${f(L7.c.apex+6,0)} yd`],["Overlap with 6i","Partial / none","warn"]], LW?`measured ${LW.date}`:"projected from 7i"));
    if (L6 && LW){
      const g6 = L6.c.carry-c7, gW = LW.c.carry-L6.c.carry;
      verdict = g6 < 6 ? `<b class="bad">Measured: the 6-iron overlaps the 7-iron (${f(g6)} yd).</b> Keep the 7-wood and drop the 6-iron, or swap it for a 6-hybrid.`
        : gW < 6 ? `<b class="bad">Measured: the 6-iron and 7-wood overlap (${f(gW)} yd).</b> Keep the one with the tighter spread.`
        : `<b class="good">Measured: clean gaps (7i→6i ${f(g6)} yd, 6i→7W ${f(gW)} yd).</b> Both clubs earn their spot.`;
    } else verdict = `Projected from your latest 7-iron${L7.c.caveat?", which is flagged as a possible outlier":""}. Next session's 7i-to-driver block will replace these estimates with real numbers. If the 6-iron carries within 6 yd of the 7-iron, keep the 7-wood and drop the 6-iron.`;
  }
  const setTable = (set, si) => {
    const rows = set.clubs.map(c=>{ const k=c.key||c.equiv; return {c,k,L:k?latestFor(k):null}; });
    return `<section class="card"><div class="sec"><h2>${esc(set.name)}</h2></div>
      <p class="lede">${si? "Yardages come from the main-bag club with the same loft (shown as ≈). Head and shaft differ, so treat them as estimates." : "Latest full-swing averages up to the selected date. Gap = carry to the next club down: red under 6 yd, amber over 20 yd."}</p>
      <div class="tablewrap"><table><thead><tr><th>Club</th><th class="tl">Model</th><th>Loft</th><th>${tip("carry","Carry")}</th><th>${tip("total","Total")}</th><th>Gap ↓</th><th>Last measured</th></tr></thead><tbody>
      ${rows.map(({c,k,L},i)=>{
        const nx = rows.slice(i+1).find(r=>r.L && !r.L.c.partial && r.k!==k);
        const gap = L && nx && !L.c.partial ? L.c.carry-nx.L.c.carry : null;
        return `<tr><td><span class="cn">${k&&COLORS[k]?sw(k):""}${esc(c.label)}</span>${L?.c.caveat?'<span class="tag warn">⚑ retest</span>':""}${c.note?`<div class="muted small" style="font-weight:400">${esc(c.note)}</div>`:""}</td>
          <td class="tl muted">${esc(c.model || (c.equiv&&CLUB[c.equiv] ? `≈ ${CLUB[c.equiv].model.replace("Callaway ","")} ${nameOf(c.equiv)}` : ""))}</td>
          <td>${c.loft!=null?c.loft+"°":"—"}</td>
          <td>${L?`<b>${f(L.c.carry,0)}</b>`:"—"}${L?.c.partial?'<span class="tag">partial</span>':""}</td>
          <td>${L?f(L.c.total,0):"—"}</td>
          <td class="${gap==null?"":gap<6?"bad":gap>20?"warn":"good"}">${gap==null?"—":f(gap,0)}</td>
          <td>${L?L.date:'<span class="empty">not hit yet</span>'}</td></tr>`;}).join("")}
      </tbody></table></div></section>`;
  };
  $("tab-bag").innerHTML = `<section class="card"><div class="sec"><h2>6-iron vs. 7-wood</h2></div><p class="lede">${verdict||"Hit a 7-iron session first."}</p><div class="proj">${cards.join("")}</div></section>`
    + DATA.bag.sets.map(setTable).join("");
}

/* ---------- COURSE ---------- */
function par3Yardages(set){
  const L7 = latestFor("7i"), LA = latestFor("AW");
  const c7 = L7 && !L7.c.partial ? L7.c.carry : null;
  const avgSide = mean(ALL[state.i].full.map(r=>r.side));
  const est = {"6i":c7!=null?c7+5:null,"7W":c7!=null?c7+19:null,"51":LA&&!LA.c.partial?LA.c.carry-12:null};
  return set.clubs.filter(c=>c.equiv && c.equiv!=="Putter").map(c=>{
    const L = latestFor(c.equiv);
    if (L && !L.c.partial) return {c, carry:L.c.carry, side:L.c.side, est:false, caveat:L.c.caveat};
    return {c, carry:est[c.equiv]??null, side:avgSide, est:true, partial:L?.c.partial?L.c.carry:null,
      caveat:(c.equiv==="6i"||c.equiv==="7W") && L7?.c.caveat ? "Projected from a 7-iron that may be an outlier." : null};
  }).filter(y=>y.carry!=null).sort((a,b)=>b.carry-a.carry);
}
function renderCourse(){
  const html = [];
  for (const course of DATA.courses || []){
    const set = DATA.bag.sets.find(s=>s.name===course.bag); if (!set) continue;
    const tee = state.tee[course.name] || course.defaultTee || Object.keys(course.tees)[0];
    const holes = course.tees[tee], ys = par3Yardages(set);
    const maxY = Math.max(...holes, ...ys.map(y=>y.carry)) * 1.05;
    const usage = {};
    const cards = holes.map((yd,i)=>{
      const ranked = ys.map(y=>({y,score:y.carry>=yd?y.carry-yd:(yd-y.carry)*1.5})).sort((a,b)=>a.score-b.score);
      if (!ranked.length) return `<div class="hole"><div class="no">Hole ${i+1}</div><div class="empty">No yardages yet</div></div>`;
      const b = ranked[0].y, m = b.carry-yd; usage[b.c.label]=(usage[b.c.label]||0)+1;
      const notes = [];
      if (b===ys[0] && m < -6) notes.push(`Longer than your longest club. Hit the ${esc(b.c.label)} and play for the front edge.`);
      else if (Math.abs(m) > 6 && ranked[1]) notes.push(m<0 ? `Between clubs: a full ${esc(b.c.label)} comes up ~${f(-m,0)} short, or hit an easy ${esc(ranked[1].y.c.label)}.` : `Between clubs: a smooth ¾ ${esc(b.c.label)}, or a full ${esc(ranked[1].y.c.label)}.`);
      if (b.est) notes.push(b.partial!=null ? `Only partial swings measured (${f(b.partial,0)} yd), so the full carry is estimated.` : "Carry is estimated until you hit this club in a session.");
      if (b.caveat) notes.push(esc(b.caveat));
      const aim = b.side==null||Math.abs(b.side)<3 ? null : b.side>0 ? `← Aim ${f(b.side,0)} yd left` : `Aim ${f(-b.side,0)} yd right →`;
      const fitCls = m < -6 ? "bad" : Math.abs(m) > 6 ? "warn" : "good";
      const open = state.hole===`${course.name}:${i}`;
      return `<div class="hole" data-hole="${esc(course.name)}:${i}" aria-expanded="${open}" role="button" tabindex="0">
        <div class="hh"><span class="no">Hole ${i+1}</span><span class="yd">${yd}<small>yd</small></span></div>
        <div><span class="club">${esc(b.c.label)}</span><span class="eq">≈ ${nameOf(b.c.equiv)}</span></div>
        <div class="meter" title="Your carry vs. hole length"><div class="f" style="width:${(b.carry/maxY*100).toFixed(1)}%;background:${colorOf(b.c.equiv)}"></div><div class="pin" style="left:${(yd/maxY*100).toFixed(1)}%"></div></div>
        <div class="meta"><span>carry ${f(b.carry,0)}${b.est?" (est)":""} · <span class="${fitCls}">${sg(m,0)} yd</span></span>${aim?`<span class="pill warn">${aim}</span>`:`<span class="pill good">Aim centre</span>`}</div>
        ${open||notes.length? `<div class="more" ${open?"":"hidden"}>${notes.join(" ")||"Good fit."}${ranked[1]?`<div class="muted small" style="margin-top:4px">Backup: ${esc(ranked[1].y.c.label)} (${f(ranked[1].y.carry,0)} yd)</div>`:""}</div>`:""}
      </div>`;
    }).join("");
    const gaps=[]; for (let i=0;i<ys.length-1;i++){const g=ys[i].carry-ys[i+1].carry; if(g>20) gaps.push(`${esc(ys[i].c.label)} → ${esc(ys[i+1].c.label)}: ${f(g,0)} yd`);}
    html.push(`<section class="card">
      <div class="sec"><h2>${esc(course.name)} <span class="muted small" style="font-weight:500">${esc(course.location)}</span></h2>
        <div class="seg" role="group" aria-label="Tees">${Object.keys(course.tees).map(t=>`<button data-course="${esc(course.name)}" data-tee="${esc(t)}" aria-pressed="${t===tee}">${esc(t)} · ${course.tees[t].reduce((a,b)=>a+b,0)}</button>`).join("")}</div></div>
      <p class="lede">The club to hit on each hole from your par-3 bag, using your yardages up to the selected session. The bar shows your carry and the white tick marks the hole length. Tap a hole for notes and a backup club.</p>
      <div class="holes">${cards}</div>
    </section>
    <section class="card"><div class="sec"><h2>Par-3 bag yardages</h2></div>
      <p class="lede">${esc(course.note||"")}</p>
      <div class="ylist">${ys.map(y=>`<div class="ycard"><b><span class="cn">${sw(y.c.equiv)}${esc(y.c.label)}</span></b><div class="muted small">≈ ${nameOf(y.c.equiv)} · ${y.c.loft}°</div><div class="v">${f(y.carry,0)} <span class="muted small">yd${y.est?" est":""}</span></div><div class="muted small">used on ${usage[y.c.label]||0} hole${usage[y.c.label]===1?"":"s"}</div></div>`).join("")}</div>
      ${gaps.length?`<p class="small" style="margin:14px 0 0"><span class="warn"><b>Yardage holes:</b></span> <span class="muted">${gaps.join(" · ")}. Partial swings have to cover these.</span></p>`:""}
    </section>`);
  }
  $("tab-course").innerHTML = html.join("") || `<section class="card empty">No courses in courses.json.</section>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.tee[b.dataset.course]=b.dataset.tee;state.hole=null;render();});
  document.querySelectorAll(".hole[data-hole]").forEach(h=>{const go=()=>{state.hole=state.hole===h.dataset.hole?null:h.dataset.hole;render();};h.onclick=go;h.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
}


/* ---------- SHOT VIEWER ---------- */
const V = { i:0, key:null, n:null, frame:0, timer:null, speed:1 };
const vEl = $("viewer");
function sessionShots(i){ const A=ALL[i]; return A.keys.flatMap(k=>A.clubs[k].shots); }
function openShot(i, key, n){
  V.i=i; V.key=key; V.n=n; V.frame=0; stopPlay();
  renderViewer(); vEl.hidden=false; document.body.style.overflow="hidden";
  startPlay();
}
function closeShot(){ stopPlay(); vEl.hidden=true; document.body.style.overflow=""; }
function stepShot(d){
  const list = sessionShots(V.i), idx = list.findIndex(r=>r.key===V.key&&r.n===V.n), r = list[idx+d];
  if (r){ const playing=!!V.timer; stopPlay(); V.key=r.key; V.n=r.n; V.frame=0; renderViewer(); if(playing) startPlay(); }
}
function curShot(){ return ALL[V.i].clubs[V.key]?.shots.find(r=>r.n===V.n); }
function setFrame(fi){
  const r = curShot(), fr = r?.img?.frames || []; if (!fr.length) return;
  V.frame = (fi + fr.length) % fr.length;
  $("vf").src = fr[V.frame]; $("vr").value = V.frame;
  $("vfc").textContent = `${V.frame+1} / ${fr.length}`; $("vcap").textContent = `Top view · frame ${V.frame+1}`;
  document.querySelectorAll("#vstrip img").forEach((im,j)=>im.classList.toggle("on", j===V.frame));
  const on = document.querySelector("#vstrip img.on"); on?.scrollIntoView({block:"nearest",inline:"nearest"});
}
function startPlay(){ const fr=curShot()?.img?.frames||[]; if(fr.length<2) return; stopPlay(); V.timer=setInterval(()=>setFrame(V.frame+1), 110/V.speed); const b=$("vplay"); if(b) b.textContent="❚❚ Pause"; }
function stopPlay(){ if(V.timer){clearInterval(V.timer);V.timer=null;} const b=$("vplay"); if(b) b.textContent="▶ Play"; }
function renderViewer(){
  const A = ALL[V.i], c = A.clubs[V.key], r = curShot(); if (!r) return;
  const list = sessionShots(V.i), idx = list.findIndex(x=>x.key===V.key&&x.n===V.n);
  const fr = r.img?.frames || [];
  fr.forEach(src=>{ const im=new Image(); im.src=src; });  // preload for smooth playback
  const pb = BENCH.pga[V.key], lb = BENCH.lpga[V.key];
  const st = (label, key, val, bk) => `<div class="vstat"><div class="l">${GLOSS[key]?tip(key,label):label}</div><div class="v">${val}</div>${bk!=null?`<div class="b">${bk}</div>`:""}</div>`;
  const tb = mk => pb?.[mk]!=null ? `PGA ${fm(MET[mk],pb[mk])}${lb?.[mk]!=null?` · LPGA ${fm(MET[mk],lb[mk])}`:""}` : null;
  vEl.innerHTML = `<div class="vbox" role="dialog" aria-modal="true" aria-label="Shot viewer">
    <div class="vhead">
      <h2><span class="cn">${sw(V.key)}${esc(CLUB[V.key]?.label||nameOf(V.key))} · shot ${r.n}</span> <span class="muted small" style="font-weight:500">${A.s.iso} · ${idx+1} of ${list.length} in session${r.type?` · ${esc(r.type)}`:""}</span></h2>
      <div class="vbtns"><button class="iconbtn" id="vprev" ${idx<=0?"disabled":""}>‹ Prev shot</button><button class="iconbtn" id="vnext" ${idx>=list.length-1?"disabled":""}>Next shot ›</button><button class="iconbtn" id="vclose" aria-label="Close">✕</button></div>
    </div>
    ${r.suspect?`<div class="caveat"><b>Possible sensor misread:</b> smash or spin is outside what's physically likely for this club.</div>`:""}
    ${c.caveat?`<div class="caveat"><b>⚑ Club caveat:</b> ${esc(c.caveat)}</div>`:""}
    <div class="vgrid">
      <div>
        <div class="frame">${r.img?.impact?`<img src="${esc(r.img.impact)}" alt="Ball at impact">`:`<div class="empty" style="padding:40px">No impact image</div>`}<span class="cap">Impact</span></div>
        <p class="muted small" style="margin:8px 0 0">High-speed photo of the ball at impact.</p>
      </div>
      <div>
        <div class="frame">${fr.length?`<img id="vf" src="${esc(fr[0])}" alt="Top-view frame">`:`<div class="empty" style="padding:40px">No frames</div>`}<span class="cap" id="vcap">Top view · frame 1</span></div>
        ${fr.length?`<div class="player">
          <button class="iconbtn" id="vplay">▶ Play</button>
          <button class="iconbtn" id="vfb" aria-label="Previous frame">‹</button>
          <button class="iconbtn" id="vff" aria-label="Next frame">›</button>
          <input type="range" id="vr" min="0" max="${fr.length-1}" value="0" aria-label="Frame">
          <span class="fc" id="vfc">1 / ${fr.length}</span>
          <select id="vspeed" aria-label="Playback speed">${[[.25,"¼×"],[.5,"½×"],[1,"1×"],[2,"2×"]].map(([v,l])=>`<option value="${v}" ${v===V.speed?"selected":""}>${l}</option>`).join("")}</select>
        </div>
        <div class="strip" id="vstrip">${fr.map((src,j)=>`<img src="${esc(src)}" alt="" data-f="${j}" loading="lazy">`).join("")}</div>
        <p class="muted small" style="margin:6px 0 0">Look at where the ball sits on the face (heel vs. toe) and the club's direction through impact. Keys: ←/→ frame · space play · ↑/↓ shot · Esc close.</p>`:""}
      </div>
    </div>
    <div class="vstats">
      ${st("Carry","carry",f(r.carry)+" yd",tb("carry"))}
      ${st("Total","total",f(r.total)+" yd")}
      ${st("Finish","side",lr(r.side,1))}
      ${st("Ball speed","ball",f(r.ballSpeed)+" mph",tb("ball"))}
      ${st("Club speed","club",f(r.clubSpeed)+" mph",tb("club"))}
      ${st("Smash","smash",f(r.smash,2),tb("smash"))}
      ${st("Launch","launch",f(r.launch)+"°",tb("launch"))}
      ${st("Back spin","spin",r.backSpin==null?"—":Math.round(r.backSpin).toLocaleString(),tb("spin"))}
      ${st("Apex","apex",f(r.apex)+" yd",tb("apex"))}
      ${st("Land angle","descent",f(r.descent)+"°",tb("descent"))}
      ${st("Club path","path",sg(r.path)+"°","Tour ≈ 0")}
      ${st("Face","face",sg(r.face)+"°")}
      ${st("Face-to-path","f2p",sg(r.f2p)+"°","Goal ±3")}
      ${st("Side spin","spin",r.sideSpin==null?"—":lr(r.sideSpin))}
    </div></div>`;
  $("vclose").onclick = closeShot; $("vprev").onclick = ()=>stepShot(-1); $("vnext").onclick = ()=>stepShot(1);
  if (fr.length){
    $("vplay").onclick = ()=> V.timer ? stopPlay() : startPlay();
    $("vfb").onclick = ()=>{stopPlay();setFrame(V.frame-1);}; $("vff").onclick = ()=>{stopPlay();setFrame(V.frame+1);};
    $("vr").oninput = e=>{stopPlay();setFrame(+e.target.value);};
    $("vspeed").onchange = e=>{V.speed=+e.target.value; if(V.timer) startPlay();};
    document.querySelectorAll("#vstrip img").forEach(im=>im.onclick=()=>{stopPlay();setFrame(+im.dataset.f);});
    setFrame(V.frame);
  }
}
vEl.addEventListener("click", e=>{ if (e.target===vEl) closeShot(); });
document.addEventListener("keydown", e=>{
  if (vEl.hidden) return;
  if (e.key==="Escape") closeShot();
  else if (e.key==="ArrowRight"){ e.preventDefault(); stopPlay(); setFrame(V.frame+1); }
  else if (e.key==="ArrowLeft"){ e.preventDefault(); stopPlay(); setFrame(V.frame-1); }
  else if (e.key==="ArrowDown"){ e.preventDefault(); stepShot(1); }
  else if (e.key==="ArrowUp"){ e.preventDefault(); stepShot(-1); }
  else if (e.key===" "){ e.preventDefault(); V.timer ? stopPlay() : startPlay(); }
});


/* ---------- DRILLS ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const ytWatch = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
const ytSearch = q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
function renderDrills(){
  const D = DATA.drills || {}, drills = D.drills || [], plan = D.plan || [], res = D.resources || [];
  const done = store.get("golf-plan-v1", {});
  const base = ALL[0], now = ALL[state.i];
  const stat = A => ({ path:mean(A.full.map(r=>r.path)), f2p:mean(A.full.map(r=>r.f2p)), smash:median(A.full.filter(r=>IRON(r.key)).map(r=>r.smash)) });
  const b0 = stat(base), n0 = stat(now);
  const goals = [
    {label:"Club path", unit:"°", start:b0.path, now:n0.path, goal:-3, dp:1, grade:gPath},
    {label:"Face-to-path", unit:"°", start:b0.f2p, now:n0.f2p, goal:3, dp:1, grade:gF2P},
    {label:"Iron smash", unit:"", start:b0.smash, now:n0.smash, goal:1.30, dp:2, grade:gSmash},
  ].map(g=>({...g, pct: g.start==null||g.now==null||g.start===g.goal ? 0 : Math.max(0, Math.min(100, (g.start-g.now)/(g.start-g.goal)*100))}));
  const totalTasks = plan.reduce((n,l)=>n+l.tasks.length,0), doneTasks = Object.values(done).filter(Boolean).length;
  $("tab-drills").innerHTML = `
    <section class="card">
      <div class="sec"><h2>Practice plan</h2><span class="muted small">${doneTasks}/${totalTasks} tasks done · ticks are saved in this browser</span></div>
      <p class="lede">Four levels, in priority order. Tick tasks off as you go, and log a session at the end of each level to see whether the numbers moved.</p>
      <div class="levels">${plan.map(l=>{
        const n = l.tasks.length, d = l.tasks.filter((_,j)=>done[`${l.level}:${j}`]).length;
        return `<div class="lvl ${d===n?"done":""}"><h3>Level ${l.level}${d===n?" ✓":""}</h3><div class="nm">${esc(l.name)}</div>
          <div class="xp" title="${d}/${n}"><i style="width:${n?d/n*100:0}%"></i></div>
          ${l.tasks.map((t,j)=>`<label class="task"><input type="checkbox" data-task="${l.level}:${j}" ${done[`${l.level}:${j}`]?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`;}).join("")}</div>
    </section>

    <section class="card">
      <div class="sec"><h2>Progress to targets</h2><span class="muted small">${base===now?"baseline "+now.s.iso:`${base.s.iso} → ${now.s.iso}`}</span></div>
      <p class="lede">How far you've moved from your first session toward each goal.</p>
      <div class="bars">${goals.map(g=>`<div class="bar" style="grid-template-columns:120px 1fr 190px"><span>${g.label}</span><div class="track"><div class="fill" style="width:${g.pct.toFixed(0)}%;background:var(--gold)"></div></div><span class="num">${g.unit==="°"?sg(g.now,g.dp):f(g.now,g.dp)}${g.unit} → ${g.unit==="°"?sg(g.goal,0):f(g.goal,2)}${g.unit} · ${g.grade(g.now)}</span></div>`).join("")}</div>
    </section>

    ${drills.map(d=>`<section class="card drill" style="--dc:${esc(d.color||"var(--gold)")}">
      <div>
        <div class="lv">Level ${d.level} · ${d.fixes.map(esc).join(" · ")}</div>
        <h3>${esc(d.title)}</h3>
        <p class="muted" style="margin:0 0 8px">${esc(d.why)}</p>
        <ol>${d.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
        <div class="tgt"><b>Target:</b> ${esc(d.target)}</div>
        <div class="src">Source: <a href="${esc(d.source.url)}" target="_blank" rel="noopener">${esc(d.source.name)} ↗</a></div>
      </div>
      <div class="vids">${d.videos.map(v=>`<div>
          <button class="yt" data-yt="${esc(v.id)}" data-title="${esc(v.title)}" style="background-image:url('https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg')" aria-label="Play video: ${esc(v.title)}"><span class="play">▶</span><span class="ttl">${esc(v.title)}</span></button>
          <div class="vidrow"><a class="yt-link red" href="${ytWatch(v.id)}" target="_blank" rel="noopener">Watch on YouTube ↗</a></div>
        </div>`).join("")}
        <a class="yt-link" href="${ytSearch(d.search)}" target="_blank" rel="noopener" style="justify-self:start">More videos: “${esc(d.search)}” ↗</a>
      </div>
    </section>`).join("")}

    ${res.length?`<section class="card"><div class="sec"><h2>Resources</h2></div><p class="lede">The coaching sources behind these drills.</p>
      <div class="resources">${res.map(r=>`<a class="res" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.name)}</b><span>${esc(r.desc)}</span></a>`).join("")}</div></section>`:""}`;

  document.querySelectorAll("#tab-drills input[data-task]").forEach(cb=>cb.onchange=()=>{
    const d = store.get("golf-plan-v1", {}); d[cb.dataset.task] = cb.checked; store.set("golf-plan-v1", d);
    sfx(cb.checked ? "coin" : "blip"); renderDrills();
  });
  document.querySelectorAll("#tab-drills .yt").forEach(btn=>btn.onclick=()=>{
    const id = btn.dataset.yt;
    if (location.protocol === "file:") { window.open(ytWatch(id), "_blank", "noopener"); return; }  // YouTube refuses embeds on file:// pages
    btn.outerHTML = `<div class="yt" style="cursor:default"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(btn.dataset.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  });
}

/* ---------- arcade sound + CRT ---------- */
let actx = null, sfxOn = store.get("golf-sfx", false);
function sfx(kind="blip"){
  if (!sfxOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind==="coin" ? [988,1319] : kind==="tab" ? [523,784] : [660];
    notes.forEach((hz,i)=>{
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*0.07;
      o.type = "square"; o.frequency.setValueAtTime(hz, t);
      g.gain.setValueAtTime(0.045, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.1);
    });
  } catch {}
}
function setSwitch(id, on){ $(id).setAttribute("aria-pressed", on); }
$("sfx").onclick = () => { sfxOn = !sfxOn; store.set("golf-sfx", sfxOn); setSwitch("sfx", sfxOn); sfx("coin"); };
let crtOn = store.get("golf-crt", false);
document.body.classList.toggle("crt", crtOn); setSwitch("crt", crtOn); setSwitch("sfx", sfxOn);
$("crt").onclick = () => { crtOn = !crtOn; store.set("golf-crt", crtOn); document.body.classList.toggle("crt", crtOn); setSwitch("crt", crtOn); sfx(); };
document.addEventListener("click", e => {
  const t = e.target.closest(".nav button"); if (t) return sfx("tab");
  if (e.target.closest(".chip, .toggle:not(#sfx), .seg button, .hole, .iconbtn, .datepick button, summary, tr.clickable, .yt")) sfx();
});

/* ---------- wiring ---------- */
const sel = $("date");
sel.innerHTML = ALL.map((A,i)=>`<option value="${i}">${A.s.iso} · ${A.keys.reduce((n,k)=>n+A.clubs[k].n,0)} shots${A.meta.curated?" · best":""}</option>`).reverse().join("");
function render(){
  if (!ALL.length) return;
  sel.value = state.i;
  $("prev").disabled = state.i<=0; $("next").disabled = state.i>=ALL.length-1;
  document.querySelectorAll("main").forEach(m=>m.hidden = m.id !== "tab-"+state.tab);
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  ({session:renderSession, trend:renderTrend, bag:renderBag, course:renderCourse, drills:renderDrills})[state.tab]();
  history.replaceState(null, "", `#${ALL[state.i].s.date}/${state.tab}${state.club?"/"+state.club:""}`);
}
const [hd, ht, hc] = location.hash.slice(1).split("/");
const hi = ALL.findIndex(A=>A.s.date===hd); if (hi>=0) state.i = hi;
if (["session","trend","bag","course","drills"].includes(ht)) state.tab = ht;
if (hc) state.club = hc;
sel.onchange = () => { state.i = +sel.value; render(); };
$("prev").onclick = () => { state.i--; render(); };
$("next").onclick = () => { state.i++; render(); };
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo({top:0});});

// glossary tooltips
const tipEl = $("tip");
document.addEventListener("mouseover", e=>{ const t=e.target.closest("[data-tip]"); if(!t||!t.dataset.tip){tipEl.hidden=true;return;}
  tipEl.textContent=t.dataset.tip; tipEl.hidden=false; const r=t.getBoundingClientRect();
  const x=Math.min(window.innerWidth-tipEl.offsetWidth-8, Math.max(8, r.left)); const y=r.bottom+8+tipEl.offsetHeight>window.innerHeight ? r.top-tipEl.offsetHeight-8 : r.bottom+8;
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px"; });
window.addEventListener("scroll", ()=>tipEl.hidden=true, {passive:true});

$("foot").textContent = `Built ${DATA.built} from ${ALL.length} session folder(s) · Benchmarks: TrackMan PGA/LPGA Tour averages, Shot Scope 25-handicap averages · Rebuild: python3 -I scripts/build_dashboard.py`;
if (ALL.length) render(); else $("tab-session").innerHTML = `<section class="card empty">No sessions found.</section>`;
</script>
