<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#101a14; --panel:#16231b; --panel2:#1c2c22; --panel3:#23362a; --line:#2a3f31; --line2:#36503f;
    --ink:#e9e5d3; --ink2:#c9c6b4; --muted:#93a796; --faint:#617566;
    --green:#9fd07c; --green2:#6fae5a; --sand:#e3c97a; --cream:#f1ead0;
    --bad:#e58a76; --warn:#e3c97a; --good:#9fd07c; --info:#88bccd;
    --pixel:"Press Start 2P",ui-monospace,Menlo,monospace;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:10px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--green)}
  .page{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
  :focus-visible{outline:2px solid var(--sand);outline-offset:2px}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,26,20,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 28px;padding:14px 20px}
  .top-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:15px;color:var(--cream);letter-spacing:.04em;text-shadow:2px 2px 0 #0a120d}
  .brand span{color:var(--green)}
  .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .date{display:flex;align-items:center;gap:6px}

  /* buttons: one calm style everywhere */
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;color:var(--ink2);padding:7px 14px;font-size:13.5px;font-weight:400;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .08s;white-space:nowrap}
  .btn:hover{background:var(--panel3);border-color:var(--green2);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn[aria-pressed="true"],.btn[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#132016;font-weight:700}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.sm{padding:5px 11px;font-size:13px}
  .btn.icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%}
  .btn .sw{width:9px;height:9px;border-radius:50%}
  .btn .n{font-family:var(--mono);font-size:12.5px;opacity:.75}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tabs .btn{border:0;background:none;padding:6px 14px}
  .tabs .btn[aria-selected="true"]{background:var(--green);color:#132016}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font:400 13.5px var(--sans);height:34px;cursor:pointer}
  .row-btns{display:flex;flex-wrap:wrap;gap:8px}

  /* type + layout */
  h2{font-size:13px;font-weight:700;line-height:1.5;margin:0;color:var(--cream);letter-spacing:.1em;text-transform:uppercase}
  h3{font-size:16px;margin:0 0 4px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .bad{color:var(--bad)} .warn{color:var(--warn)} .good{color:var(--good)} .info{color:var(--info)}
  .stack{display:grid;gap:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .chart{position:relative;height:360px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .note{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--sand);background:rgba(227,201,122,.08);border:1px solid rgba(227,201,122,.25);border-radius:999px;padding:4px 12px}

  /* overview strip */
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
  .ov{background:var(--panel);padding:14px 18px}
  .ov .l{color:var(--muted);font-size:12.5px}
  .ov .v{font-family:var(--mono);font-size:22px;color:var(--cream);line-height:1.3}
  .ov .c{font-size:12.5px;color:var(--faint)}
  .ov.now{background:var(--panel2)}
  .ov.now .l{color:var(--green)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .stat .l{color:var(--muted);font-size:13px;font-weight:400}
  .stat .v{font-family:var(--mono);font-size:28px;font-weight:400;line-height:1.15;margin:6px 0 2px;color:var(--cream)}
  .stat .c{font-size:13px;color:var(--muted)}
  .grade{font-size:19px;font-weight:700;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel2);border:1px solid var(--line2)}
  .gA{color:var(--good)} .gB{color:#c3d77c} .gC{color:var(--sand)} .gD{color:#e8a676} .gF{color:var(--bad)}

  /* focus list */
  .focus{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .focus li{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
  .focus .i{font-size:14px;font-weight:700;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--sand)}
  .focus b{display:block;font-weight:700;color:var(--ink)}
  .focus span{color:var(--ink2);font-size:14px}
  details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;color:var(--green);font-size:14px;font-weight:400;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ "} details[open] > summary::before{content:"− "}
  .findings{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
  .findings li{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px;color:var(--ink2);padding:4px 0}
  .findings b{color:var(--ink);font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--faint)}
  .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.info{background:var(--info)}
  .notes{font-size:14px;color:var(--ink2)}
  .notes h3,.notes h4,.notes h5{font-size:14px;color:var(--sand);margin:14px 0 4px}
  .notes ul{padding-left:18px;margin:4px 0} .notes li{margin:3px 0} .notes p{margin:6px 0} .notes strong{color:var(--ink)}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12.5px}

  /* club detail */
  .detail{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:24px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .bigrow{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end;margin-bottom:12px}
  .big{font-family:var(--mono);font-size:44px;line-height:1;color:var(--cream)}
  .big small{font-size:15px;color:var(--muted);margin-left:4px}
  .kv .l{color:var(--muted);font-size:12.5px} .kv .v{font-family:var(--mono);font-size:17px}
  .bars{display:grid;gap:8px;margin-top:8px}
  .bar{display:grid;grid-template-columns:64px 1fr 86px;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
  .bar .track{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;border-radius:4px}
  .bar .val{text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .caveat{font-size:13.5px;color:var(--sand);margin:0 0 10px}

  /* tables */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  td{font-family:var(--mono);font-size:13.5px}
  td:first-child,td.tl{font-family:var(--sans);font-size:14px}
  th{color:var(--muted);font-weight:400;font-size:12.5px}
  th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
  th:first-child,td:first-child,.tl{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  tr.clickable{cursor:pointer}
  tr.sel{background:var(--panel3)}
  .tag{display:inline-block;font-family:var(--sans);font-size:11px;padding:0 7px;border-radius:999px;background:var(--panel3);color:var(--muted);margin-left:6px;vertical-align:1px}
  .tag.warn{color:var(--sand);background:rgba(227,201,122,.12)}
  .cn{display:inline-flex;align-items:center;gap:8px;font-weight:700}
  .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
  img.thumb{width:30px;height:32px;object-fit:cover;border-radius:5px;display:block;background:#000}
  [data-tip]{text-decoration:underline dotted var(--faint);text-underline-offset:3px;cursor:help}
  #tip{position:fixed;z-index:200;max-width:280px;background:#0b130e;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;pointer-events:none}

  /* course planner */
  .scorecard{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .hb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;min-width:0}
  .hb:hover{border-color:var(--green2)}
  .hb[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#132016}
  .hb .h{font-size:11px;font-weight:700;opacity:.75}
  .hb .y{font-family:var(--mono);font-size:14px;font-weight:700;margin-top:3px}
  .hb .p{font-size:11px;opacity:.75}
  .hb .k{font-size:11.5px;font-weight:700;margin-top:2px;color:var(--sand)}
  .hb[aria-pressed="true"] .k{color:#132016}
  .nine{font-size:12px;color:var(--muted);margin:10px 0 6px}
  .planner{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
  .map{background:#0d1610;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .map svg{display:block;width:100%;height:auto}
  .hole-title{font-family:var(--mono);font-size:26px;color:var(--cream);line-height:1.2}
  .hole-title small{font-size:14px;color:var(--muted);margin-left:8px;font-family:var(--sans)}
  .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
  .fact{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .fact .l{color:var(--muted);font-size:12.5px} .fact .v{font-family:var(--mono);font-size:18px;color:var(--ink)}
  .meter{height:6px;background:var(--panel3);border-radius:3px;margin-top:6px;overflow:hidden} .meter i{display:block;height:100%;background:var(--green);border-radius:3px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  /* viewer */
  .viewer{position:fixed;inset:0;z-index:150;background:rgba(6,10,8,.8);display:flex;align-items:center;justify-content:center;padding:16px}
  .vbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(1040px,100%);max-height:100%;overflow:auto;padding:22px}
  .vgrid{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:16px}
  .frame{background:#000;border-radius:8px;overflow:hidden;position:relative}
  .frame img{width:100%;height:auto;display:block}
  .frame .cap{position:absolute;left:8px;top:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:999px}
  .player{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .player input[type=range]{flex:1;min-width:140px;accent-color:var(--green)}
  .strip{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
  .strip img{height:40px;border-radius:4px;opacity:.4;cursor:pointer;flex:none;border:2px solid transparent}
  .strip img.on{opacity:1;border-color:var(--green)}
  .vstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:16px}
  .vstat{background:var(--panel2);border-radius:8px;padding:8px 12px}
  .vstat .l{color:var(--muted);font-size:12px} .vstat .v{font-family:var(--mono);font-size:17px} .vstat .b{font-size:11.5px;color:var(--faint)}

  /* drills */
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .lvl{background:var(--panel2);border-radius:8px;padding:14px}
  .lvl .t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sand)}
  .lvl .nm{font-weight:700;margin:6px 0 8px}
  .task{display:flex;gap:9px;align-items:flex-start;padding:3px 0;font-size:13.5px;color:var(--ink2);cursor:pointer}
  .task input{accent-color:var(--green);width:16px;height:16px;margin-top:3px;flex:none}
  .task input:checked + span{text-decoration:line-through;color:var(--faint)}
  .drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
  .drill .lv{font-size:12.5px;color:var(--sand);font-weight:400}
  .drill h3{font-size:19px;margin:4px 0 6px}
  .drill ol{padding-left:20px;margin:8px 0;color:var(--ink2)} .drill li{margin:4px 0}
  .drill .tgt{font-size:14px;margin:10px 0;color:var(--ink)}
  .yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000 center/cover no-repeat;cursor:pointer;overflow:hidden;padding:0}
  .yt::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:40px;border-radius:10px;background:rgba(16,26,20,.85);color:var(--green);display:grid;place-items:center;font-size:18px;transition:background .15s}
  .yt:hover::after{background:var(--green);color:#132016}
  div.yt::after{display:none}
  .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-cap{font-size:13px;color:var(--muted);margin:6px 0 12px;display:flex;justify-content:space-between;gap:8px}
  .resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .res{display:block;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink2);font-size:13.5px}
  .res:hover{border-color:var(--green2)}
  .res b{display:block;color:var(--green);font-size:15px}
  .proj{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .proj > div{background:var(--panel2);border-radius:8px;padding:14px}
  .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:2px 0}
  .r span:last-child{font-family:var(--mono);color:var(--ink)}
  .empty{color:var(--muted);font-style:italic}
  footer{color:var(--faint);font-size:12.5px;margin-top:36px}

  @media (max-width:860px){
    .overview{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:1fr}
    .detail,.planner,.vgrid,.drill,.proj{grid-template-columns:1fr}
    .levels{grid-template-columns:1fr 1fr}
    .scorecard{grid-template-columns:repeat(9,minmax(34px,1fr));overflow-x:auto}
    .chart{height:300px}
    .planner .map{max-width:340px}
  }
  @media (max-width:520px){ .levels{grid-template-columns:1fr} .stat .v{font-size:26px} .hb .k{display:none} }
</style>
</head>
<body>
<div class="page">
  <div class="top"><div class="top-in">
    <div class="brand">⛳ SIMPLE <span>GOLF</span></div>
    <div class="right">
      <div class="date">
        <button class="btn icon" id="prev" aria-label="Previous session">‹</button>
        <select id="date" aria-label="Session date"></select>
        <button class="btn icon" id="next" aria-label="Next session">›</button>
      </div>
      <nav class="tabs" role="tablist">
        <button class="btn" role="tab" data-tab="session">Session</button>
        <button class="btn" role="tab" data-tab="course">Course</button>
        <button class="btn" role="tab" data-tab="trend">Progress</button>
        <button class="btn" role="tab" data-tab="bag">Bag</button>
        <button class="btn" role="tab" data-tab="drills">Drills</button>
      </nav>
    </div>
  </div></div>

  <section class="overview" id="overview"></section>
  <main id="tab-session" class="stack"></main>
  <main id="tab-course" class="stack" hidden></main>
  <main id="tab-trend" class="stack" hidden></main>
  <main id="tab-bag" class="stack" hidden></main>
  <main id="tab-drills" class="stack" hidden></main>
  <footer id="foot"></footer>
</div>
<div id="tip" hidden></div>
<div id="viewer" class="viewer" hidden></div>

<script>
const DATA = __DATA__;

/* ================= reference data ================= */
// TrackMan tour averages (legacy published table; 2023 update lists PGA 7i at 176 yd / 92 mph / 123 mph ball / 1.34).
const T = (club,ball,smash,launch,spin,apex,descent,carry) => ({club,ball,smash,launch,spin,apex,descent,carry});
const BENCH = {
  pga: {Dr:T(113,167,1.48,10.9,2686,32,38,275), "3W":T(107,158,1.48,9.2,3655,30,43,243), "3H":T(100,146,1.46,10.2,4437,29,47,225),
        "6i":T(92,127,1.38,14.1,6231,30,50,183), "7i":T(90,120,1.33,16.3,7097,32,50,172), "8i":T(87,115,1.32,18.1,7998,31,50,160),
        "9i":T(85,109,1.28,20.4,8647,30,51,148), PW:T(83,102,1.23,24.2,9304,29,52,136)},
  lpga:{Dr:T(94,140,1.48,13.2,2611,25,37,218), "3W":T(90,132,1.47,11.2,2704,23,39,195), "7W":T(85,123,1.45,12.7,4693,25,46,174),
        "6i":T(78,109,1.40,17.1,5943,25,46,152), "7i":T(76,104,1.37,19.0,6699,26,47,141), "8i":T(74,100,1.35,20.8,7494,25,47,130),
        "9i":T(72,93,1.29,23.9,7589,26,47,119), PW:T(70,86,1.23,25.6,8403,23,48,107)},
  hcp25:{"6i":{carry:137},"7i":{carry:132},"8i":{carry:122},"9i":{carry:108}},
};
const METRICS = [
  {k:"carry",label:"Carry",unit:"yd",shot:"carry",dp:1},{k:"total",label:"Total",unit:"yd",shot:"total",dp:1},
  {k:"ball",label:"Ball speed",unit:"mph",shot:"ballSpeed",dp:1},{k:"club",label:"Club speed",unit:"mph",shot:"clubSpeed",dp:1},
  {k:"smash",label:"Smash",unit:"",shot:"smash",dp:2},{k:"launch",label:"Launch",unit:"°",shot:"launch",dp:1},
  {k:"spin",label:"Back spin",unit:"rpm",shot:"backSpin",dp:0},{k:"apex",label:"Apex",unit:"yd",shot:"apex",dp:1},
  {k:"descent",label:"Land angle",unit:"°",shot:"descent",dp:1},{k:"path",label:"Club path",unit:"°",shot:"path",dp:1,zero:true},
  {k:"f2p",label:"Face-to-path",unit:"°",shot:"f2p",dp:1,zero:true},{k:"side",label:"Finish L/R",unit:"yd",shot:"side",dp:1,zero:true},
];
const MET = Object.fromEntries(METRICS.map(m=>[m.k,m]));
const GLOSS = {
  carry:"Distance the ball flies in the air.", total:"Carry plus roll.", spread:"About two-thirds of shots land within ± this of your average carry.",
  smash:"Ball speed ÷ club speed: how centred the strike was. Irons: 1.30+ is good.",

/* ================= helpers ================= */
const vals = a => a.filter(x => x != null && !Number.isNaN(x));
const mean = a => { a = vals(a); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const median = a => { a = vals(a).sort((x,y)=>x-y); if(!a.length) return null; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; };
const sd = a => { a = vals(a); const m = mean(a); return a.length>1 ? Math.sqrt(mean(a.map(x=>(x-m)**2))) : null; };
const corr = (a,b) => { const p=a.map((x,i)=>[x,b[i]]).filter(([x,y])=>x!=null&&y!=null); if(p.length<5) return null;
  const ma=mean(p.map(q=>q[0])), mb=mean(p.map(q=>q[1])), sa=sd(p.map(q=>q[0])), sb=sd(p.map(q=>q[1]));
  return sa&&sb ? mean(p.map(([x,y])=>(x-ma)*(y-mb)))/(sa*sb) : null; };
const f = (x,d=1) => x==null||Number.isNaN(x) ? "—" : x.toFixed(d);
const sg = (x,d=1) => x==null ? "—" : (x>0?"+":"")+x.toFixed(d);
const lr = (x,d=0) => x==null ? "—" : Math.abs(x) < 0.5 ? "centre" : `${Math.abs(x).toFixed(d)} ${x>0?"R":"L"}`;
const fm = (m,v) => v==null ? "—" : (m.zero ? sg(v,m.dp) : m.k==="spin" ? Math.round(v).toLocaleString() : v.toFixed(m.dp)) + (m.unit && m.unit!=="°" ? " "+m.unit : m.unit);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= analysis ================= */
function analyze(s){
  const keys = Object.keys(s.clubs).sort((a,b)=>loftOf(a)-loftOf(b));
  const ironSpeed = mean(keys.filter(IRON).flatMap(k=>s.clubs[k].map(r=>r.clubSpeed)));
  const meta = s.meta || {}, clubs = {};
  for (const k of keys){
    const shots = s.clubs[k].map(r=>({...r, key:k, f2p:(r.face!=null&&r.path!=null)?+(r.face-r.path).toFixed(1):null,
      suspect:(loftOf(k)>=24 && r.smash>1.38) || (loftOf(k)>=27 && loftOf(k)<=41 && r.backSpin<2500)}));
    const g = p => shots.map(r=>r[p]);
    const cs = mean(g("clubSpeed"));
    clubs[k] = { key:k, shots, n:shots.length, partial: WEDGE(k) && ironSpeed!=null && cs < 0.9*ironSpeed, caveat: meta.caveats?.[k] || null,
      carry:mean(g("carry")), total:mean(g("total")), roll:mean(shots.map(r=>r.total-r.carry)), carrySd:sd(g("carry")), totalSd:sd(g("total")),
      cmin:Math.min(...vals(g("carry"))), cmax:Math.max(...vals(g("carry"))), sideSd:sd(g("side")),
      smash:median(g("smash")), ball:mean(g("ballSpeed")), club:cs, spin:mean(g("backSpin")), launch:mean(g("launch")),
      apex:mean(g("apex")), descent:mean(g("descent")), path:mean(g("path")), face:mean(g("face")), f2p:mean(g("f2p")), side:mean(g("side")) };
  }
  const full = keys.filter(k=>!clubs[k].partial).flatMap(k=>clubs[k].shots);
  return { s, meta, keys, clubs, full };
}
function findings(A){
  const F = [], {clubs, keys, full} = A;
  const fp = mean(full.map(r=>r.path)), ff = mean(full.map(r=>r.f2p)), fface = mean(full.map(r=>r.face));
  if (fp!=null){
    const nOut = full.filter(r=>r.path<=-6).length;
    if (fp < -4) F.push({sev:"bad", t:`Swinging out-to-in (${sg(fp)}°)`, b:`${nOut} of ${full.length} full swings were −6° or worse. This is the root of the slice and the heel strikes.`});
    else if (fp < -2) F.push({sev:"warn", t:`Path slightly out-to-in (${sg(fp)}°)`, b:"Close to the ±2° window."});
    else if (fp > 4) F.push({sev:"warn", t:`Path in-to-out (${sg(fp)}°)`, b:"Watch for pushes and hooks."});
    else F.push({sev:"good", t:`Neutral path (${sg(fp)}°)`, b:"Inside the target window."});
  }
  if (ff!=null){
    if (ff > 3) F.push({sev:"bad", t:`Ball curving right (face ${sg(ff)}° open to path)`, b: Math.abs(fface)<3 ? `Your face to the target is only ${sg(fface)}°, so fix the path, not the face.` : "The face is open to the path."});
    else if (ff < -3) F.push({sev:"bad", t:`Ball curving left (face ${sg(ff)}° closed to path)`, b:"Draw/hook curvature."});
    else F.push({sev:"good", t:`Curve under control (${sg(ff)}°)`, b:"Face-to-path inside ±3°."});
  }
  const low = keys.filter(k=>!clubs[k].partial && BENCH.pga[k]?.smash && clubs[k].smash < BENCH.pga[k].smash-0.06);
  if (low.length) F.push({sev:low.length>1?"bad":"warn", t:"Off-centre strikes", b:low.map(k=>`${nameOf(k)} ${f(clubs[k].smash,2)} vs Tour ${BENCH.pga[k].smash}`).join(", ")+"."});
  const clean = full.filter(r=>!r.suspect), r = corr(clean.map(x=>x.clubSpeed), clean.map(x=>x.smash));
  if (r!=null && r < -0.3) F.push({sev:"bad", t:"Contact breaks down when you swing harder", b:`Speed vs. smash r = ${f(r,2)}. Groove the path at 70–80% speed first.`});
  const ir = keys.filter(k=>IRON(k) && !clubs[k].partial);
  if (ir.length){ const ratio = mean(ir.map(k=>clubs[k].launch/loftOf(k))); const ex = ir.includes("8i")?"8i":ir[0];
    if (ratio > 0.7) F.push({sev:"warn", t:"Launching high for the loft", b:`${f(clubs[ex].launch)}° launch with a ${loftOf(ex)}° ${nameOf(ex)}. You're adding loft at impact (early extension, linked to S-posture).`}); }
  const fk = keys.filter(k=>!clubs[k].partial && CLUB[k]);
  for (let i=0;i<fk.length-1;i++){ const a=fk[i], b=fk[i+1], gap=clubs[a].carry-clubs[b].carry, cav=clubs[a].caveat||clubs[b].caveat;
    if (gap < 6) F.push({sev:cav?"warn":"bad", t:`${nameOf(a)} and ${nameOf(b)} overlap`, b:`Only ${f(gap)} yd apart.`+(cav?" Flagged as a possible outlier, so retest first.":"")}); }
  const c7 = clubs["7i"];
  if (c7 && c7.club>70 && c7.club<82 && c7.carry<133) F.push({sev:"info", t:"LPGA speed, lost at the strike", b:`${f(c7.club)} mph 7-iron is LPGA speed; they carry it 141 yd, you carried ${f(c7.carry,0)}.`});
  const sus = full.filter(x=>x.suspect).map(x=>`${nameOf(x.key)} #${x.n}`);
  if (sus.length) F.push({sev:"info", t:"Possible sensor misreads", b:sus.join(", ")+". Medians limit their effect."});
  const order={bad:0,warn:1,info:2,good:3};
  return F.sort((a,b)=>order[a.sev]-order[b.sev]);
}

      plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>c.raw?.r?shotTip(c.raw.r):c.dataset.type==="scatter"?`${c.dataset.label}: ${fm(m,c.raw.y)}`:`You: ${fm(m,c.raw)}`}}}}});

/* ================= club model (measured or estimated) for course planning ================= */
function latestFor(k){
  for (let i=state.i;i>=0;i--){ const c=ALL[i].clubs[k]; if (c && !c.partial) return {c, date:sName(i)}; }
  for (let i=state.i;i>=0;i--){ const c=ALL[i].clubs[k]; if (c) return {c, date:sName(i)}; }
  return null;
}
// Clubs not measured yet are estimated from the latest full 7-iron (carry ratio, roll %), or from the AW for wedges.
const EST = {Dr:[1.55,.12],"3W":[1.40,.09],"3H":[1.25,.07],"7W":[1.15,.06],"6i":[1.04,.07]};
const WEST = {"51":12,"56":24,"60":34};
function clubModel(k){
  const L = latestFor(k);
  if (L && !L.c.partial){
    const c=L.c; return {key:k, carry:c.carry, total:c.total, carrySd:c.carrySd||5, totalSd:c.totalSd||c.carrySd||5, side:c.side||0, sideSd:c.sideSd||6,
      shots:c.shots, est:false, caveat:c.caveat, date:L.date};
  }
  const L7 = latestFor("7i"), LA = latestFor("AW"), s7 = L7&&!L7.c.partial ? L7.c : null;
  if (EST[k] && s7){ const [r,roll]=EST[k]; const carry=s7.carry*r;
    return {key:k, carry, total:carry*(1+roll), carrySd:(s7.carrySd||8)*r, totalSd:(s7.carrySd||8)*r*1.05, side:(s7.side||0)*r, sideSd:(s7.sideSd||10)*Math.pow(r,1.4),
      shots:[], est:true, caveat:s7.caveat?"Estimated from a 7-iron flagged as a possible outlier.":null}; }
  if (WEST[k]!=null && LA && !LA.c.partial){ const a=LA.c, carry=a.carry-WEST[k];
    return {key:k, carry, total:carry*1.03, carrySd:a.carrySd||5, totalSd:a.carrySd||5, side:a.side||0, sideSd:a.sideSd||4, shots:[], est:true}; }
  return null;
}

/* ================= COURSE ================= */
function courseBag(course){
  const set = DATA.bag.sets.find(s=>s.name===course.bag) || DATA.bag.sets[0];
  return set.clubs.filter(c=>(c.key||c.equiv)!=="Putter").map(c=>{ const k=c.key||c.equiv, m=clubModel(k);
    return m ? {...m, label:c.label, short:c.key?nameOf(k):c.label.replace(" Iron","i").replace(" Wood","W").replace("Pitching Wedge","PW")} : null; })
    .filter(Boolean).sort((a,b)=>b.carry-a.carry);
}
const fitScore = (carry, yds) => carry>=yds ? carry-yds : (yds-carry)*1.5;
function plan(course, par, yds, bag, pick){
  const fw = (course.fairway||32)/2, greenR = 13;
  const offset = m => state.aim ? -m.side : 0;   // aim correction shifts the pattern back to centre
  const evalClub = m => {
    if (par===3){
      const p = pBetween(-greenR,greenR,m.side+offset(m),m.sideSd) * pBetween(yds-greenR,yds+greenR,m.carry,m.carrySd);
      return {m, land:m.carry, p, plabel:"On the green", score:-fitScore(m.carry,yds)};
    }
    const p = pBetween(-fw,fw,m.side+offset(m),m.sideSd), left = yds - m.total;
    return {m, land:m.total, p, plabel:"In the fairway", score: (left<40 ? -999 : m.total*(0.6+0.4*p))};
  };
  const evals = bag.filter(m=>par===3 || !CLUB[m.key] || loftOf(m.key)<=36).map(evalClub);
  const best = evals.slice().sort((a,b)=>b.score-a.score)[0];
  const chosen = evals.find(e=>e.m.key===pick) || best;
  let next = null;
  if (par>3 && chosen){
    const R = yds - chosen.land, approach = bag.filter(m=>m.key!=="Dr");
    const maxC = approach[0]?.carry || 0;
    if (R > maxC + 15){ const lay = approach.find(m=>R - m.total >= 60) || approach[0]; const R2 = R - lay.total;
      const a2 = approach.slice().sort((a,b)=>fitScore(a.carry,R2)-fitScore(b.carry,R2))[0];
      next = `Lay up with the ${lay.label} (~${f(lay.total,0)} yd), then ~${f(R2,0)} yd in with the ${a2.label}.`; }
    else { const a = approach.slice().sort((a,b)=>fitScore(a.carry,R)-fitScore(b.carry,R))[0]; next = `~${f(R,0)} yd in with the ${a.label}.`; }
  }
  return {best, chosen, evals, next, fw, greenR};
}
function holeSVG(par, yds, P){
  const m = P.chosen.m, W = 300, H = 520, pad = 26, spanX = 60;
  const sdY = par===3 ? m.carrySd : m.totalSd;
  const maxD = Math.max(yds, P.chosen.land + 2*sdY) + 25;
  const X = x => W/2 + x/spanX*(W/2-10), Y = d => H - pad - d/maxD*(H-2*pad);
  const aimX = state.aim ? -m.side : 0, cx = m.side + aimX, cy = P.chosen.land;
  let g = `<rect width="${W}" height="${H}" fill="#0d1610"/>`;
  for (let d=50; d<maxD; d+=50) g += `<line x1="0" x2="${W}" y1="${Y(d)}" y2="${Y(d)}" stroke="rgba(233,229,211,.06)"/><text x="6" y="${Y(d)-4}" fill="#617566" font-size="10" font-family="Space Mono, monospace">${d}</text>`;
  if (par>3) g += `<rect x="${X(-P.fw)}" y="${Y(yds-15)}" width="${X(P.fw)-X(-P.fw)}" height="${Y(Math.min(140,yds*.35))-Y(yds-15)}" rx="14" fill="rgba(111,174,90,.2)"/>`;
  g += `<ellipse cx="${X(0)}" cy="${Y(yds)}" rx="${X(P.greenR)-X(0)}" ry="${Math.abs(Y(yds+P.greenR)-Y(yds))}" fill="rgba(159,208,124,.42)" stroke="#9fd07c"/>`;
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${Y(yds)}" y2="${Y(yds)-24}" stroke="#f1ead0" stroke-width="1.5"/><path d="M${X(0)} ${Y(yds)-24} l11 5 l-11 5z" fill="#e58a76"/>`;
  g += `<rect x="${X(-6)}" y="${Y(0)-3}" width="${X(6)-X(-6)}" height="8" rx="2" fill="#36503f"/>`;
  g += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(aimX)}" y2="${Y(cy)}" stroke="rgba(227,201,122,.5)" stroke-dasharray="4 4"/>`;
  const col = colorOf(m.key);
  g += `<ellipse cx="${X(cx)}" cy="${Y(cy)}" rx="${X(2*m.sideSd)-X(0)}" ry="${Math.abs(Y(cy+2*sdY)-Y(cy))}" fill="${alpha(col,.1)}" stroke="${alpha(col,.45)}" ${m.est?'stroke-dasharray="4 4"':""}/>`;
  g += `<ellipse cx="${X(cx)}" cy="${Y(cy)}" rx="${X(m.sideSd)-X(0)}" ry="${Math.abs(Y(cy+sdY)-Y(cy))}" fill="${alpha(col,.22)}" stroke="${alpha(col,.8)}" ${m.est?'stroke-dasharray="4 4"':""}/>`;
  (m.shots||[]).forEach(r=>{ const d = par===3 ? r.carry : r.total; g += `<circle cx="${X(r.side+aimX)}" cy="${Y(d)}" r="3.5" fill="#f1ead0" stroke="#101a14"><title>${nameOf(r.key)} #${r.n}: ${f(d,0)} yd, ${lr(r.side)}</title></circle>`; });
  g += `<circle cx="${X(aimX)}" cy="${Y(cy)}" r="4.5" fill="none" stroke="#e3c97a" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hole map with shot dispersion">${g}</svg>`;
}
function renderCourse(){

  const bag = courseBag(course);
  const plans = yards.map((y,i)=>plan(course, course.par[i], y, bag, null));

  $("tab-course").innerHTML = `
    <section class="card">

      </div>
      <p class="sub" style="margin:0 0 14px">${esc(course.location)} · ${esc(tee)} tees ${total.toLocaleString()} yd · par ${parT}. Under each hole: the suggested tee club.</p>
      ${n>9?`<div class="nine">Front nine</div>`:""}<div class="scorecard">${yards.slice(0,9).map((_,i)=>hb(i)).join("")}</div>
      ${n>9?`<div class="nine">Back nine</div><div class="scorecard">${yards.slice(9).map((_,i)=>hb(i+9)).join("")}</div>`:""}
      ${m ? `<div class="planner">
        <div><div class="map">${holeSVG(par, yds, P)}</div>
          <div class="legend"><span><i style="background:${alpha(colorOf(m.key),.6)}"></i>68% / 95% of shots</span>${m.shots?.length?`<span><i style="background:#f1ead0"></i>your shots</span>`:""}<span><i style="background:#e3c97a"></i>aim point</span></div>
          <p class="muted small" style="margin:6px 0 0">Width is exaggerated so the spread is easy to see.</p></div>
        <div>
          <div class="hole-title">Hole ${h+1}<small>par ${par} · ${yds} yd</small></div>
          <p class="muted small" style="margin:12px 0 8px">${par===3?"Club":"Tee club"} · ★ suggested</p>
          <div class="row-btns">${P.evals.slice().sort((a,b)=>b.m.carry-a.m.carry).map(e=>`<button class="btn sm" data-tc="${e.m.key}" aria-pressed="${e.m.key===m.key}">${sw(e.m.key)}${esc(e.m.short)}${e===P.best?" ★":""}</button>`).join("")}</div>
          <div class="facts">
            <div class="fact"><div class="l">${par===3?"Carry":"Lands (with roll)"}</div><div class="v">${f(c.land,0)} yd ${m.est?'<span class="tag">est</span>':""}</div></div>

            <div class="fact"><div class="l">${c.plabel}</div><div class="v">${Math.round(c.p*100)}%</div><div class="meter"><i style="width:${(c.p*100).toFixed(0)}%"></i></div></div>
            <div class="fact"><div class="l">Aim</div><div class="v">${Math.abs(m.side)<2?"Centre":`${f(Math.abs(m.side),0)} yd ${m.side>0?"left":"right"}`}</div></div>

          <button class="btn sm" id="aim" aria-pressed="${state.aim}">${state.aim?"✓ ":""}Aim to offset my curve</button>
          ${m.est?`<p class="muted small" style="margin:14px 0 0">The ${esc(m.label)} hasn't been measured yet, so its distance and spread are estimated.${m.caveat?" "+esc(m.caveat):""}</p>`:""}

  document.querySelectorAll("#tab-course [data-course]").forEach(b=>b.onclick=()=>{state.course=b.dataset.course;state.hole=0;state.teeClub=null;render();});

  draw("tPath",{type:"line",data:{labels:dates,datasets:[

    {label:"Goal",data:dates.map(()=>0),borderColor:"rgba(159,208,124,.6)",borderDash:[4,4],pointRadius:0}]},options:opts("Degrees")});
  const ks = [...new Set(list.flatMap(A=>A.keys.filter(k=>!A.clubs[k].partial)))].sort((x,y)=>loftOf(x)-loftOf(y));
  draw("tClub",{type:"line",data:{labels:dates,datasets:ks.map(k=>({label:nameOf(k),data:list.map(A=>A.clubs[k]&&!A.clubs[k].partial&&A.clubs[k][tm.k]!=null?+A.clubs[k][tm.k].toFixed(tm.dp):null),borderColor:colorOf(k),backgroundColor:colorOf(k),pointRadius:5,tension:.3}))},options:opts(tm.label+(tm.unit?` (${tm.unit})`:""))});
}

/* ================= BAG ================= */
function renderBag(){
  const L7 = clubModel("7i"), L6 = clubModel("6i"), LW = clubModel("7W");
  const card = (t, rows, sub) => `<div><b>${t}</b>${rows.map(([a,b])=>`<div class="r"><span>${a}</span><span>${b}</span></div>`).join("")}<div class="muted small" style="margin-top:6px">${sub}</div></div>`;
  const verdict = L6 && LW && L7 && !L6.est && !LW.est
    ? (L6.carry-L7.carry<6 ? `Measured: the 6-iron overlaps the 7-iron (${f(L6.carry-L7.carry)} yd). Keep the 7-wood and drop the 6-iron.` : `Measured gaps: 7i→6i ${f(L6.carry-L7.carry)} yd, 6i→7W ${f(LW.carry-L6.carry)} yd.`)
    : "The 6-iron and 7-wood are estimated from your 7-iron until you hit them. If the 6-iron lands within 6 yd of the 7-iron, keep the 7-wood and drop the 6-iron.";
  const setRows = set => set.clubs.map(c=>{ const k=c.key||c.equiv, m=k?clubModel(k):null;
    return `<tr><td><span class="cn">${k&&COLORS[k]?sw(k):""}${esc(c.label)}</span>${m?.est?'<span class="tag">est</span>':""}${m?.caveat?'<span class="tag warn">⚑</span>':""}</td><td class="tl muted">${esc(c.model||(c.equiv&&CLUB[c.equiv]?"≈ "+nameOf(c.equiv):""))}</td><td>${c.loft!=null?c.loft+"°":"—"}</td><td>${m?f(m.carry,0):"—"}</td><td>${m?f(m.total,0):"—"}</td><td>${m?"±"+f(m.sideSd,0):"—"}</td></tr>`; }).join("");
  $("tab-bag").innerHTML = `
    <section class="card"><div class="head"><h2>6-iron vs. 7-wood</h2></div><p class="sub" style="margin:0 0 14px">${verdict}</p>
      <div class="proj">${[["7 Iron",L7],["6 Iron",L6],["7 Wood",LW]].map(([t,m])=>m?card(t,[["Carry",f(m.carry,0)+" yd"],["Total",f(m.total,0)+" yd"],["Wide (68%)","±"+f(m.sideSd,0)+" yd"]],m.est?"estimated":"measured in "+(m.date||"")):"").join("")}</div></section>
    ${DATA.bag.sets.map(set=>`<section class="card"><div class="head"><h2>${esc(set.name)}</h2></div>
      <div class="tablewrap"><table><thead><tr><th>Club</th><th class="tl">Model</th><th>Loft</th><th>${tip("carry","Carry")}</th><th>${tip("total","Total")}</th><th>Wide</th></tr></thead><tbody>${setRows(set)}</tbody></table></div>
      <p class="muted small" style="margin:10px 0 0">"est" = not hit yet, estimated from your 7-iron (or AW for wedges). Wide = left/right spread covering 68% of shots.</p></section>`).join("")}`;
}

/* ================= DRILLS ================= */
const ytWatch = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
function renderDrills(){
  const D = DATA.drills||{}, done = store.get("golf-plan-v1",{}), plan = D.plan||[];
  const tot = plan.reduce((n,l)=>n+l.tasks.length,0), dn = Object.values(done).filter(Boolean).length;
  $("tab-drills").innerHTML = `
    <section class="card"><div class="head"><h2>Practice plan</h2><span class="muted small">${dn}/${tot} done · saved in this browser</span></div>
      <div class="levels">${plan.map(l=>`<div class="lvl"><div class="t">LEVEL ${l.level}</div><div class="nm">${esc(l.name)}</div>${l.tasks.map((t,j)=>`<label class="task"><input type="checkbox" data-task="${l.level}:${j}" ${done[`${l.level}:${j}`]?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`).join("")}</div></section>
    ${(D.drills||[]).map(d=>`<section class="card drill">
      <div><div class="lv">Level ${d.level} · ${d.fixes.map(esc).join(", ")}</div><h3>${esc(d.title)}</h3><p class="muted" style="margin:0">${esc(d.why)}</p>
        <ol>${d.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="tgt"><b>Target:</b> ${esc(d.target)}</div>
        <div class="muted small">Source: <a href="${esc(d.source.url)}" target="_blank" rel="noopener">${esc(d.source.name)}</a></div></div>
      <div>${d.videos.slice(0,1).map(v=>`<button class="yt" data-yt="${esc(v.id)}" data-title="${esc(v.title)}" style="background-image:url('https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg')" aria-label="Play ${esc(v.title)}"></button><div class="yt-cap"><span>${esc(v.title)}</span><a href="${ytWatch(v.id)}" target="_blank" rel="noopener">YouTube ↗</a></div>`).join("")}
        ${d.videos.slice(1).map(v=>`<div class="muted small">Also: <a href="${ytWatch(v.id)}" target="_blank" rel="noopener">${esc(v.title)} ↗</a></div>`).join("")}</div>
    </section>`).join("")}
    ${(D.resources||[]).length?`<section class="card"><div class="head"><h2>Resources</h2></div><div class="resources">${D.resources.map(r=>`<a class="res" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.name)} ↗</b>${esc(r.desc)}</a>`).join("")}</div></section>`:""}`;
  document.querySelectorAll("#tab-drills input[data-task]").forEach(cb=>cb.onchange=()=>{const d=store.get("golf-plan-v1",{});d[cb.dataset.task]=cb.checked;store.set("golf-plan-v1",d);renderDrills();});
  document.querySelectorAll("#tab-drills .yt").forEach(b=>b.onclick=()=>{ const id=b.dataset.yt;
    if (location.protocol==="file:") { window.open(ytWatch(id),"_blank","noopener"); return; }
    b.outerHTML=`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(b.dataset.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`; });
}

/* ================= SHOT VIEWER ================= */
const V = {i:0,key:null,n:null,frame:0,timer:null,speed:1}, vEl = $("viewer");
const sessionShots = i => ALL[i].keys.flatMap(k=>ALL[i].clubs[k].shots);
const curShot = () => ALL[V.i].clubs[V.key]?.shots.find(r=>r.n===V.n);
function openShot(i,key,n){ V.i=i;V.key=key;V.n=n;V.frame=0;stopPlay();renderViewer();vEl.hidden=false;document.body.style.overflow="hidden";startPlay(); }
function closeShot(){ stopPlay(); vEl.hidden=true; document.body.style.overflow=""; }
function stepShot(d){ const L=sessionShots(V.i), j=L.findIndex(r=>r.key===V.key&&r.n===V.n), r=L[j+d]; if(r){const p=!!V.timer;stopPlay();V.key=r.key;V.n=r.n;V.frame=0;renderViewer();if(p)startPlay();} }
function setFrame(fi){ const fr=curShot()?.img?.frames||[]; if(!fr.length) return; V.frame=(fi+fr.length)%fr.length;
  $("vf").src=fr[V.frame]; $("vr").value=V.frame; $("vfc").textContent=`${V.frame+1}/${fr.length}`;
  document.querySelectorAll("#vstrip img").forEach((im,j)=>im.classList.toggle("on",j===V.frame)); document.querySelector("#vstrip img.on")?.scrollIntoView({block:"nearest",inline:"nearest"}); }
function startPlay(){ const fr=curShot()?.img?.frames||[]; if(fr.length<2) return; stopPlay(); V.timer=setInterval(()=>setFrame(V.frame+1),110/V.speed); $("vplay")&&($("vplay").textContent="Pause"); }
function stopPlay(){ if(V.timer){clearInterval(V.timer);V.timer=null;} $("vplay")&&($("vplay").textContent="Play"); }
function renderViewer(){
  const A=ALL[V.i], r=curShot(); if(!r) return;
  const L=sessionShots(V.i), j=L.findIndex(x=>x.key===V.key&&x.n===V.n), fr=r.img?.frames||[];
  fr.forEach(src=>{const im=new Image();im.src=src;});
  const pb=BENCH.pga[V.key], st=(l,k,v,b)=>`<div class="vstat"><div class="l">${tip(k,l)}</div><div class="v">${v}</div>${b?`<div class="b">${b}</div>`:""}</div>`;
  const tb = k => pb?.[k]!=null ? `PGA ${fm(MET[k],pb[k])}` : "";
  vEl.innerHTML=`<div class="vbox" role="dialog" aria-modal="true" aria-label="Shot viewer">
    <div class="head"><div><h2>${esc(CLUB[V.key]?.label||nameOf(V.key))} · shot ${r.n}</h2><p class="sub">${sName(V.i)} · ${sDate(A)} · ${j+1} of ${L.length}${r.suspect?' · <span class="warn">possible sensor misread</span>':""}</p></div>
      <div class="row-btns"><button class="btn sm" id="vprev" ${j<=0?"disabled":""}>‹ Prev</button><button class="btn sm" id="vnext" ${j>=L.length-1?"disabled":""}>Next ›</button><button class="btn icon" id="vclose" aria-label="Close">✕</button></div></div>
    <div class="vgrid">
      <div><div class="frame">${r.img?.impact?`<img src="${esc(r.img.impact)}" alt="Ball at impact">`:""}<span class="cap">Impact</span></div></div>
      <div><div class="frame">${fr.length?`<img id="vf" src="${esc(fr[0])}" alt="Top-view frame">`:""}<span class="cap">Top view</span></div>
        ${fr.length?`<div class="player"><button class="btn sm" id="vplay">Play</button><button class="btn icon" id="vfb" aria-label="Previous frame">‹</button><button class="btn icon" id="vff" aria-label="Next frame">›</button>
          <input type="range" id="vr" min="0" max="${fr.length-1}" value="0" aria-label="Frame"><span class="num muted small" id="vfc">1/${fr.length}</span>
          <select id="vspeed" aria-label="Speed">${[[.25,"¼×"],[.5,"½×"],[1,"1×"],[2,"2×"]].map(([v,l])=>`<option value="${v}" ${v===V.speed?"selected":""}>${l}</option>`).join("")}</select></div>
        <div class="strip" id="vstrip">${fr.map((s,k)=>`<img src="${esc(s)}" alt="" data-f="${k}" loading="lazy">`).join("")}</div>`:""}</div>
    </div>
    <div class="vstats">${st("Carry","carry",f(r.carry)+" yd",tb("carry"))}${st("Finish","side",lr(r.side,1))}${st("Ball speed","ball",f(r.ballSpeed)+" mph",tb("ball"))}${st("Club speed","club",f(r.clubSpeed)+" mph",tb("club"))}${st("Smash","smash",f(r.smash,2),tb("smash"))}${st("Launch","launch",f(r.launch)+"°",tb("launch"))}${st("Spin","spin",r.backSpin==null?"—":Math.round(r.backSpin).toLocaleString(),tb("spin"))}${st("Path","path",sg(r.path)+"°","Tour ≈ 0")}${st("Face-to-path","f2p",sg(r.f2p)+"°","goal ±3")}</div>
  </div>`;
  $("vclose").onclick=closeShot; $("vprev").onclick=()=>stepShot(-1); $("vnext").onclick=()=>stepShot(1);
  if(fr.length){ $("vplay").onclick=()=>V.timer?stopPlay():startPlay(); $("vfb").onclick=()=>{stopPlay();setFrame(V.frame-1);}; $("vff").onclick=()=>{stopPlay();setFrame(V.frame+1);};
    $("vr").oninput=e=>{stopPlay();setFrame(+e.target.value);}; $("vspeed").onchange=e=>{V.speed=+e.target.value;if(V.timer)startPlay();};
    document.querySelectorAll("#vstrip img").forEach(im=>im.onclick=()=>{stopPlay();setFrame(+im.dataset.f);}); setFrame(V.frame); }
}
vEl.addEventListener("click",e=>{if(e.target===vEl)closeShot();});
document.addEventListener("keydown",e=>{ if(vEl.hidden) return;
  if(e.key==="Escape")closeShot(); else if(e.key==="ArrowRight"){e.preventDefault();stopPlay();setFrame(V.frame+1);} else if(e.key==="ArrowLeft"){e.preventDefault();stopPlay();setFrame(V.frame-1);}
  else if(e.key==="ArrowDown"){e.preventDefault();stepShot(1);} else if(e.key==="ArrowUp"){e.preventDefault();stepShot(-1);} else if(e.key===" "){e.preventDefault();V.timer?stopPlay():startPlay();} });

/* ================= OVERVIEW (all sessions) ================= */
function renderOverview(){
  const balls = A => A.keys.reduce((n,k)=>n+A.clubs[k].n,0);
  const total = ALL.reduce((n,A)=>n+balls(A),0);
  const measured = new Set(ALL.flatMap(A=>A.keys.filter(k=>!A.clubs[k].partial)));
  const bagN = MAIN.filter(c=>c.key!=="Putter").length;
  const curated = ALL.some(A=>A.meta.curated);
  const A = ALL[state.i];
  $("overview").innerHTML = `
    <div class="ov"><div class="l">Sessions</div><div class="v">${ALL.length}</div><div class="c">${sDate(ALL[0])}${ALL.length>1?" → "+sDate(ALL[ALL.length-1]):""}</div></div>
    <div class="ov"><div class="l">Balls hit</div><div class="v">${total.toLocaleString()}</div><div class="c">${curated?"recorded (mishits removed)":"all sessions"}</div></div>
    <div class="ov"><div class="l">Clubs measured</div><div class="v">${measured.size} / ${bagN}</div><div class="c">${bagN-measured.size} still estimated</div></div>
    <div class="ov now"><div class="l">Viewing ${sName(state.i)}</div><div class="v">${balls(A)} balls</div><div class="c">${sDate(A)} · ${A.keys.length} clubs</div></div>`;
}

/* ================= wiring ================= */
const sel = $("date");
sel.innerHTML = ALL.map((A,i)=>`<option value="${i}">${sName(i)} · ${sDate(A)}</option>`).reverse().join("");
const TABS = {session:renderSession, course:renderCourse, trend:renderTrend, bag:renderBag, drills:renderDrills};
function render(){
  if (!ALL.length) return;
  sel.value = state.i; $("prev").disabled = state.i<=0; $("next").disabled = state.i>=ALL.length-1;
  document.querySelectorAll("main").forEach(m=>m.hidden = m.id!=="tab-"+state.tab);
  document.querySelectorAll(".tabs .btn").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  TABS[state.tab]();
  history.replaceState(null,"",`#s${state.i+1}/${state.tab}`);
  renderOverview();
}
const [hd,ht] = location.hash.slice(1).split("/"), hn = /^s(\d+)$/.exec(hd||""), hi = hn ? +hn[1]-1 : ALL.findIndex(A=>A.s.date===hd);
if (hi>=0 && hi<ALL.length) state.i = hi; if (TABS[ht]) state.tab = ht;
sel.onchange = () => { state.i=+sel.value; render(); };
$("prev").onclick = () => { state.i--; render(); }; $("next").onclick = () => { state.i++; render(); };
document.querySelectorAll(".tabs .btn").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();scrollTo({top:0});});
const tipEl = $("tip");
document.addEventListener("mouseover",e=>{const t=e.target.closest("[data-tip]");if(!t){tipEl.hidden=true;return;}tipEl.textContent=t.dataset.tip;tipEl.hidden=false;const r=t.getBoundingClientRect();
  tipEl.style.left=Math.min(innerWidth-tipEl.offsetWidth-8,Math.max(8,r.left))+"px";tipEl.style.top=(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8)+"px";});
addEventListener("scroll",()=>tipEl.hidden=true,{passive:true});
$("foot").textContent = `Built ${DATA.built} · Benchmarks: TrackMan Tour averages, Shot Scope 25-handicap`;
if (ALL.length) render(); else $("tab-session").innerHTML = `<section class="card empty">No sessions yet.</section>`;
</script>
</body>
