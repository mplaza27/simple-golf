<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Sim Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#1a1a2e; --panel:#16213e; --panel2:#1a2a50; --panel3:#213463; --line:#0f3460;
    --ink:#e6e2da; --ink2:#d4d0c8; --muted:#a3a0ae; --faint:#6b6f8e; --shadow:rgba(0,0,0,.3);
    --gold:#e8b84b; --accent:#e8b84b; --pink:#b03a3a; --yellow:#e8b84b; --orange:#d9893a; --blue:#5b8fd9;
    --hcp:#d9893a; --lpga:#b08cf0; --pga:#5b8fd9;
    --bad:#e0605e; --warn:#e8b84b; --good:#6fc27a; --info:#5b8fd9; --dark:#1a1a2e;
    --pixel:"Press Start 2P",ui-monospace,Menlo,monospace;
    --crt:"Press Start 2P",ui-monospace,Menlo,monospace;
    --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:3px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;background:var(--bg);image-rendering:pixelated}
  body.crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px)}
  button{font:inherit;color:inherit}
  a{color:var(--accent)}
  .page{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:0 64px}

  /* ---- arcade buttons (shared) ---- */
  .btn,.chip,.toggle,.iconbtn,.nav button,.seg button,.datepick button,.yt-link,.res{
    border:2px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink2);
    box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .06s, box-shadow .06s, background .15s, color .15s;
    font-weight:700;-webkit-tap-highlight-color:transparent}
  .btn:hover,.chip:hover,.toggle:hover,.iconbtn:hover,.nav button:hover,.seg button:hover,.datepick button:hover:not(:disabled),.yt-link:hover,.res:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);background:var(--panel2);border-color:var(--gold);color:var(--gold)}
  .btn:active,.chip:active,.toggle:active,.iconbtn:active,.nav button:active,.seg button:active,.datepick button:active,.yt-link:active,.res:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(22,33,62,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line);margin:0 -20px 24px;padding:12px 20px;box-shadow:0 4px 0 var(--bg),0 6px 0 var(--line)}
  .top-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:14px;letter-spacing:.02em;line-height:1.3}
  .brand .logo{font-size:22px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
  .brand b{color:var(--gold)}
  .brand small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-top:4px;font-weight:500}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button{font-family:var(--pixel);font-size:10px;padding:10px 12px;letter-spacing:.04em;text-transform:uppercase}
  .nav button[aria-selected="true"]{background:var(--gold);color:var(--dark);border-color:var(--gold)}
  .datepick{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
  .datepick select{min-width:0;flex:1 1 auto;max-width:calc(100vw - 140px)}
  .datepick button{width:38px;height:38px;font-size:18px}
  .datepick button:disabled{opacity:.3;cursor:default;box-shadow:1px 1px 0 var(--shadow)}
  select{background:var(--panel);color:var(--gold);border:2px solid var(--line);border-radius:var(--r);padding:6px 10px;font:10px/1.4 var(--pixel);height:38px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
  .switches{display:flex;gap:6px}
  .switches .toggle{font-family:var(--pixel);font-size:9px;padding:2px 10px;height:34px}
  .switches .toggle[aria-pressed="true"]{background:var(--gold);color:var(--dark);border-color:var(--gold)}

  /* type */
  h2{font-family:var(--pixel);font-size:13px;line-height:1.5;margin:0;letter-spacing:.02em;text-transform:uppercase}
  .sec{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 6px}
  .lede{color:var(--muted);font-size:14.5px;margin:6px 0 16px;max-width:78ch}
  .muted{color:var(--muted)} .small{font-size:13.5px}
  .bad{color:var(--bad)} .warn{color:var(--warn)} .good{color:var(--good)} .info{color:var(--info)}

  /* layout */
  .stack{display:grid;gap:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--line)}
  .chart{position:relative;height:320px}
  .chart.tall{height:360px}

  /* banner */
  .banner{display:flex;gap:12px;align-items:flex-start;background:repeating-linear-gradient(-45deg, rgba(255,210,63,.10) 0 12px, rgba(255,210,63,.04) 12px 24px);border:2px dashed var(--yellow);border-radius:var(--r);padding:12px 16px;font-size:14.5px}
  .banner b{color:var(--yellow);font-family:var(--pixel);font-size:10px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:4px}
  .banner .ic{font-size:20px;line-height:1.2}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .kpi{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--line)}
  .kpi.bad{border-color:var(--bad)} .kpi.warn{border-color:var(--warn)} .kpi.good{border-color:var(--good)}
  .kpi .l{color:var(--muted);font-family:var(--pixel);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding-right:44px;line-height:1.6}
  .kpi .v{font-family:var(--pixel);font-size:24px;line-height:1.2;margin:12px 0 6px}
  .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--good)}
  .kpi .c{font-size:14px;color:var(--ink2)}
  .kpi .t{font-size:12.5px;color:var(--faint);margin-top:2px}
  .grade{position:absolute;top:10px;right:10px;width:38px;height:38px;display:grid;place-items:center;font-family:var(--pixel);font-size:16px;border:2px solid currentColor;border-radius:3px;box-shadow:3px 3px 0 var(--shadow);background:var(--bg)}
  .grade.gA{color:var(--good)} .grade.gB{color:#9fd36a} .grade.gC{color:var(--yellow)} .grade.gD{color:var(--orange)} .grade.gF{color:var(--bad)}

  /* takeaways */
  .takeaways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .take{background:var(--panel2);border-radius:var(--r);padding:16px;border:2px solid var(--line);border-left:6px solid var(--faint)}
  .take.bad{border-left-color:var(--bad)} .take.warn{border-left-color:var(--warn)} .take.info{border-left-color:var(--info)} .take.good{border-left-color:var(--good)}
  .take .n{font-family:var(--pixel);font-size:10px;color:var(--muted)}
  .take h3{font-size:17px;margin:8px 0 6px;line-height:1.3}
  .take p{margin:0;color:var(--ink2);font-size:14.5px}
  details{margin-top:16px}
  summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding:8px 12px;border:2px solid var(--accent);border-radius:var(--r);box-shadow:3px 3px 0 var(--shadow);transition:transform .06s,box-shadow .06s}
  summary:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▶";font-size:9px;transition:transform .15s} details[open] > summary::before{transform:rotate(90deg)}
  .findings{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  .findings li{display:grid;grid-template-columns:12px 1fr;gap:12px;background:var(--panel2);border-radius:var(--r);padding:10px 14px;font-size:14.5px;color:var(--ink2)}
  .findings b{color:var(--ink)}
  .dot{width:10px;height:10px;margin-top:7px;background:var(--faint)}
  .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.info{background:var(--info)}
  .notes{font-size:14.5px;color:var(--ink2);margin-top:10px}
  .notes h3,.notes h4,.notes h5{color:var(--yellow);font-family:var(--pixel);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
  .notes ul{padding-left:20px;margin:4px 0} .notes li{margin:4px 0} .notes p{margin:6px 0} .notes strong{color:var(--ink)}
  code{background:var(--panel3);padding:1px 6px;border-radius:4px;font-size:13px;color:var(--ink)}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;font-size:15px}
  .chip[aria-pressed="true"]{background:var(--gold);color:var(--dark);border-color:var(--gold)}
  .chip[aria-pressed="true"] .sub,.chip[aria-pressed="true"] .flag{color:var(--dark)}
  .chip .sw{width:12px;height:12px;border:2px solid rgba(0,0,0,.5)}
  .chip .flag{color:var(--warn);font-size:13px}
  .chip .sub{color:var(--muted);font-weight:500;font-family:var(--pixel);font-size:9px;line-height:1}
  .mchip{font-size:13.5px;padding:6px 11px}
  

  /* club detail */
  .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:22px}
  .detail-head{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;margin-bottom:14px}
  .big{font-family:var(--pixel);font-size:38px;line-height:1;color:var(--gold);text-shadow:3px 3px 0 rgba(0,0,0,.35)}
  .big small{font-size:12px;color:var(--muted);margin-left:4px;text-shadow:none}
  .stat .l{color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-family:var(--pixel);font-size:14px;line-height:1.4}
  .caveat{background:rgba(255,210,63,.08);border:2px dashed var(--yellow);color:var(--ink2);border-radius:var(--r);padding:8px 12px;font-size:14px;margin-bottom:14px}
  .caveat b{color:var(--yellow)}
  .bars{display:grid;gap:10px;margin:6px 0 4px}
  .bar{display:grid;grid-template-columns:70px 1fr 92px;gap:10px;align-items:center;font-size:14px;font-weight:600}
  .bar .track{height:16px;background:var(--panel3);border:2px solid var(--line);overflow:hidden}
  .bar .fill{height:100%;background-image:repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.25) 10px 12px)!important;background-blend-mode:multiply}
  .bar .num{text-align:right;font-family:var(--pixel);font-size:10px;line-height:1.3;color:var(--ink)}

  /* tables */
  .tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  table{border-collapse:collapse;width:100%;font-size:14.5px}
  th,td{padding:9px 12px;text-align:right;border-bottom:2px solid var(--line);white-space:nowrap}
  td{font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
  td:first-child,td.tl,.notesrow td{font-family:var(--sans);font-size:14.5px}
  th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;user-select:none}
  th.sortable{cursor:pointer} th.sortable:hover{color:var(--yellow)}
  th .arr{color:var(--yellow);margin-left:3px}
  th:first-child,td:first-child,.tl{text-align:left}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover td:first-child{color:var(--accent)}
  tbody tr.sel{background:var(--panel3);box-shadow:inset 4px 0 0 var(--accent)}
  .tag{display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:700;padding:1px 7px;border:1px solid var(--faint);border-radius:3px;color:var(--muted);margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.03em}
  .tag.warn{border-color:var(--yellow);color:var(--yellow)}
  .toggle{padding:6px 12px;font-size:13.5px}
  .toggle[aria-pressed="true"]{background:var(--gold);color:var(--dark);border-color:var(--gold)}
  .cn{display:inline-flex;align-items:center;gap:8px;font-weight:700}
  .cn .sw,.sw{width:11px;height:11px;display:inline-block;border:2px solid rgba(0,0,0,.5)}

  /* tooltips */
  [data-tip]{text-decoration:underline dotted var(--faint);text-underline-offset:3px;cursor:help}
  #tip{position:fixed;z-index:200;max-width:290px;background:#000;color:var(--ink);border:2px solid var(--gold);border-radius:3px;padding:8px 10px;font-size:13px;line-height:1.45;pointer-events:none;box-shadow:3px 3px 0 var(--shadow);text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:500}

  /* segmented */
  .seg{display:inline-flex;gap:8px;flex-wrap:wrap}
  .seg button{font-size:13.5px;padding:6px 12px}
  .seg button[aria-pressed="true"]{background:var(--gold);color:var(--dark);border-color:var(--dark)}

  /* holes */
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .hole{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s,border-color .15s}
  .hole:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);border-color:var(--blue)}
  .hole:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
  .hole[aria-expanded="true"]{border-color:var(--yellow)}
  .hole .hh{display:flex;justify-content:space-between;align-items:baseline}
  .hole .no{font-family:var(--pixel);font-size:10px;color:var(--muted)}
  .hole .yd{font-family:var(--pixel);font-size:20px;line-height:1.1;color:var(--gold)}
  .hole .yd small{font-size:9px;color:var(--muted);margin-left:3px}
  .hole .club{font-size:21px;font-weight:800}
  .hole .eq{color:var(--muted);font-size:13.5px;font-weight:500;margin-left:6px}
  .hole .meter{position:relative;height:12px;background:var(--panel3);border:2px solid var(--line)}
  .hole .meter .f{position:absolute;inset:0 auto 0 0}
  .hole .meter .pin{position:absolute;top:-7px;width:3px;height:22px;background:var(--ink)}
  .hole .meter .pin::after{content:"";position:absolute;left:3px;top:0;border-left:9px solid #d04040;border-top:5px solid transparent;border-bottom:5px solid transparent}
  .hole .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink2);flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:3px 9px;border:2px solid currentColor;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
  .pill.warn{color:var(--warn)} .pill.good{color:var(--good)} .pill.bad{color:var(--bad)}
  .hole .more{font-size:14px;color:var(--ink2);border-top:2px dashed var(--line);padding-top:8px}
  .ylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .ycard{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .ycard b{display:block;font-size:15px}
  .ycard .v{font-family:var(--pixel);font-size:18px;line-height:1.4;color:var(--gold)}
  .proj{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .proj > div{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .proj b{display:block;font-size:15px;margin-bottom:6px}
  .row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14.5px;padding:2px 0;align-items:baseline}
  .row span:last-child{color:var(--ink);font-family:var(--pixel);font-size:10px;line-height:1.5}
  .row span.bad{color:var(--bad)} .row span.warn{color:var(--warn)} .row span.good{color:var(--good)}
  .empty{color:var(--muted);font-style:italic}
  footer{color:var(--faint);margin-top:30px;font-family:var(--pixel);font-size:8px;line-height:1.8}
  img.thumb{width:36px;height:38px;object-fit:cover;border:2px solid var(--line);display:block;background:#000}
  table.shots td,table.shots th{padding:6px 9px}

  /* shot viewer */
  .viewer{position:fixed;inset:0;z-index:150;background:rgba(8,5,14,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
  .vbox{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);width:min(1100px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold)}
  .vhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .vhead h2{font-size:12px}
  .vbtns{display:flex;gap:8px}
  .iconbtn{min-width:38px;height:38px;padding:0 12px;font-size:14px}
  .iconbtn:disabled{opacity:.3;cursor:default}
  #vplay{background:var(--gold);color:var(--dark);border-color:var(--gold);min-width:96px}
  .vgrid{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:16px}
  .frame{background:#000;border:3px solid var(--line);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
  .frame img{width:100%;height:auto;display:block}
  .frame .cap{position:absolute;left:8px;top:8px;font-family:var(--pixel);font-size:9px;color:#fff;background:rgba(0,0,0,.7);padding:4px 7px;border:1px solid var(--accent)}
  .player{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .player input[type=range]{flex:1;min-width:140px;accent-color:var(--gold);height:24px}
  .player .fc{font-family:var(--pixel);font-size:10px;color:var(--muted);min-width:64px;text-align:right}
  .player select{font-size:10px}
  .strip{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:6px}
  .strip img{height:44px;opacity:.45;cursor:pointer;border:2px solid transparent;flex:none}
  .strip img:hover{opacity:.8}
  .strip img.on{opacity:1;border-color:var(--gold)}
  .vstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin-top:16px}
  .vstat{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:8px 12px}
  .vstat .l{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .vstat .v{font-family:var(--pixel);font-size:13px;line-height:1.6}
  .vstat .b{font-size:12px;color:var(--faint)}

  /* drills */
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .lvl{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:14px}
  .lvl.done{border-color:var(--gold)}
  .lvl h3{margin:0 0 4px;font-family:var(--pixel);font-size:10px;color:var(--yellow);text-transform:uppercase;letter-spacing:.04em;line-height:1.6}
  .lvl .nm{font-weight:800;font-size:15px;margin-bottom:8px}
  .xp{height:12px;border:2px solid var(--line);background:var(--panel3);margin:6px 0 10px}
  .xp > i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#b98d2e 8px 10px);transition:width .3s}
  .task{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer;color:var(--ink2)}
  .task input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:2px solid var(--line);background:var(--panel);margin:1px 0 0;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center}
  .task input:checked{background:var(--gold);border-color:var(--gold)}
  .task input:checked::after{content:"✓";color:var(--dark);font-weight:900;font-size:13px}
  .task input:checked + span{text-decoration:line-through;color:var(--muted)}
  .drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;border-top:6px solid var(--dc,var(--accent))}
  .drill .lv{font-family:var(--pixel);font-size:9px;color:var(--dc,var(--accent));letter-spacing:.04em;text-transform:uppercase}
  .drill h3{font-size:22px;margin:6px 0 6px;line-height:1.2}
  .drill .fx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .drill ol{padding-left:22px;margin:8px 0;color:var(--ink2)} .drill ol li{margin:5px 0}
  .drill .tgt{background:var(--panel2);border-left:4px solid var(--dc,var(--accent));padding:8px 12px;font-size:14px;margin:10px 0}
  .drill .src{font-size:13.5px;color:var(--muted)}
  .vids{display:grid;gap:12px}
  .yt{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:2px solid var(--line);border-radius:var(--r);background:#000 center/cover no-repeat;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);overflow:hidden;padding:0;transition:transform .08s,box-shadow .08s}
  .yt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
  .yt::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.85))}
  .yt .play{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:72px;height:52px;background:var(--pink);border:2px solid var(--gold);border-radius:3px;display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 5px 0 var(--dark)}
  .yt:hover .play{background:#c84242}
  .yt .ttl{position:absolute;left:12px;right:12px;bottom:10px;text-align:left;font-weight:700;font-size:14.5px;color:#fff;text-shadow:1px 1px 0 #000}
  .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vidrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .yt-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;padding:5px 10px}
  .yt-link.red{background:var(--bad);color:#fff;border-color:var(--dark)}
  .resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .res{display:block;text-decoration:none;padding:14px 16px;color:var(--ink);font-weight:500}
  .res b{display:block;font-size:16px;color:var(--accent);margin-bottom:4px}
  .res span{font-size:14px;color:var(--ink2)}
  .res::after{content:"↗";float:right;margin-top:-26px;color:var(--yellow)}

  @media (max-width:900px){
    .kpis,.levels{grid-template-columns:1fr 1fr}
    .takeaways,.grid2,.proj,.drill,.detail-grid,.vgrid{grid-template-columns:1fr}
    .holes{grid-template-columns:1fr 1fr}
    .chart{height:280px}
  }
  @media (max-width:560px){
    .holes,.levels{grid-template-columns:1fr}
    .kpi .v{font-size:20px}
    .bar{grid-template-columns:56px 1fr 82px}
    .nav button{font-size:9px;padding:9px 9px}
    .brand{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><div class="top-in">
    <div class="brand"><span class="logo">⛳</span><div>GOLF <b>SIM</b><small>Uneekor sessions · shot by shot</small></div></div>
    <div class="datepick">
      <button id="prev" aria-label="Previous session">‹</button>
      <select id="date" aria-label="Session date"></select>
      <button id="next" aria-label="Next session">›</button>
    </div>
    <nav class="nav" role="tablist">
      <button role="tab" data-tab="session">Session</button>
      <button role="tab" data-tab="trend">Progress</button>
      <button role="tab" data-tab="bag">Bag</button>
      <button role="tab" data-tab="course">Course</button>
      <button role="tab" data-tab="drills">Drills</button>
    </nav>
    <div class="switches">
      <button class="toggle" id="sfx" aria-pressed="false" title="Arcade sound effects">♪ SFX</button>
      <button class="toggle" id="crt" aria-pressed="false" title="CRT scanlines">▤ CRT</button>
    </div>
  </div></div>

  <main id="tab-session" class="stack"></main>
  <main id="tab-trend" class="stack" hidden></main>
  <main id="tab-bag" class="stack" hidden></main>
  <main id="tab-course" class="stack" hidden></main>
  <main id="tab-drills" class="stack" hidden></main>
  <footer id="foot"></footer>
</div>
<div id="tip" hidden></div>
<div id="viewer" class="viewer" hidden></div>

<script>
const DATA = __DATA__;

/* ---------- reference data ---------- */
// TrackMan tour averages (legacy published table; 2023 update: PGA 7i 176 yd / 92 mph / 123 mph ball / 1.34).
// club/ball mph · launch & descent (land angle) ° · spin rpm · apex (max height) yd · carry yd.
const T = (club,ball,smash,launch,spin,apex,descent,carry) => ({club,ball,smash,launch,spin,apex,descent,carry});
const BENCH = {
  pga: {Dr:T(113,167,1.48,10.9,2686,32,38,275), "3W":T(107,158,1.48,9.2,3655,30,43,243), "3H":T(100,146,1.46,10.2,4437,29,47,225),
        "6i":T(92,127,1.38,14.1,6231,30,50,183), "7i":T(90,120,1.33,16.3,7097,32,50,172), "8i":T(87,115,1.32,18.1,7998,31,50,160),
        "9i":T(85,109,1.28,20.4,8647,30,51,148), PW:T(83,102,1.23,24.2,9304,29,52,136)},
  lpga:{Dr:T(94,140,1.48,13.2,2611,25,37,218), "3W":T(90,132,1.47,11.2,2704,23,39,195), "7W":T(85,123,1.45,12.7,4693,25,46,174),
        "6i":T(78,109,1.40,17.1,5943,25,46,152), "7i":T(76,104,1.37,19.0,6699,26,47,141), "8i":T(74,100,1.35,20.8,7494,25,47,130),
        "9i":T(72,93,1.29,23.9,7589,26,47,119), PW:T(70,86,1.23,25.6,8403,23,48,107)},
  hcp25:{"6i":{carry:137},"7i":{carry:132},"8i":{carry:122},"9i":{carry:108}},
};
// Metrics you can focus on. `k` = club-average field (from analyze), `shot` = per-shot field, zero = Tour target is ~0.
const METRICS = [
  {k:"carry",   label:"Carry",        unit:"yd",  shot:"carry",     dp:1},
  {k:"total",   label:"Total",        unit:"yd",  shot:"total",     dp:1},
  {k:"ball",    label:"Ball speed",   unit:"mph", shot:"ballSpeed", dp:1},
  {k:"club",    label:"Club speed",   unit:"mph", shot:"clubSpeed", dp:1},
  {k:"smash",   label:"Smash",        unit:"",    shot:"smash",     dp:2},
  {k:"launch",  label:"Launch",       unit:"°",   shot:"launch",    dp:1},
  {k:"spin",    label:"Back spin",    unit:"rpm", shot:"backSpin",  dp:0},
  {k:"apex",    label:"Apex",         unit:"yd",  shot:"apex",      dp:1},
  {k:"descent", label:"Land angle",   unit:"°",   shot:"descent",   dp:1},
  {k:"path",    label:"Club path",    unit:"°",   shot:"path",      dp:1, zero:true},
  {k:"f2p",     label:"Face-to-path", unit:"°",   shot:"f2p",       dp:1, zero:true},
  {k:"side",    label:"Finish L/R",   unit:"yd",  shot:"side",      dp:1, zero:true},
];
const MET = Object.fromEntries(METRICS.map(m=>[m.k,m]));
const fm = (m, v) => v==null ? "—" : (m.zero ? sg(v, m.dp) : m.k==="spin" ? Math.round(v).toLocaleString() : v.toFixed(m.dp)) + (m.unit && m.unit!=="°" ? " "+m.unit : m.unit);
const GLOSS = {
  carry:"Distance the ball flies in the air before it lands.",
  total:"Carry plus roll after landing.",
  roll:"How far the ball rolled after landing (total − carry).",
  spread:"Carry consistency: about two-thirds of your shots land within ± this many yards of your average.",
  smash:"Ball speed ÷ club speed, i.e. how centred the strike was. Irons: 1.30+ is good. Low numbers usually mean heel, toe or thin contact.",
  path:"Direction the club head travels through impact. Negative = out-to-in (the slice path). Tour players sit around 0 ± 2°.",
  face:"Where the clubface points at impact, relative to the target.",
  f2p:"Face-to-path = face − path. Positive = the face is open to the path, so the ball curves right (fade/slice). Keep within ±3°.",
  side:"How far left or right of the target line the ball finished.",
  launch:"Vertical launch angle off the face. Too high for the loft means you're adding loft (flipping) at impact.",
  apex:"Peak height of the ball flight.",
  spin:"Backspin in rpm. Irons need spin to stop on greens.",
  ball:"Ball speed off the face. It's the single biggest driver of distance.", club:"Club head speed at impact.",
  descent:"Angle the ball lands at. Steeper (45°+) means it stops faster on the green.",
};
const MAIN = DATA.bag.sets[0].clubs;
const CLUB = Object.fromEntries(MAIN.map(c=>[c.key,c]));
const SHORT = {Dr:"Driver","3W":"3W","3H":"3H","7W":"7W","6i":"6i","7i":"7i","8i":"8i","9i":"9i",PW:"PW",AW:"AW","51":"GW","56":"SW","60":"LW",Putter:"Putter"};
const nameOf = k => SHORT[k] || k;
const loftOf = k => CLUB[k]?.loft ?? 99;
const IRON = k => { const l = loftOf(k); return l >= 24 && l <= 41; };
const WEDGE = k => loftOf(k) > 41 && loftOf(k) < 99;
const COLORS = {Dr:"#ff8a65","3W":"#ffb74d","3H":"#ffd54f","7W":"#dce775","6i":"#81c784","7i":"#45d0c0","8i":"#edd36a","9i":"#e78c73",PW:"#b08cf0",AW:"#6ea8fe","51":"#f39ad1","56":"#a1887f","60":"#90a4ae"};
const colorOf = k => COLORS[k] || "#8a94a1";
const alpha = (hex,a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };

/* ---------- helpers ---------- */
const vals = a => a.filter(x => x != null && !Number.isNaN(x));
const mean = a => { a = vals(a); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const median = a => { a = vals(a).sort((x,y)=>x-y); if(!a.length) return null; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; };
const sd = a => { a = vals(a); const m = mean(a); return a.length ? Math.sqrt(mean(a.map(x=>(x-m)**2))) : null; };
const corr = (a,b) => { const p=a.map((x,i)=>[x,b[i]]).filter(([x,y])=>x!=null&&y!=null); if(p.length<5) return null;
  const ma=mean(p.map(q=>q[0])), mb=mean(p.map(q=>q[1])), sa=sd(p.map(q=>q[0])), sb=sd(p.map(q=>q[1]));
  return sa&&sb ? mean(p.map(([x,y])=>(x-ma)*(y-mb)))/(sa*sb) : null; };
const f = (x,d=1) => x==null ? "—" : x.toFixed(d);
const sg = (x,d=1) => x==null ? "—" : (x>0?"+":"")+x.toFixed(d);
const lr = (x,d=0) => x==null ? "—" : Math.abs(x) < 0.5 ? "centre" : `${Math.abs(x).toFixed(d)} ${x>0?"R":"L"}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tip = (key, label) => `<span data-tip="${esc(GLOSS[key]||"")}">${label}</span>`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const sw = k => `<span class="sw" style="background:${colorOf(k)}"></span>`;

Chart.defaults.color = css('--muted');
Chart.defaults.borderColor = css('--line');
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12.5;
Chart.defaults.plugins.tooltip.backgroundColor = "#000";
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.cornerRadius = 8;
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.boxWidth = 8;
const charts = {};
function draw(id, cfg){ charts[id]?.destroy(); const el=$(id); if(el) charts[id] = new Chart(el, cfg); }
const gridc = {color:css('--line')};

/* ---------- analysis ---------- */
function analyze(s){
  const keys = Object.keys(s.clubs).sort((a,b)=>loftOf(a)-loftOf(b));
  const ironSpeed = mean(keys.filter(IRON).flatMap(k=>s.clubs[k].map(r=>r.clubSpeed)));
  const meta = s.meta || {};
  const clubs = {};
  for (const k of keys){
    const shots = s.clubs[k].map(r=>({...r, key:k, f2p:(r.face!=null&&r.path!=null)?+(r.face-r.path).toFixed(1):null,
      suspect:(loftOf(k)>=24 && r.smash>1.38) || (loftOf(k)>=27 && loftOf(k)<=41 && r.backSpin<2500)}));
    const g = p => shots.map(r=>r[p]);
    const cs = mean(g("clubSpeed"));
    const partial = WEDGE(k) && ironSpeed!=null && cs < 0.9*ironSpeed;
    clubs[k] = { key:k, shots, partial, n:shots.length, caveat:meta.caveats?.[k] || null,
      carry:mean(g("carry")), total:mean(g("total")), roll:mean(shots.map(r=>r.total-r.carry)), carrySd:sd(g("carry")),
      cmin:Math.min(...vals(g("carry"))), cmax:Math.max(...vals(g("carry"))),
      smash:median(g("smash")), ball:mean(g("ballSpeed")), club:cs, spin:mean(g("backSpin")), launch:mean(g("launch")),
      apex:mean(g("apex")), descent:mean(g("descent")), path:mean(g("path")), face:mean(g("face")), f2p:mean(g("f2p")), side:mean(g("side")) };
  }
  const full = keys.filter(k=>!clubs[k].partial).flatMap(k=>clubs[k].shots);
  return { s, meta, keys, clubs, full, ironSpeed };
}

// Each finding: {sev, title, body}. Sorted bad → warn → info → good for the takeaways.
function sessionFindings(A){
  const F = [], {clubs, keys, full, meta} = A;
  const fp = mean(full.map(r=>r.path)), ff = mean(full.map(r=>r.f2p)), fface = mean(full.map(r=>r.face));
  if (fp!=null){
    const nOut = full.filter(r=>r.path<=-6).length;
    if (fp < -4) F.push({sev:"bad", title:`Swinging out-to-in (${sg(fp)}°)`, body:`${nOut} of ${full.length} full swings had a path of −6° or worse. This is the root of the slice and the heel strikes, so fix it first.`});
    else if (fp < -2) F.push({sev:"warn", title:`Path slightly out-to-in (${sg(fp)}°)`, body:"Close to the ±2° neutral window. Keep going."});
    else if (fp > 4) F.push({sev:"warn", title:`Path in-to-out (${sg(fp)}°)`, body:"Watch for pushes and hooks."});
    else F.push({sev:"good", title:`Neutral path (${sg(fp)}°)`, body:"Inside the ±2° target window."});
  }
  if (ff!=null){
    const nOpen = full.filter(r=>r.f2p>3).length;
    if (ff > 3) F.push({sev:"bad", title:`Ball curving right: face ${sg(ff)}° open to path`, body:
      `${nOpen} of ${full.length} swings had the face more than 3° open to the path.` + (Math.abs(fface) < 3 ? ` Your face to the target is only ${sg(fface)}°, so fix the path, not the face. The curve shrinks as the path improves.` : "")});
    else if (ff < -3) F.push({sev:"bad", title:`Ball curving left: face ${sg(ff)}° closed to path`, body:"Draw/hook curvature."});
    else F.push({sev:"good", title:`Face-to-path under control (${sg(ff)}°)`, body:"Curvature is manageable."});
  }
  const lowSmash = keys.filter(k=>!clubs[k].partial && BENCH.pga[k]?.smash && clubs[k].smash!=null && clubs[k].smash < BENCH.pga[k].smash-0.06);
  if (lowSmash.length) F.push({sev:lowSmash.length>1?"bad":"warn", title:"Strike quality below Tour", body:
    lowSmash.map(k=>`${nameOf(k)} ${f(clubs[k].smash,2)} (Tour ${BENCH.pga[k].smash})`).join(", ") + ". Low smash on irons usually means heel or thin contact."});
  const clean = full.filter(r=>!r.suspect);
  const r = corr(clean.map(x=>x.clubSpeed), clean.map(x=>x.smash));
  if (r!=null && r < -0.3) F.push({sev:"bad", title:"Contact gets worse when you swing harder", body:`Speed vs. smash correlation r = ${f(r,2)}. The arms take over (over the top). Groove the path at 70–80% speed before adding speed.`});
  const ir = keys.filter(k=>IRON(k) && !clubs[k].partial && clubs[k].launch!=null);
  if (ir.length){
    const ratio = mean(ir.map(k=>clubs[k].launch/loftOf(k)));
    const ex = ir.includes("8i") ? "8i" : ir[0];
    if (ratio > 0.7) F.push({sev:"warn", title:"Launching too high for the loft", body:`${f(clubs[ex].launch)}° launch with a ${loftOf(ex)}° ${nameOf(ex)}, ${Math.round(ratio*100)}% of loft (Tour players launch at about 50–55%). You're adding loft at impact, a flip or early extension, which ties back to S-posture.`});
  }
  const fk = keys.filter(k=>!clubs[k].partial && CLUB[k]);
  for (let i=0;i<fk.length-1;i++){
    const a=fk[i], b=fk[i+1], gap = clubs[a].carry-clubs[b].carry;
    const cav = clubs[a].caveat || clubs[b].caveat;
    if (gap < 6) F.push({sev:cav?"warn":"bad", title:`${nameOf(a)} and ${nameOf(b)} go the same distance`, body:`Only ${f(gap)} yd between them (target 10–12).` + (cav ? ` The ${clubs[a].caveat?nameOf(a):nameOf(b)} is flagged as a possible outlier, so retest before acting on this.` : "")});
    else if (gap > 20) F.push({sev:"warn", title:`Big gap: ${nameOf(a)} → ${nameOf(b)}`, body:`${f(gap)} yd between them.`});
  }
  const wide = keys.filter(k=>IRON(k) && clubs[k].carrySd > 8);
  if (wide.length) F.push({sev:"warn", title:"Wide carry spread", body:wide.map(k=>`${nameOf(k)} ±${f(clubs[k].carrySd)} yd`).join(", ") + (meta.curated ? ". And that's with mishits already removed." : ".")});
  const c7 = clubs["7i"];
  if (c7 && !c7.partial && c7.club>70 && c7.club<82 && c7.carry < 133)
    F.push({sev:"info", title:"You have LPGA speed. The distance is lost at the strike.", body:`Your 7-iron speed is ${f(c7.club)} mph, about what LPGA players swing, and they carry it 141 yd. You carried ${f(c7.carry,0)}.`});
  const sus = full.filter(x=>x.suspect).map(x=>`${nameOf(x.key)} #${x.n}`);
  if (sus.length) F.push({sev:"info", title:"Possible sensor misreads", body:`${sus.join(", ")} (smash above 1.38 or iron spin below 2,500 rpm). Medians are used to limit their effect.`});
  const missing = MAIN.filter(c=>c.key!=="Putter" && !clubs[c.key]).map(c=>nameOf(c.key));
  if (missing.length) F.push({sev:"info", title:"Not hit this session", body:missing.join(", ")});
  const order = {bad:0,warn:1,info:2,good:3};
  return F.sort((a,b)=>order[a.sev]-order[b.sev]);
}

/* ---------- state ---------- */
const ALL = DATA.sessions.map(analyze);
const state = { i: ALL.length-1, tab:"session", club:null, allCols:false, sort:["loft",1], tee:{}, hole:null, metric:"carry", tmetric:"carry" };
const metricChips = (stateKey, id) => `<div class="chips" id="${id}">${METRICS.map(m=>`<button class="chip mchip" data-m="${m.k}" aria-pressed="${state[stateKey]===m.k}">${m.label}</button>`).join("")}</div>`;

/* ---------- grades (arcade-style rank per metric) ---------- */
const gPath  = v => v==null?"?":Math.abs(v)<=2?"A":Math.abs(v)<=4?"B":Math.abs(v)<=6?"C":Math.abs(v)<=8?"D":"F";
const gF2P   = v => v==null?"?":Math.abs(v)<=1.5?"A":Math.abs(v)<=3?"B":Math.abs(v)<=5?"C":Math.abs(v)<=7?"D":"F";
const gSmash = v => v==null?"?":v>=1.33?"A":v>=1.28?"B":v>=1.22?"C":v>=1.15?"D":"F";
const gradeBox = g => `<div class="grade g${g}" title="Grade: A = Tour level, F = biggest fix">${g}</div>`;

/* ---------- SESSION ---------- */
function renderSession(){
  const A = ALL[state.i], {s, keys, clubs, full, meta} = A;
  if (state.club && !clubs[state.club]) state.club = null;
  const fp = mean(full.map(r=>r.path)), ff = mean(full.map(r=>r.f2p));
  const ironSm = median(full.filter(r=>IRON(r.key)).map(r=>r.smash));
  const shots = keys.reduce((n,k)=>n+clubs[k].n,0);
  const F = sessionFindings(A);
  const top = F.filter(x=>x.sev==="bad"||x.sev==="warn").slice(0,3);
  const cls = (v,warnAt,badAt) => Math.abs(v)>badAt?"bad":Math.abs(v)>warnAt?"warn":"good";
  const longest = keys.filter(k=>!clubs[k].partial).sort((a,b)=>clubs[b].carry-clubs[a].carry)[0];

  $("tab-session").innerHTML = `
    ${meta.curated ? `<div class="banner"><span class="ic">⚑</span><div><b>Best shots only.</b> ${esc(meta.curatedNote || "Mishits were removed before export, so these numbers are a best case.")}</div></div>` : ""}
    <section class="kpis">
      <div class="kpi ${cls(fp,2,4)}">${gradeBox(gPath(fp))}<div class="l">${tip("path","Club path")}</div><div class="v">${sg(fp)}°</div><div class="c">${fp<-2?"Out-to-in (slice path)":fp>2?"In-to-out":"Neutral"}</div><div class="t">Goal: 0 ± 2°</div></div>
      <div class="kpi ${cls(ff,1.5,3)}">${gradeBox(gF2P(ff))}<div class="l">${tip("f2p","Face-to-path")}</div><div class="v">${sg(ff)}°</div><div class="c">${ff>3?"Ball curves right":ff<-3?"Ball curves left":"Controlled curve"}</div><div class="t">Goal: within ±3°</div></div>
      <div class="kpi ${ironSm<1.22?"bad":ironSm<1.3?"warn":"good"}">${gradeBox(gSmash(ironSm))}<div class="l">${tip("smash","Iron strike (smash)")}</div><div class="v">${f(ironSm,2)}</div><div class="c">${ironSm<1.22?"Off-centre contact":ironSm<1.3?"Fair contact":"Solid contact"}</div><div class="t">Tour irons 1.28–1.38</div></div>
      <div class="kpi"><div class="l">Session</div><div class="v">${shots} <span style="font-size:16px;color:var(--muted);font-weight:600">shots</span></div><div class="c">${keys.length} clubs · longest ${nameOf(longest)} ${f(clubs[longest].carry,0)} yd</div><div class="t">${s.iso}</div></div>
    </section>

    <section class="card">
      <div class="sec"><h2>What to work on</h2><span class="muted small">auto-generated from ${shots} shots</span></div>
      <p class="lede">The ${top.length} most important things from this session, most urgent first.</p>
      <div class="takeaways">${top.map((t,i)=>`<div class="take ${t.sev}"><div class="n">#${i+1}</div><h3>${t.title}</h3><p>${t.body}</p></div>`).join("")}</div>
      <details><summary>All findings (${F.length})</summary>
        <ul class="findings">${F.map(x=>`<li><span class="dot ${x.sev}"></span><span><b>${x.title}.</b> ${x.body}</span></li>`).join("")}</ul></details>
      ${s.review ? `<details><summary>Coach notes</summary><div class="notes">${s.review}</div></details>` : ""}
      ${meta.nextSession ? `<p class="small" style="margin:14px 0 0"><b>Next session:</b> <span class="muted">${esc(meta.nextSession)}</span></p>` : ""}
    </section>

    <section class="card">
      <div class="sec"><h2>Clubs</h2><span class="muted small">Pick a club to focus every chart on it</span></div>
      <div class="chips" style="margin-top:12px">
        <button class="chip" data-club="" aria-pressed="${!state.club}">All clubs</button>
        ${keys.map(k=>`<button class="chip" data-club="${k}" aria-pressed="${state.club===k}">${sw(k)}${nameOf(k)}<span class="sub">${f(clubs[k].carry,0)}</span>${clubs[k].caveat?'<span class="flag" title="Flagged">⚑</span>':""}${clubs[k].partial?'<span class="sub">· partial</span>':""}</button>`).join("")}
      </div>
    </section>

    ${state.club ? clubDetail(A, state.club) : ""}

    <section class="card">
      <div class="sec"><h2>Compare to the Tour</h2><span class="muted small">Pick a metric</span></div>
      <div style="margin:12px 0 4px">${metricChips("metric","mchips")}</div>
      <p class="lede" id="cmpInsight" style="margin-top:12px"></p>
      <div class="chart tall"><canvas id="cCompare"></canvas></div>
      <p class="muted small" style="margin:10px 0 0">Bars = your average · dots = each shot (click one to see its impact frames) · colored ticks = benchmarks: TrackMan Tour averages · 25 hcp = Shot Scope (carry only). Your Paradym X lofts are ~4–6° stronger than standard.</p>
    </section>

    <section class="grid2">
      <div class="card"><div class="sec"><h2>Where your shots land</h2></div>
        <p class="lede">Each dot is one shot, seen from above. Left/right of the target line vs. carry distance. Click a dot to see that shot.</p>
        <div class="chart tall"><canvas id="cDisp"></canvas></div></div>
      <div class="card"><div class="sec"><h2>Gapping</h2></div>
        <p class="lede">Carry by loft. Each step down in loft should add 10–12 yd. A flat stretch means two clubs go the same distance. Hollow points are partial swings.</p>
        <div class="chart tall"><canvas id="cGap"></canvas></div></div>
      <div class="card"><div class="sec"><h2>Why the ball curves</h2></div>
        <p class="lede">Dots above the dashed line had the face open to the path, so they curve right. The green band is a neutral path.</p>
        <div class="chart"><canvas id="cFace"></canvas></div></div>
      <div class="card"><div class="sec"><h2>Strike vs. path</h2></div>
        <p class="lede">Higher is a more centred strike. Watch how strike quality drops as the path gets more out-to-in.</p>
        <div class="chart"><canvas id="cSmash"></canvas></div></div>
    </section>

    <section class="card">
      <div class="sec"><h2>Club averages</h2><button class="toggle" id="cols" aria-pressed="${state.allCols}">${state.allCols?"Fewer columns":"All metrics"}</button></div>
      <p class="lede">Click a column to sort, or a row to focus that club. Hover an underlined heading for what it means.</p>
      <div class="tablewrap"><table id="tbl"></table></div>
    </section>`;

  document.querySelectorAll("#tab-session .chip[data-club]").forEach(b=>b.onclick=()=>{state.club=b.dataset.club||null;render();});
  document.querySelectorAll("#mchips .mchip, #dchips .mchip").forEach(b=>b.onclick=()=>{state.metric=b.dataset.m;render();});
  document.querySelectorAll("#tab-session tr[data-shot]").forEach(tr=>tr.onclick=()=>openShot(state.i, tr.dataset.club, +tr.dataset.shot));
  $("cols").onclick=()=>{state.allCols=!state.allCols;render();};
  renderClubTable(A);
  sessionCharts(A);
}

function clubDetail(A, k){
  const c = A.clubs[k];
  const m = MET[state.metric];
  const bench = [["You",c[m.k],colorOf(k)],["25 hcp",BENCH.hcp25[k]?.[m.k],css('--hcp')],["LPGA",BENCH.lpga[k]?.[m.k],css('--lpga')],["PGA",BENCH.pga[k]?.[m.k],css('--pga')]].filter(b=>b[1]!=null);
  const maxB = Math.max(...bench.map(b=>Math.abs(b[1])));
  const cols = [["#","n",0],["Carry","carry",1],["Side","side",-1],["Ball","ballSpeed",1],["Club","clubSpeed",1],["Smash","smash",2],["Path","path",1],["F2P","f2p",1],["Spin","backSpin",0],["Launch","launch",1]];
  return `<section class="card">
    <div class="sec"><h2><span class="cn">${sw(k)}${esc(CLUB[k]?.label||nameOf(k))}</span> <span class="muted small">${CLUB[k]?esc(CLUB[k].model)+" · "+CLUB[k].loft+"°":""}</span></h2>
      <button class="toggle" data-club="">Close ✕</button></div>
    ${c.caveat ? `<div class="caveat" style="margin-top:12px"><b>⚑ Caveat:</b> ${esc(c.caveat)}</div>` : ""}
    ${c.partial ? `<div class="caveat" style="margin-top:12px"><b>Partial swings.</b> Club speed was well below your irons, so these are not full-swing yardages.</div>` : ""}
    <div class="detail-grid" style="margin-top:12px">
      <div>
        <div class="detail-head">
          <div><div class="stat"><div class="l">${tip("carry","Avg carry")}</div></div><div class="big">${f(c.carry,0)}<small>yd</small></div></div>
          <div class="stat"><div class="l">Range</div><div class="v">${f(c.cmin,0)}–${f(c.cmax,0)}</div></div>
          <div class="stat"><div class="l">${tip("spread","Spread")}</div><div class="v">±${f(c.carrySd,0)}</div></div>
          <div class="stat"><div class="l">${tip("total","Total")}</div><div class="v">${f(c.total,0)}</div></div>
          <div class="stat"><div class="l">${tip("side","Avg finish")}</div><div class="v">${lr(c.side)}</div></div>
        </div>
        <div class="muted small" style="margin:4px 0 6px">Compare by:</div>
        ${metricChips("metric","dchips")}
        ${bench.length>1 && !m.zero ? `<div class="bars" style="margin-top:12px">${bench.map(([l,v,col])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${(Math.abs(v)/maxB*100).toFixed(1)}%;background:${col}"></div></div><span class="num">${fm(m,v)}</span></div>`).join("")}</div>`
          : `<p class="muted small" style="margin-top:12px">${m.zero ? `Your ${m.label.toLowerCase()}: <b style="color:var(--ink)">${fm(m,c[m.k])}</b>. Tour players average close to 0.` : `No published benchmark for ${m.label.toLowerCase()} with this club. Yours: <b style="color:var(--ink)">${fm(m,c[m.k])}</b>.`}</p>`}
      </div>
      <div>
        <div class="tablewrap"><table class="shots"><thead><tr><th class="tl">Impact</th>${cols.map(([h])=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
          ${c.shots.map(r=>`<tr class="clickable" data-club="${k}" data-shot="${r.n}" title="Open shot ${r.n}"><td class="tl">${r.img?.impact?`<img class="thumb" src="${esc(r.img.impact)}" alt="" loading="lazy">`:""}</td>${cols.map(([,p,d])=>`<td>${p==="side"?lr(r.side):["path","face","f2p"].includes(p)?sg(r[p],d):f(r[p],d)}${p==="n"&&r.suspect?' <span class="tag warn" title="Possible sensor misread">?</span>':""}</td>`).join("")}</tr>`).join("")}
        </tbody></table></div>
        <p class="muted small" style="margin:8px 0 0">Click a row to open the impact photo and swing frames.</p>
      </div>
    </div></section>`;
}

const TCOLS = [
  {k:"loft",h:"Loft",fmt:c=>CLUB[c.key]?.loft!=null?CLUB[c.key].loft+"°":"—",v:c=>loftOf(c.key),core:1},
  {k:"carry",h:"Carry",fmt:c=>f(c.carry),core:1},
  {k:"total",h:"Total",fmt:c=>f(c.total)},
  {k:"roll",h:"Roll",fmt:c=>f(c.roll)},
  {k:"carrySd",h:"Spread",g:"spread",fmt:c=>"±"+f(c.carrySd),core:1},
  {k:"smash",h:"Smash",fmt:c=>f(c.smash,2),core:1,cls:c=>c.smash==null?"":c.smash<1.15&&!c.partial&&!WEDGE(c.key)?"bad":""},
  {k:"ball",h:"Ball mph",fmt:c=>f(c.ball)},
  {k:"club",h:"Club mph",fmt:c=>f(c.club)},
  {k:"spin",h:"Spin",fmt:c=>c.spin==null?"—":Math.round(c.spin).toLocaleString()},
  {k:"launch",h:"Launch",fmt:c=>f(c.launch)+"°"},
  {k:"apex",h:"Apex",fmt:c=>f(c.apex)},
  {k:"path",h:"Path",fmt:c=>sg(c.path)+"°",core:1,cls:c=>Math.abs(c.path)>4?"bad":Math.abs(c.path)>2?"warn":"good"},
  {k:"face",h:"Face",fmt:c=>sg(c.face)+"°"},
  {k:"f2p",h:"F2P",fmt:c=>sg(c.f2p)+"°",core:1,cls:c=>Math.abs(c.f2p)>3?"bad":Math.abs(c.f2p)>1.5?"warn":"good"},
  {k:"side",h:"Finish",fmt:c=>lr(c.side),v:c=>c.side,core:1},
];
function renderClubTable(A){
  const cols = TCOLS.filter(c=>state.allCols||c.core);
  const [sk, sd_] = state.sort;
  const col = TCOLS.find(c=>c.k===sk) || TCOLS[0];
  const val = c => col.v ? col.v(c) : c[col.k];
  const rows = A.keys.map(k=>A.clubs[k]).sort((a,b)=>((val(a)??-1e9)-(val(b)??-1e9))*sd_);
  $("tbl").innerHTML = `<thead><tr><th>Club</th>${cols.map(c=>`<th class="sortable" data-k="${c.k}">${GLOSS[c.g||c.k]?tip(c.g||c.k,c.h):c.h}${sk===c.k?`<span class="arr">${sd_>0?"↑":"↓"}</span>`:""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(c=>`<tr class="clickable ${state.club===c.key?"sel":""}" data-club="${c.key}"><td><span class="cn">${sw(c.key)}${nameOf(c.key)}</span>${c.partial?'<span class="tag">partial</span>':""}${c.caveat?'<span class="tag warn">⚑ retest</span>':""}</td>
      ${cols.map(t=>`<td class="${t.cls?t.cls(c):""}">${t.fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  document.querySelectorAll("#tbl th.sortable").forEach(th=>th.onclick=()=>{const k=th.dataset.k; state.sort=[k, state.sort[0]===k?-state.sort[1]:(k==="loft"?1:-1)]; renderClubTable(A);});
  document.querySelectorAll("#tbl tr.clickable").forEach(tr=>tr.onclick=()=>{state.club=state.club===tr.dataset.club?null:tr.dataset.club;render();window.scrollTo({top:0,behavior:"smooth"});});
  document.querySelectorAll("#tab-session .toggle[data-club]").forEach(b=>b.onclick=()=>{state.club=null;render();});
}

const shotClick = id => (e,els)=>{ if(!els.length) return; const r=charts[id].data.datasets[els[0].datasetIndex].data[els[0].index]?.r; if(r) openShot(state.i, r.key, r.n); };
const hoverPtr = (e,els)=>{ e.native.target.style.cursor = els.length ? "pointer" : "default"; };
function sessionCharts(A){
  const {keys, clubs, full} = A;
  const fk = keys.filter(k=>!clubs[k].partial);
  const on = k => !state.club || state.club===k;
  const pc = k => on(k) ? colorOf(k) : alpha(colorOf(k),.12);
  const shotTip = r => [`${nameOf(r.key)} #${r.n}`, `Carry ${f(r.carry)} yd · finish ${lr(r.side)}`, `Path ${sg(r.path)}° · face ${sg(r.face)}° · F2P ${sg(r.f2p)}°`, `Smash ${f(r.smash,2)}${r.suspect?" (possible misread)":""}`];
  const dispKeys = state.club ? keys : fk;

  // dispersion
  const sides = dispKeys.flatMap(k=>clubs[k].shots.map(r=>Math.abs(r.side||0)));
  const sx = Math.max(10, Math.ceil(Math.max(...sides)/5)*5+5);
  const centre = {id:"centre",beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;const px=x.getPixelForValue(0);
    ctx.save();ctx.strokeStyle=css('--faint');ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,a.top);ctx.lineTo(px,a.bottom);ctx.stroke();
    ctx.fillStyle=css('--faint');ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillText("target line",px,a.top+12);ctx.restore();}};
  draw("cDisp",{type:"scatter",plugins:[centre],
    data:{datasets:dispKeys.map(k=>({label:nameOf(k),data:clubs[k].shots.map(r=>({x:r.side,y:r.carry,r})),
      backgroundColor:pc(k),borderColor:pc(k),pointRadius:on(k)?6:4,pointHoverRadius:8,pointStyle:clubs[k].partial?"rectRot":"circle"}))},
    options:{maintainAspectRatio:false,onClick:shotClick("cDisp"),onHover:hoverPtr,scales:{x:{min:-sx,max:sx,grid:gridc,title:{display:true,text:"← left of target (yd)   ·   right of target (yd) →"}},
      y:{grid:gridc,title:{display:true,text:"Carry (yd)"}}},
      plugins:{legend:{position:"bottom",onClick:(e,item)=>{const k=dispKeys[item.datasetIndex];state.club=state.club===k?null:k;render();}},
        tooltip:{callbacks:{label:c=>shotTip(c.raw.r)}}}}});

  // compare-to-tour for the selected metric
  const m = MET[state.metric], ck = keys, labels = ck.map(k=>nameOf(k)+(clubs[k].partial?"*":""));
  const bench = src => ck.map(k=>clubs[k].partial?null:(BENCH[src][k]?.[m.k]??null));
  const hasB = src => bench(src).some(v=>v!=null);
  const tick = (label, src, color) => ({type:"scatter",label,order:1,data:ck.map((k,i)=>({x:labels[i],y:bench(src)[i]})).filter(d=>d.y!=null),
    pointStyle:"line",pointRadius:ctx=>Math.max(10,(ctx.chart.chartArea?.width||600)/ck.length*0.3),pointHoverRadius:ctx=>Math.max(10,(ctx.chart.chartArea?.width||600)/ck.length*0.3),
    borderColor:color,backgroundColor:color,borderWidth:3,pointHoverBorderWidth:4});
  const cds = [{label:"You (avg)",data:ck.map(k=>clubs[k][m.k]==null?null:+clubs[k][m.k].toFixed(m.dp)),backgroundColor:ck.map(k=>alpha(colorOf(k),on(k)?.8:.15)),borderRadius:6,barPercentage:.7,categoryPercentage:.8,order:3}];
  if (hasB("hcp25")) cds.push(tick("25 handicap","hcp25","#e7a35b"));
  if (hasB("lpga")) cds.push(tick("LPGA Tour","lpga","#b08cf0"));
  if (hasB("pga")) cds.push(tick("PGA Tour","pga","#6ea8fe"));
  cds.push({type:"scatter",label:"Each shot",order:1,
    data:ck.flatMap((k,i)=>clubs[k].shots.filter(r=>r[m.shot]!=null).map(r=>({x:labels[i],y:r[m.shot],r}))),
    backgroundColor:ctx=>{const r=ctx.raw?.r;return r?(on(r.key)?"#ffffff":alpha("#ffffff",.12)):"#fff";},
    borderColor:"rgba(0,0,0,.6)",borderWidth:1,pointRadius:ctx=>ctx.raw?.r&&on(ctx.raw.r.key)?4:3,pointHoverRadius:7});
  const zeroLine = {id:"zero",afterDatasetsDraw(ch){if(!m.zero)return;const {ctx,chartArea:a,scales:{y}}=ch;const py=y.getPixelForValue(0);
    ctx.save();ctx.strokeStyle=css('--good');ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(a.left,py);ctx.lineTo(a.right,py);ctx.stroke();
    ctx.fillStyle=css('--good');ctx.font="600 11px sans-serif";ctx.fillText("Tour ≈ 0",a.right-58,py-6);ctx.restore();}};
  draw("cCompare",{type:"bar",data:{labels,datasets:cds},plugins:[zeroLine],
    options:{maintainAspectRatio:false,
      onClick:(e,els)=>{const el=els.find(x=>ch().data.datasets[x.datasetIndex].label==="Each shot"); if(el){const r=ch().data.datasets[el.datasetIndex].data[el.index].r; openShot(state.i,r.key,r.n);}},
      onHover:(e,els)=>{e.native.target.style.cursor=els.some(x=>ch().data.datasets[x.datasetIndex].label==="Each shot")?"pointer":"default";},
      scales:{y:{grid:gridc,title:{display:true,text:`${m.label}${m.unit?" ("+m.unit+")":""}`},beginAtZero:!m.zero&&!["smash","launch","descent"].includes(m.k)},x:{grid:{display:false}}},
      plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>{
        if(c.raw==null) return null;
        if(c.dataset.label==="Each shot") return [`${nameOf(c.raw.r.key)} #${c.raw.r.n}: ${fm(m,c.raw.y)}`,"Click to open this shot"];
        if(c.dataset.type==="scatter") return `${c.dataset.label}: ${fm(m,c.raw.y)}`;
        const k=ck[c.dataIndex];
        return c.datasetIndex===0 ? [`You: ${fm(m,c.raw)} avg`, `Range ${fm(m,Math.min(...vals(clubs[k].shots.map(r=>r[m.shot]))))} – ${fm(m,Math.max(...vals(clubs[k].shots.map(r=>r[m.shot]))))}`] : `${c.dataset.label}: ${fm(m,c.raw)}`;}}}}}});
  const ch = () => charts.cCompare;
  // one-line insight for the metric
  const withP = ck.filter(k=>!clubs[k].partial && BENCH.pga[k]?.[m.k]!=null && clubs[k][m.k]!=null);
  const pct = src => { const ks = ck.filter(k=>!clubs[k].partial && BENCH[src][k]?.[m.k]!=null && clubs[k][m.k]!=null); return ks.length ? Math.round(mean(ks.map(k=>clubs[k][m.k]/BENCH[src][k][m.k]))*100) : null; };
  const pP = pct("pga"), pL = pct("lpga");
  $("cmpInsight").innerHTML = m.zero
    ? `Tour players average close to <b>0</b>. Your full-swing average is <b>${fm(m, mean(full.map(r=>r[m.shot])))}</b>.`
    : withP.length ? `Across ${withP.map(nameOf).join(", ")}, your ${m.label.toLowerCase()} is <b>${pP}%</b> of the PGA Tour average${pL!=null?` and <b>${pL}%</b> of the LPGA Tour average`:""}.${m.k==="launch"&&pP>110?" Higher than Tour despite your stronger lofts, which is a sign of adding loft at impact.":""}${m.k==="club"&&pL!=null&&pL>=95?" Your speed is LPGA-level, so the distance gap comes from strike quality.":""}`
    : `No Tour benchmark for ${m.label.toLowerCase()} on the clubs in this session.`;

  // face vs path + smash vs path
  const pk = state.club ? [state.club].filter(k=>clubs[k]) : fk;
  const paths = pk.flatMap(k=>clubs[k].shots.map(r=>r.path)).filter(x=>x!=null);
  const xmin = Math.min(-16, Math.floor(Math.min(...paths)-2)), xmax = Math.max(4, Math.ceil(Math.max(...paths)+2));
  const band = {id:"band",beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;const l=x.getPixelForValue(-2),r=x.getPixelForValue(2);
    ctx.save();ctx.fillStyle="rgba(90,209,122,.10)";ctx.fillRect(l,a.top,r-l,a.bottom-a.top);ctx.restore();}};
  const ds = fn => fk.map(k=>({label:nameOf(k),data:clubs[k].shots.filter(r=>r.path!=null).map(r=>({x:r.path,y:fn(r),r})),
    backgroundColor:pc(k),pointRadius:on(k)?6:4,pointHoverRadius:8}));
  const diag = {id:"diag",afterDatasetsDraw(ch){const {ctx,scales:{x,y},chartArea:a}=ch;ctx.save();ctx.beginPath();ctx.rect(a.left,a.top,a.right-a.left,a.bottom-a.top);ctx.clip();
    ctx.setLineDash([5,5]);ctx.strokeStyle=css('--faint');ctx.beginPath();ctx.moveTo(x.getPixelForValue(xmin),y.getPixelForValue(xmin));ctx.lineTo(x.getPixelForValue(xmax),y.getPixelForValue(xmax));ctx.stroke();
    ctx.setLineDash([]);ctx.font="600 11px sans-serif";ctx.fillStyle=css('--bad');ctx.fillText("↑ curves right",a.left+8,a.top+14);ctx.fillStyle=css('--info');ctx.fillText("↓ curves left",a.right-80,a.bottom-8);ctx.restore();}};
  const legendClick = (e,item)=>{const k=fk[item.datasetIndex];state.club=state.club===k?null:k;render();};
  draw("cFace",{type:"scatter",data:{datasets:ds(r=>r.face)},plugins:[band,diag],
    options:{maintainAspectRatio:false,onClick:shotClick("cFace"),onHover:hoverPtr,scales:{x:{min:xmin,max:xmax,grid:gridc,title:{display:true,text:"Club path (°)  ← out-to-in · in-to-out →"}},
      y:{min:xmin,max:xmax,grid:gridc,title:{display:true,text:"Face to target (°)"}}},
      plugins:{legend:{position:"bottom",onClick:legendClick},tooltip:{callbacks:{label:c=>shotTip(c.raw.r)}}}}});
  draw("cSmash",{type:"scatter",data:{datasets:ds(r=>r.smash)},plugins:[band],
    options:{maintainAspectRatio:false,onClick:shotClick("cSmash"),onHover:hoverPtr,scales:{x:{min:xmin,max:xmax,grid:gridc,title:{display:true,text:"Club path (°)  ← out-to-in · in-to-out →"}},
      y:{grid:gridc,title:{display:true,text:"Smash factor"}}},
      plugins:{legend:{position:"bottom",onClick:legendClick},tooltip:{callbacks:{label:c=>shotTip(c.raw.r)}}}}});

  // gapping
  const lk = keys.filter(k=>CLUB[k]?.loft!=null);
  draw("cGap",{type:"line",
    data:{datasets:[
      {label:"Carry",data:lk.map(k=>({x:loftOf(k),y:+f(clubs[k].carry),k})),borderColor:css('--accent'),
        backgroundColor:lk.map(k=>clubs[k].partial?css('--panel'):pc(k)),pointBorderColor:lk.map(k=>pc(k)),pointBorderWidth:2,pointRadius:lk.map(k=>on(k)?8:5),pointHoverRadius:10,borderWidth:2,tension:.2},
      {label:"Total",data:lk.map(k=>({x:loftOf(k),y:+f(clubs[k].total),k})),borderColor:css('--faint'),borderDash:[5,4],pointRadius:0,borderWidth:1.5,tension:.2}]},
    options:{maintainAspectRatio:false,parsing:false,
