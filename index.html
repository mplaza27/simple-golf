        ${tile("Launch","launch",f(c.launch)+"°",CLUB[k]?.loft?`${CLUB[k].loft}° loft`:"")}
        ${tile("Smash","smash",f(median(clean.map(r=>r.smash)),2),"misreads removed")}
      </div>
    </section>
    <section class="sw-grid">
      <div class="card"><div class="head"><h2>Path &amp; face</h2></div>${pathSVG(k, sh)}
        <div class="swlegend"><span><i style="background:${colorOf(k)}"></i>club path (each shot + average)</span><span><i style="background:#f1ead0"></i>face at impact</span><span><i style="background:#e3c97a"></i>ball: start → average finish</span></div></div>
      <div class="card"><div class="head"><h2>Ball flight</h2></div>${flightSVG(k, sh)}
        <p class="muted small" style="margin:8px 0 0">Side view of each shot from its launch angle, apex and landing angle (shape is approximate; height is stretched). Avg apex ${f(c.apex)} yd, land ${f(c.descent)}°.</p></div>
    </section>
    <section class="card">
      <div class="head"><h2>Impact</h2><span class="muted small">Tap a shot for all 24 frames</span></div>
      <div class="scrub">
        <button class="btn sm" id="swContact" aria-pressed="${state.swFrame==null}">At contact</button>
        <input type="range" id="swRange" min="0" max="${Math.max(0,frames-1)}" value="${state.swFrame??8}" aria-label="Frame for every shot">
        <span class="muted small" id="swLabel">${state.swFrame==null?"each shot at its own contact frame":`frame ${state.swFrame+1} for every shot`}</span>
      </div>
      <div class="crops" id="crops">${sh.map(r=>`<div class="crop" data-crop="${k}-${r.n}" data-shot="${r.n}"><span class="fr">…</span><canvas width="220" height="154" aria-label="Shot ${r.n} at impact"></canvas>
        <div class="cap"><span>${r.tag||"#"+r.n}${r.mishit?' <span class="warn">mishit</span>':r.suspect?' <span class="warn">?</span>':""}</span><span>smash ${f(r.smash,2)} · ${f(r.carry,0)} yd</span></div></div>`).join("")}</div>
      <p class="muted small" style="margin:12px 0 0">Top-down camera, cropped on the ball. The hosel/shaft is toward the top of each image, so a ball nearer the top is closer to the heel. This session has no measured face-contact location (that needs Uneekor's Optix), so judge it from the frames.</p>
    </section>
    <section class="card"><div class="head"><h2>Dispersion</h2><span class="muted small">${nameOf(k)} · outline wraps every shot</span></div><div class="chart" style="height:300px"><canvas id="swDisp"></canvas></div></section>`;

  wirePicker($("tab-swing"));
  document.querySelectorAll("#tab-swing [data-swing]").forEach(b=>b.onclick=()=>{state.swing=b.dataset.swing;render();});
  document.querySelectorAll("#tab-swing [data-crop]").forEach(el=>el.onclick=()=>openShot(state.i,k,+el.dataset.shot));
  $("swContact").onclick = () => { state.swFrame = null; render(); };
  $("swRange").oninput = e => { state.swFrame = +e.target.value; $("swContact").setAttribute("aria-pressed","false"); $("swLabel").textContent = `frame ${state.swFrame+1} for every shot`; drawCrops(k, sh); };
  drawCrops(k, sh);

  const pts = sh.filter(r=>r.carry!=null && r.side!=null), my = Math.ceil((Math.max(10,...pts.map(r=>Math.abs(r.side)))+10)/10)*10;
  const x0 = Math.max(0, Math.floor((Math.min(...pts.map(r=>r.carry))-15)/10)*10), x1 = Math.ceil((Math.max(...pts.map(r=>r.carry))+15)/10)*10;
  const line = {id:"tline",beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{y}}=ch;ctx.save();ctx.strokeStyle="rgba(233,229,211,.35)";ctx.beginPath();ctx.moveTo(a.left,y.getPixelForValue(0));ctx.lineTo(a.right,y.getPixelForValue(0));ctx.stroke();ctx.restore();}};
  draw("swDisp",{type:"scatter",plugins:[line,groupsPlugin(()=>true)],data:{datasets:[
      {key:k,label:nameOf(k),data:pts.map(r=>({x:r.carry,y:-r.side,r})),backgroundColor:alpha(colorOf(k),.9),pointRadius:6,pointHoverRadius:8},
      {label:"Average",data:[{x:mean(pts.map(r=>r.carry)),y:-mean(pts.map(r=>r.side))}],pointStyle:"crossRot",pointRadius:9,borderWidth:2.5,borderColor:"#f1ead0",backgroundColor:"#f1ead0"}]},
    options:{maintainAspectRatio:false,interaction:{mode:"nearest",intersect:true},
      onClick:(e,els)=>{const el=els.find(x=>x.datasetIndex===0); if(el) openShot(state.i,k,pts[el.index].n);},
      scales:{x:{min:x0,max:x1,grid,title:{display:true,text:"Carry (yd)"}},y:{min:-my,max:my,grid,ticks:{stepSize:10,callback:v=>v===0?"0":`${Math.abs(v)} ${v>0?"L":"R"}`},title:{display:true,text:"↑ left · right ↓ (yd)"}}},
      plugins:{legend:{position:"bottom"},tooltip:{callbacks:{title:it=>it[0].raw.r?`${nameOf(k)} · ${shotLabel(it[0].raw.r)}`:"Average",label:c=>c.raw.r?`carry ${f(c.raw.r.carry)} yd · ${lr(c.raw.r.side)}`:`carry ${f(c.raw.x)} yd · ${lr(-c.raw.y)}`}}}}});
}

/* ================= session picker + summary (Session and Swing tabs only) ================= */
const pickerHTML = () => `<div class="date">
    <button class="btn icon" data-pick="-1" aria-label="Previous session" ${state.i<=0?"disabled":""}>‹</button>
    <select data-pick-sel aria-label="Session">${VIEWS.map((A,i)=>`<option value="${i}" ${i===state.i?"selected":""}>${sName(i)} · ${sDate(A)}</option>`).reverse().join("")}</select>
    <button class="btn icon" data-pick="1" aria-label="Next session" ${state.i>=VIEWS.length-1?"disabled":""}>›</button></div>`;
function wirePicker(root){
  root.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ state.i=Math.max(0,Math.min(VIEWS.length-1,state.i+ +b.dataset.pick)); render(); });
  root.querySelectorAll("[data-pick-sel]").forEach(el=>el.onchange=()=>{ state.i=+el.value; render(); });
}
function overviewHTML(){
  const balls = A => A.keys.reduce((n,k)=>n+A.clubs[k].n,0);
  const total = ALL.reduce((n,A)=>n+balls(A),0);
  const hit = new Set(ALL.flatMap(A=>A.keys.filter(k=>CLUB[k])));
  const fullSw = new Set(ALL.flatMap(A=>A.keys.filter(k=>CLUB[k] && !A.clubs[k].partial)));
  const partialOnly = [...hit].filter(k=>!fullSw.has(k)).sort((a,b)=>loftOf(a)-loftOf(b));
  const bagN = MAIN.filter(c=>c.key!=="Putter").length;
  const nCur = ALL.filter(A=>A.meta.curated).length;
  const A = VIEW();
  return `<section class="overview">
    <div class="ov now"><div class="l">${A.s.combined?"Showing":"This session"}</div><div class="v">${balls(A)} balls</div><div class="c">${sDate(A)} · ${A.keys.length} clubs</div></div>
    <div class="ov"><div class="l">All sessions</div><div class="v">${ALL.length}</div><div class="c">${sDate(ALL[0])}${ALL.length>1?" → "+sDate(ALL[ALL.length-1]):""}</div></div>
    <div class="ov"><div class="l">Balls hit, all sessions</div><div class="v">${total.toLocaleString()}</div><div class="c">${nCur===ALL.length?"recorded (mishits removed)":nCur?`${nCur} of ${ALL.length} sessions best shots only`:"every shot recorded"}</div></div>
    <div class="ov"><div class="l">Clubs hit</div><div class="v">${hit.size} / ${bagN}</div><div class="c">${partialOnly.length?`${partialOnly.map(nameOf).join(", ")} partial swings only`:`all full swings`}</div></div></section>`;
}

/* ================= quick tour ================= */
// One step per tab: what it is, why it helps, one thing to try (a sentence each).
const TOUR = [
  // show = area to spotlight, target = what to click, done = true once they've done it
  {tab:"session", title:"Session", what:"Your simulator session in one place: headline numbers, what to work on, and charts you can switch between.", why:"It boils every shot down to the few things worth fixing first.", try:"This is your distance per club; click Dispersion to see where those shots landed.",
   prep:()=>{state.view="distance";}, show:"#cMain", target:'[data-view="dispersion"]', look:"#cMain", done:()=>state.view==="dispersion"},
  {tab:"swing", title:"Swing", what:"One club at a time: path and face, ball flight, and the camera frames at impact.", why:"It shows how each shot was struck, not just where it went.", try:"Tap a shot to watch it through impact, then close it with the ✕.",
   target:"#crops .crop", scroll:"#crops", done:()=>tourTapped && vEl.hidden},
  {tab:"rounds", title:"Rounds", what:"Your 18Birdies rounds: score trend, where you miss greens, and what distance costs on the course.", why:"It links your practice numbers to real scores.", try:"Click Handicap to see how your handicap has moved.",
   prep:()=>{state.rview="score";}, target:'[data-rview="hcp"]', look:"#rTrend", done:()=>state.rview==="hcp"},
  {tab:"trend", title:"Progress", what:"How your swing numbers move from session to session.", why:"It tells you whether the practice is working.", try:"Change the metric in the By club chart."},
  {tab:"bag", title:"Bag", what:"Every club with its carry, total and spread, measured or estimated.", why:"It shows gaps and overlaps, like the 6-iron versus the 7-wood.", try:"Look for clubs marked est: they still need a session."},
  {tab:"drills", title:"Drills", what:"A short practice plan with drills and videos.", why:"It targets the contact problem that costs you the most yards.", try:"Tick off a task; your progress is saved in this browser."},
];
let tourStep = -1, tourTapped = false, tourWasDone = false, tourScrollId = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Scroll gently so the element sits in the space above the tour card (eased, ~1s; instant if reduced motion is on).
function slowScrollTo(el, dur=1000){
  if (!el) return Promise.resolve();
  const header = document.querySelector(".top").getBoundingClientRect().bottom;
  const card = tourEl.hidden ? 0 : tourEl.getBoundingClientRect().height + 20;
  const r = el.getBoundingClientRect(), room = innerHeight - header - card;
  const want = scrollY + r.top - header - Math.max(12, (room - r.height)/2);
  const to = Math.max(0, Math.min(want, document.documentElement.scrollHeight - innerHeight)), from = scrollY, id = ++tourScrollId;
  if (reduceMotion || Math.abs(to-from) < 4){ scrollTo(0,to); return Promise.resolve(); }
  return new Promise(res => { const t0 = performance.now();
    const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    const step = now => { if (id!==tourScrollId) return res(); const t = Math.min(1,(now-t0)/dur); scrollTo(0, from+(to-from)*ease(t)); placePoint(); t<1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step); });
}
// Bouncing "Click here" / "Tap here" label next to whatever is pulsing.
const pointEl = $("tourPoint"), touch = matchMedia("(pointer: coarse)").matches;
function placePoint(){
  const tgt = document.querySelector(".tour-target");
  if (!tgt || tourStep<0){ pointEl.hidden = true; return; }
  const r = tgt.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight){ pointEl.hidden = true; return; }
  pointEl.textContent = `${touch?"Tap":"Click"} here`; pointEl.hidden = false;
  const w = pointEl.offsetWidth, h = pointEl.offsetHeight, above = r.top > h + 90;
  pointEl.className = above ? "above" : "below";
  pointEl.style.left = Math.max(8, Math.min(innerWidth-w-8, r.left + r.width/2 - w/2)) + "px";
  pointEl.style.top = (above ? r.top - h - 14 : r.bottom + 14) + "px";
}
addEventListener("scroll", ()=>{ if (tourStep>=0) requestAnimationFrame(placePoint); }, {passive:true});
addEventListener("resize", ()=>{ if (tourStep>=0) placePoint(); });
// Spotlight the step's area and pulse the thing to click; re-applied after every render (tabs rebuild their HTML).
function applyTour(){
  document.querySelectorAll(".tour-show,.tour-target").forEach(e=>e.classList.remove("tour-show","tour-target"));
  const t = TOUR[tourStep]; if (!t) return;
  const done = !!(t.done && t.done());
  if (!done) t.show && document.querySelector(t.show)?.closest(".card")?.classList.add("tour-show");
  if (t.tab==="swing" && tourTapped && !vEl.hidden) $("vclose")?.classList.add("tour-target");   // step 2: close the swing frames
  else if (!done) t.target && document.querySelector(t.target)?.classList.add("tour-target");
  const tick = tourEl.querySelector(".tick"); if (tick) tick.hidden = !done;
  tourEl.classList.toggle("mini", done);   // once done, shrink to a slim bar so it doesn't cover the result
  if (done && !tourWasDone){
    const look = t.look && document.querySelector(t.look)?.closest(".card");
    if (look) slowScrollTo(look, 800).then(placeTour); else placeTour();
  }
  tourWasDone = done;
  placePoint();
}
// Put the card at the bottom unless that would cover what the step points at; then use the top.
function placeTour(){
  const t = TOUR[tourStep]; tourEl.classList.remove("at-top"); if (!t) return;
  const sel = t.look || t.show; if (!sel) return;   // Swing has nothing to keep in view (the viewer sits on top)
  const look = document.querySelector(sel)?.closest(".card"); if (!look) return;
  const r = look.getBoundingClientRect(), c = tourEl.getBoundingClientRect();
  if (r.bottom > c.top - 8 && r.top < c.bottom) tourEl.classList.add("at-top");
}
const tourEl = $("tour");
function showTour(i){
  tourStep = i; const t = TOUR[i]; tourTapped = false; tourWasDone = false; t.prep?.();
  tourEl.classList.remove("mini","at-top");
  state.tab = t.tab; render(); scrollTo({top:0});
  document.querySelectorAll(".tabs .btn").forEach(b=>b.classList.toggle("tour-hl", b.dataset.tab===t.tab));
  document.querySelector(`.tabs .btn[data-tab="${t.tab}"]`)?.scrollIntoView({block:"nearest",inline:"center"});
  tourEl.innerHTML = `<div class="step">Quick tour · ${i+1} of ${TOUR.length}<span class="mini-title"> · ${t.title}</span> <span class="tick good" hidden>✓</span></div><h3 id="tourTitle">${t.title}</h3>
    <p><b>What:</b> ${t.what}</p><p><b>Why:</b> ${t.why}</p><p class="try"><b>Try:</b> ${t.try}</p>
    <div class="acts"><button class="btn sm" data-t="skip">Skip</button><div class="dots">${TOUR.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
      <div class="row-btns">${i>0?`<button class="btn sm" data-t="back">Back</button>`:""}<button class="btn sm" data-t="next" aria-pressed="true">${i<TOUR.length-1?"Next":"Done"}</button></div></div>`;
  tourEl.hidden = false;
  applyTour();
  const focus = document.querySelector(t.scroll || t.show || t.target);
  const card = focus && (focus.closest(".card") || focus);
  if (card) setTimeout(()=>slowScrollTo(card, 1100).then(placePoint), 450);
  tourEl.querySelector('[data-t="next"]').focus({preventScroll:true});
}
function endTour(){
  tourEl.hidden = true; tourStep = -1; tourScrollId++; store.set("golf-tour-v1", true); applyTour(); tourEl.classList.remove("mini","at-top"); pointEl.hidden = true;
  document.querySelectorAll(".tabs .btn").forEach(b=>b.classList.remove("tour-hl"));
  state.tab = "session"; render(); scrollTo({top:0});
}
tourEl.addEventListener("click", e => { const a = e.target.closest("[data-t]")?.dataset.t; if (!a) return;
  if (a==="skip") endTour(); else if (a==="back") showTour(tourStep-1); else if (tourStep < TOUR.length-1) showTour(tourStep+1); else endTour(); });
document.addEventListener("keydown", e => { if (tourEl.hidden || !vEl.hidden) return;
  if (e.key==="Escape") endTour(); else if (e.key==="ArrowRight") tourEl.querySelector('[data-t="next"]').click(); else if (e.key==="ArrowLeft" && tourStep>0) showTour(tourStep-1); }, true);  // capture: runs before the shot viewer handles Esc
$("tourBtn").onclick = () => showTour(0);
document.addEventListener("click", e => { if (tourStep>=0 && TOUR[tourStep].tab==="swing" && e.target.closest("#crops .crop")){ tourTapped = true; setTimeout(applyTour, 0); } }, true);
new MutationObserver(()=>{ if (tourStep>=0 && !vEl.hidden) applyTour(); }).observe(vEl, {childList:true});   // viewer re-renders (prev/next shot)

/* ================= wiring ================= */
const TABS = {session:renderSession, swing:renderSwing, rounds:renderRounds, trend:renderTrend, bag:renderBag, drills:renderDrills};
function render(){
  if (!ALL.length) return;
  document.querySelectorAll("main").forEach(m=>m.hidden = m.id!=="tab-"+state.tab);
  document.querySelectorAll(".tabs .btn").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  TABS[state.tab]();
  history.replaceState(null,"",`#${state.i>=ALL.length?"all":"s"+(state.i+1)}/${state.tab}`);
  if (typeof applyTour==="function" && tourStep>=0) applyTour();
}
const [hd,ht] = location.hash.slice(1).split("/"), hn = /^s(\d+)$/.exec(hd||""), hi = hd==="all" && COMBINED ? ALL.length : hn ? +hn[1]-1 : -1;
if (hi>=0 && hi<VIEWS.length) state.i = hi; if (TABS[ht]) state.tab = ht;
document.querySelectorAll(".tabs .btn").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();scrollTo({top:0});});
const tipEl = $("tip");
document.addEventListener("mouseover",e=>{const t=e.target.closest("[data-tip]");if(!t){tipEl.hidden=true;return;}tipEl.textContent=t.dataset.tip;tipEl.hidden=false;const r=t.getBoundingClientRect();
  tipEl.style.left=Math.min(innerWidth-tipEl.offsetWidth-8,Math.max(8,r.left))+"px";tipEl.style.top=(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8)+"px";});
addEventListener("scroll",()=>tipEl.hidden=true,{passive:true});
$("foot").textContent = `Built ${DATA.built} · Benchmarks: TrackMan Tour averages, Shot Scope 25-handicap`;
if (ALL.length) render(); else $("tab-session").innerHTML = `<section class="card empty">No sessions yet.</section>`;
if (ALL.length && !store.get("golf-tour-v1", false)) showTour(0);   // first visit only; the Tour button replays it
</script>
</body>
</html>
